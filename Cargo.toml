[workspace]
members = [
    ".",
    "crates/kingfisher-core",
    "crates/kingfisher-rules",
    "crates/kingfisher-scanner",
    "tools/rule-bundle",
    "crates/kingfisher-python",
    "crates/kingfisher-node",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Mick Grove <mick.grove@mongodb.com>"]
homepage = "https://github.com/mongodb/kingfisher"
repository = "https://github.com/mongodb/kingfisher"
publish = ["crates-io"]

[workspace.dependencies]
anyhow = "1.0"
bip32 = { version = "0.6.0", default-features = false, features = ["secp256k1", "alloc"] }
bip39 = { version = "3.0.0", default-features = false, features = ["std", "zeroize"] }
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.7"
schemars = "1.2"
regex = "1.13"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "meta", "hybrid"] }
regex-syntax = "0.8"
bstr = { version = "1.13", features = ["serde"] }
smallvec = { version = "1.16.5", features = ["const_generics", "const_new", "union"] }
parking_lot = "0.13"
tracing = "0.1"
# Cache compatibility includes the exact binding/native crate build identity.
kingfisher-vectorscan = "=0.1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ignore = "0.4"
walkdir = "2.5"
sha1 = "0.11"
sha2 = "0.11"
sha3 = { version = "0.12", default-features = false }
hmac = "0.13"
base64 = "0.23"
percent-encoding = "2.3"
time = "0.3"
uuid = "1.29.2"
rand = "0.10"
hex = "0.4"
rustc-hash = "2.1"
http = "1.5"
zeroize = "1.9"
tiktoken-rs = "0.12"
thread_local = "1.1.10"


[package]
name = "kingfisher-bin"
version = "2.19.1"
description = "MongoDB's blazingly fast and accurate secret scanning, validation, blast radius mapping, and secret revocation tool"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
# Anchor root documents: basename patterns also match the SDK's nested copies.
include = ["src/**", "examples/**", "build.rs", "build_support.rs", "docs/viewer/**", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES", "third-party/**", "/README.md", "/Cargo.lock"]

[lib]
name = "kingfisher"
path = "src/lib.rs"

[[bin]]
name = "kingfisher"
path = "src/main.rs"

[package.metadata.deb]
name = "kingfisher"
maintainer = "Mick Grove <mick.grove@mongodb.com>"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/kingfisher", "/usr/bin/kingfisher", "755"],
    ["NOTICE", "/usr/share/doc/kingfisher/NOTICE", "644"],
    ["THIRD_PARTY_NOTICES", "/usr/share/doc/kingfisher/THIRD_PARTY_NOTICES", "644"],
    ["third-party/kingfisher-vectorscan/NOTICE", "/usr/share/doc/kingfisher/kingfisher-vectorscan-NOTICE", "644"]
]

[package.metadata.generate-rpm]
# Keep the OS package identity independent of the Cargo/PyPI package name.
name = "kingfisher"
release = "1"
summary = "MongoDB's blazingly fast and accurate secret scanning and validation tool"
license = "Apache-2.0"
url = "https://github.com/mongodb/kingfisher"
assets = [
    { source = "target/release/kingfisher", dest = "/usr/bin/kingfisher", mode = "755" },
    { source = "NOTICE", dest = "/usr/share/doc/kingfisher/NOTICE", mode = "644", doc = true },
    { source = "THIRD_PARTY_NOTICES", dest = "/usr/share/doc/kingfisher/THIRD_PARTY_NOTICES", mode = "644", doc = true },
    { source = "third-party/kingfisher-vectorscan/NOTICE", dest = "/usr/share/doc/kingfisher/kingfisher-vectorscan-NOTICE", mode = "644", doc = true }
]

# Migrate RPMs accidentally published under the Cargo package name through v2.11.0.
# Keep this bound fixed: future releases use the canonical kingfisher identity.
[package.metadata.generate-rpm.obsoletes]
kingfisher-bin = "<= 2.11.0-1"

[package.metadata.generate-rpm.provides]
kingfisher-bin = "= 2.11.0-1"

[dependencies]
# Library crates
kingfisher-core = { version = "2.0.0", path = "crates/kingfisher-core" }
kingfisher-rules = { version = "3.2.1", path = "crates/kingfisher-rules" }
kingfisher-scanner = { version = "4.0.0", path = "crates/kingfisher-scanner", features = ["validation", "archives", "context", "extraction", "git", "__cli-internals"] }

clap = { version = "4.6", default-features = false, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "usage",
] }

anyhow = "1.0"
bstr = { version = "1.13", features = ["serde"] }
fixedbitset = "0.5.9"
# Native repository access, clone/fetch, authentication, and checkout (no Git executable).
gix = { version = "0.90", default-features = false, features = ["max-performance", "serde", "sha1", "revision", "revparse-regex", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation"] }
ignore = "0.4"
# Only the directed adjacency graph is used, not graphmap/stable/matrix graphs.
petgraph = { version = "0.8", default-features = false, features = ["std"] }
roaring = "0.12"
same-file = "1.0"
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
smallvec = { version = "1.16.5", features = [
    "const_generics",
    "const_new",
    "union",
] }
tracing = "0.1.44"
indicatif = { version = "0.18", default-features = false, features = ["improved_unicode"] }
rayon = "1.12"
hex = "0.4.3"
kingfisher-vectorscan.workspace = true
regex = "1.13.1"
serde_json = "1.0.154"
# Preserve the CLI 2.x TOON wire format; 0.7 changes folding and array layouts.
toon-format = { version = "=0.5.0", default-features = false }
url = "2.5.8"
webbrowser = "1.2.7"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
    "form",
    "query",
    "stream",
    "http2",
    "rustls",
    "blocking",
    "multipart",
] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }


chrono = "0.4.45"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
console = "0.16.6"
tempfile = "3.27.0"
http = "1.5.0"
liquid = "0.26.11"
liquid-core = "0.26.11"
flate2 = "1.1.11"
crossbeam-skiplist = "0.1.3"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
mongodb = { version = "3.10.1", default-features = false, features = ["rustls-tls-aws-lc", "aws-auth", "compat-3-0-0", "dns-resolver"] }
# Keep compression, AWS-LC and TLS 1.2; no custom FromRow/FromValue derives are used.
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "tls12", "aws-lc-rs"] }
aws-config = { version = "1.13.2", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.3.1"
aws-sdk-sts = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1.7.0"
parking_lot = "0.13"
tracing-subscriber = "0.3.23"
tracing-core = "0.1.36"
aws-smithy-runtime-api = "1.21.0"
aws-smithy-types = "1.9.4"
tl = "0.7.8"
tree_magic_mini = "3.2"
rustc-hash = "2.1.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate", "deflate64", "time"] }
tar = "0.4.46"
blake3 = "1.8.7"
memchr = "2.8"
futures = "0.3.34"
dashmap = "6.2.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3", "const_xxh3"] }
yaml_serde.workspace = true
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
humantime = "2.4.0"
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
rustls = "0.23.46"
webpki-roots = "1.0.12"
tokio-postgres-rustls = "0.14.0"
# Keep native libraries on their allocator: interposing malloc/free can run mimalloc
# before initialization (for example, glibc's free(NULL) during C++ startup).
mimalloc = "0.1.52"
thread_local = "1.1.10"
uuid = "1.29.2"
rand = "0.10.3"
percent-encoding = "2.3.2"
# Keep the platform-specific, atomic running-executable replacement primitive.
self-replace = "1.5.1"
semver = "1.0.28"
globset = "0.4.21"
time = { workspace = true, features = ["serde-well-known"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe", "aws-lc-rs"] }
walkdir = "2.5.0"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1.279.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.139.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.158.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1.162.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1.140.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.136.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrock = { version = "1.168.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Keep maintained ADC/service-account discovery and token refresh, but use the
# existing HTTP client for the three read-only GCS storage operations we need.
gcloud-auth = { version = "1.4.0", default-features = false, features = ["rustls-tls", "jwt-aws-lc-rs"] }
token-source = "1.0"
bytes = "1.12.1"
# Parse configured SSH executable/arguments without invoking a local shell.
shlex = "2.0"


[dependencies.tikv-jemallocator]
version = "0.7"
optional = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
flate2 = "1.1.11"

[features]
default = ["use-mimalloc"]
use-mimalloc = []
use-jemalloc = ["tikv-jemallocator"]
system-alloc = [] # Darwin-only: force the system allocator

[dev-dependencies]
# Archive/SQLite/TLS implementations live in the scanner; the CLI only uses
# these crates directly when constructing test fixtures.
lzma-rs = "0.3.0"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio-rustls = "0.26.6"
temp-env = { version = "0.3.6", features = ["async_closure"] }
wiremock = "0.6.5"
# Generate TLS fixtures with the same crypto backend as production clients.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Enable fixture pack writing in the Git implementation already used at runtime.
gix-pack = { version = "0.77.0", default-features = false, features = ["generate", "streaming-input"] }
# Preserve Docker Hub credential-helper support in the lightweight live-test fixture.
docker_credential = "1.4.0"
predicates = "3.1.4"
assert_cmd = "2.2.2"
# Keep fork/timeout support; none of our strategies require optional bit sets.
proptest = { version = "1.12.0", default-features = false, features = ["std", "fork", "timeout"] }
# Test-only: generate ephemeral strong and legacy RSA JWT fixtures, including
# sub-1024-bit keys via the explicit hazmat constructor (never for production signing).
# PSS support is unconditional in RSA 0.10; PKCS#1 v1.5 is opt-in.
rsa = { version = "0.10", features = ["getrandom", "pkcs1v15", "hazmat"] }

[profile.release]
debug = false
strip = true
opt-level = 3            # Optimize scanning throughput; cold crates stay size-focused below
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Enable whole-crate optimization at the cost of compile time
panic = "abort"          # Remove Rust panic unwinding; native unwind metadata may remain
rpath = false           # Don't embed path dependencies
incremental = false



# Keep throughput-sensitive scanner, matcher, crypto, and transport crates at
# the global `3` level. The crates below are cold or infrequently used in the
# common local-repository scan path, so `z` is a safer size trade-off.
#
# Hot-path crates kept at `3` include: kingfisher-vectorscan, regex, bstr, memmap2,
# memchr, ignore, walkdir, rayon, xxhash-rust, rustc-hash, crossbeam-*, smallvec,
# dashmap, globset, rusqlite, tree-magic-mini,
# cssparser, tl, gix, petgraph, roaring, fixedbitset, serde_json,
# yaml_serde, chrono, parking_lot, rustls, reqwest, tokio, hyper, and the
# kingfisher-* workspace crates.

# ── CLI / startup-only ────────────────────────────────────────────────
[profile.release.package.clap]
opt-level = "z"

[profile.release.package.clap_builder]
opt-level = "z"

[profile.release.package.semver]
opt-level = "z"

# ── Object metadata ─────────────────────────────────────────────────
[profile.release.package.object]
opt-level = "z"

# ── Update / browser / collaboration-platform integrations ───────────
[profile.release.package.self-replace]
opt-level = "z"

[profile.release.package.webbrowser]
opt-level = "z"

# ── AWS SDK and Smithy (credential validation and access mapping) ────
# aws-lc-rs / aws-lc-sys are intentionally excluded — they are the
# crypto/TLS backend for rustls and remain at the global `3` level.
[profile.release.package.aws-config]
opt-level = "z"

[profile.release.package.aws-credential-types]
opt-level = "z"

[profile.release.package.aws-runtime]
opt-level = "z"

[profile.release.package.aws-sdk-bedrock]
opt-level = "z"

[profile.release.package.aws-sdk-dynamodb]
opt-level = "z"

[profile.release.package.aws-sdk-ec2]
opt-level = "z"

[profile.release.package.aws-sdk-ecr]
opt-level = "z"

[profile.release.package.aws-sdk-iam]
opt-level = "z"

[profile.release.package.aws-sdk-kms]
opt-level = "z"

[profile.release.package.aws-sdk-lambda]
opt-level = "z"

[profile.release.package.aws-sdk-rds]
opt-level = "z"

[profile.release.package.aws-sdk-s3]
opt-level = "z"

[profile.release.package.aws-sdk-secretsmanager]
opt-level = "z"

[profile.release.package.aws-sdk-sns]
opt-level = "z"

[profile.release.package.aws-sdk-sqs]
opt-level = "z"

[profile.release.package.aws-sdk-sso]
opt-level = "z"

[profile.release.package.aws-sdk-ssooidc]
opt-level = "z"

[profile.release.package.aws-sdk-ssm]
opt-level = "z"

[profile.release.package.aws-sdk-sts]
opt-level = "z"

[profile.release.package.aws-sigv4]
opt-level = "z"

[profile.release.package.aws-smithy-async]
opt-level = "z"

[profile.release.package.aws-smithy-checksums]
opt-level = "z"

[profile.release.package.aws-smithy-eventstream]
opt-level = "z"

[profile.release.package.aws-smithy-http]
opt-level = "z"

[profile.release.package.aws-smithy-http-client]
opt-level = "z"

[profile.release.package.aws-smithy-json]
opt-level = "z"

[profile.release.package.aws-smithy-observability]
opt-level = "z"

[profile.release.package.aws-smithy-query]
opt-level = "z"

[profile.release.package.aws-smithy-runtime]
opt-level = "z"

[profile.release.package.aws-smithy-runtime-api]
opt-level = "z"

[profile.release.package.aws-smithy-schema]
opt-level = "z"

[profile.release.package.aws-smithy-types]
opt-level = "z"

[profile.release.package.aws-smithy-xml]
opt-level = "z"

[profile.release.package.aws-types]
opt-level = "z"

# ── Database validation (MongoDB / MySQL / Postgres — I/O-bound) ─────
[profile.release.package.mongodb]
opt-level = "z"

[profile.release.package.bson]
opt-level = "z"

[profile.release.package.mysql_async]
opt-level = "z"

[profile.release.package.mysql_common]
opt-level = "z"

[profile.release.package.tokio-postgres]
opt-level = "z"

[profile.release.package.tokio-postgres-rustls]
opt-level = "z"

[profile.release.package.rustc_version_runtime]
