[workspace]
members = [
    ".",
    "crates/kingfisher-core",
    "crates/kingfisher-rules",
    "crates/kingfisher-scanner",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Mick Grove <mick.grove@mongodb.com>"]
homepage = "https://github.com/mongodb/kingfisher"
repository = "https://github.com/mongodb/kingfisher"
publish = false

[workspace.dependencies]
anyhow = "1.0"
bip32 = { version = "0.5.3", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
regex = "1.12"
bstr = { version = "1.12", features = ["serde"] }
smallvec = { version = "1", features = ["const_generics", "const_new", "union"] }
parking_lot = "0.12"
tracing = "0.1"
vectorscan-rs = "0.0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ignore = "0.4"
walkdir = "2.5"
sha1 = "0.11"
sha2 = "0.11"
sha3 = { version = "0.12", default-features = false }
hmac = "0.13"
base32 = "0.5.1"
base64 = "0.23"
percent-encoding = "2.3"
time = "0.3"
uuid = "1.23"
rand = "0.10"
hex = "0.4"
rustc-hash = "2.1"
http = "1.4"
zeroize = "1.8"


[package]
name = "kingfisher"
version = "1.113.0"
description = "MongoDB's blazingly fast and accurate secret scanning and validation tool"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.deb]
name = "kingfisher"
maintainer = "Mick Grove <mick.grove@mongodb.com>"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/kingfisher", "/usr/bin/kingfisher", "755"],
    ["NOTICE", "/usr/share/doc/kingfisher/NOTICE", "644"],
    ["THIRD_PARTY_NOTICES", "/usr/share/doc/kingfisher/THIRD_PARTY_NOTICES", "644"],
    ["vendor/vectorscan-rs/NOTICE", "/usr/share/doc/kingfisher/vectorscan-rs-NOTICE", "644"]
]

[package.metadata.generate-rpm]
package = "kingfisher"
summary = "MongoDB's blazingly fast and accurate secret scanning and validation tool"
license = "Apache-2.0"
url = "https://github.com/mongodb/kingfisher"
assets = [
    { source = "target/release/kingfisher", dest = "/usr/bin/kingfisher", mode = "755" },
    { source = "NOTICE", dest = "/usr/share/doc/kingfisher/NOTICE", mode = "644", doc = true },
    { source = "THIRD_PARTY_NOTICES", dest = "/usr/share/doc/kingfisher/THIRD_PARTY_NOTICES", mode = "644", doc = true },
    { source = "vendor/vectorscan-rs/NOTICE", dest = "/usr/share/doc/kingfisher/vectorscan-rs-NOTICE", mode = "644", doc = true }
]

[dependencies]
# Library crates
kingfisher-core = { path = "crates/kingfisher-core" }
kingfisher-rules = { path = "crates/kingfisher-rules" }
kingfisher-scanner = { path = "crates/kingfisher-scanner", features = ["validation-all"] }

clap = { version = "4.6", default-features = false, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "usage",
] }

anyhow = "1.0"
bstr = { version = "1.12", features = ["serde"] }
fixedbitset = "0.5"
gix = { version = "0.86", features = ["max-performance-safe", "serde", "blocking-network-client"] }
ignore = "0.4"
petgraph = "0.8"
roaring = "0.11.4"
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
smallvec = { version = "1", features = [
    "const_generics",
    "const_new",
    "union",
] }
tracing = "0.1.44"
indicatif = { version = "0.18", features = ["improved_unicode"] }
rayon = "1.12"
hex = "0.4.3"
vectorscan-rs = "0.0.6"
regex = "1.12.4"
serde_json = "1.0.150"
toon-format = { version = "0.5.0", default-features = false }
url = "2.5.8"
strum = { version = "0.28", features = ["derive"] }
sysinfo = "0.39.3"
webbrowser = "1.2.1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
    "form",
    "query",
    "stream",
    "rustls",
    "blocking",
    "multipart",
] }
# gouqi 0.20 exposes reqwest 0.12's Client in its public async constructor.
reqwest_0_12 = { package = "reqwest", version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
    "multipart",
] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }


chrono = "0.4.45"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
base64 = "0.23.0"
crossbeam-channel = "0.5.15"
indenter = "0.3.4"
serde-sarif = "0.8"
console = "0.16.3"
tempfile = "3.27.0"
http = "1.4.2"
liquid = "0.26.11"
liquid-core = "0.26.11"
flate2 = "1.1"
thousands = "0.2.0"
crossbeam-skiplist = "0.1.3"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# Temporary Git pin: keeps MongoDB SRV validation enabled while using the upstream
# Hickory 0.26 DNS-resolver fix before it is available in a crates.io release.
# TODO: switch back to a crates.io mongodb release once it includes that fix.
mongodb = { git = "https://github.com/mongodb/mongo-rust-driver", rev = "0f628f2a4b3102c4bff854a0da6938c691bd5871", default-features = false, features = ["rustls-tls-aws-lc", "aws-auth", "compat-3-0-0", "dns-resolver"] }
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls"] }
aws-config = { version = "1.8.18", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.2.14"
aws-sdk-sts = { version = "1.107.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1.3.16"
parking_lot = "0.12.5"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"] }
tracing-core = "0.1.36"
aws-smithy-http-client = "1.1.13"
aws-smithy-runtime-api = "1.12.3"
aws-smithy-types = "1.5.0"
cssparser = { version = "0.37.0", default-features = false }
tl = "0.7.8"
tree_magic_mini = "3.2"
content_inspector = "0.2.4"
rustc-hash = "2.1.2"
bzip2-rs = "0.1.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "time"] }
tar = "0.4.46"
lzma-rs = "0.3.0"
asar = "0.3.0"
cfb = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8.5"
memchr = "2.8"
memmap2 = "0.9.10"
futures = "0.3.32"
dashmap = "6.2.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
serde_yaml = "0.9.34"
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
humantime = "2.3.0"
path-dedot = "4.0.1"
quick-xml = { version = "0.41.0", features = ["serde", "serialize"] }
rustls = "0.23.40"
tokio-postgres-rustls = "0.14.0"
rustls-native-certs = "0.8.4"
mimalloc = { version = "0.1.52", features = ["override"] }
thread_local = "1.1.9"
bloomfilter = "3.0.1"
uuid = "1.23.3"
rand = "0.10.1"
percent-encoding = "2.3.2"
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
semver = "1.0.28"
globset = "0.4.18"
ipnet = "2.12.0"
gouqi = { version = "0.20.0", features = ["async"] }
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
walkdir = "2.5.0"
aws-sdk-s3 = { version = "1.137.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1.113.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1.232.1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.116.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.111.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.108.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.102.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.104.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1.137.1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1.120.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.113.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
gcloud-storage = { version = "1.3.0", default-features = false, features = [
    "rustls-tls",
    "auth",
    "jwt-aws-lc-rs",
] }
tokei = "14.0.0"
crc32fast = "1.5.0"
bytes = "1.12.0"
tokio-rustls = "0.26.4"
h2 = "0.4.15"
wait-timeout = "0.2"


[dependencies.tikv-jemallocator]
version = "0.7"
optional = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1.1"

[features]
default = ["use-mimalloc"]
use-mimalloc = []
use-jemalloc = ["tikv-jemallocator"]
system-alloc = [] # Darwin-only: force the system allocator

[dev-dependencies]
pretty_assertions = "1.4"
temp-env = { version = "0.3.6", features = ["async_closure"] }
wiremock = "0.6.5"
git2 = { version = "0.21.0", default-features = false }
rand_chacha = "0.10.0"
testcontainers = "0.27.3"
predicates = "3.1.4"
assert_cmd = "2.2.2"
proptest = "1.11.0"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
# Test-only: generate an ephemeral RSA keypair for the RS256 JWT regression test.
# `getrandom` enables `rsa::rand_core::OsRng`; `pem` is on by default for PEM export.
rsa = { version = "0.9.10", features = ["getrandom"] }

[profile.release]
debug = false
strip = true
opt-level = "s"          # Optimize for smaller binary size over speed
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Optimize for size but slower compilation
panic = "abort"          # Remove unwind tables for panics
rpath = false           # Don't embed path dependencies
incremental = false



# Keep throughput-sensitive scanner, matcher, crypto, and transport crates at
# the global `s` level.  The crates below are cold or infrequently used in the
# common local-repository scan path, so `z` is a safer size trade-off.
#
# Hot-path crates kept at `s` include: vectorscan-rs, regex, bstr, memmap2,
# memchr, ignore, walkdir, rayon, xxhash-rust, rustc-hash, crossbeam-*, smallvec,
# dashmap, bloomfilter, globset, rusqlite, tree-magic-mini, content_inspector,
# cssparser, tl, gix, petgraph, roaring, fixedbitset, path-dedot, serde_json,
# serde_yaml, chrono, parking_lot, rustls, reqwest, tokio, hyper, and the
# kingfisher-* workspace crates.

# ── CLI / startup-only ────────────────────────────────────────────────
[profile.release.package.clap]
opt-level = "z"

[profile.release.package.clap_builder]
opt-level = "z"

[profile.release.package.strum]
opt-level = "z"

[profile.release.package.sysinfo]
opt-level = "z"

[profile.release.package.semver]
opt-level = "z"

# ── Panic / backtrace (only reached on crash) ────────────────────────
[profile.release.package.backtrace]
opt-level = "z"

[profile.release.package.object]
opt-level = "z"

[profile.release.package.color-eyre]
opt-level = "z"

# ── Update / browser / collaboration-platform integrations ───────────
[profile.release.package.gouqi]
opt-level = "z"

[profile.release.package.self_update]
opt-level = "z"

[profile.release.package.webbrowser]
opt-level = "z"

# ── AWS SDK and Smithy (credential validation only) ──────────────────
# aws-lc-rs / aws-lc-sys are intentionally excluded — they are the
# crypto/TLS backend for rustls and remain at the global `s` level.
[profile.release.package.aws-config]
opt-level = "z"

[profile.release.package.aws-credential-types]
opt-level = "z"

[profile.release.package.aws-runtime]
opt-level = "z"

[profile.release.package.aws-sdk-dynamodb]
opt-level = "z"

[profile.release.package.aws-sdk-ec2]
opt-level = "z"

[profile.release.package.aws-sdk-ecr]
opt-level = "z"

[profile.release.package.aws-sdk-iam]
opt-level = "z"

[profile.release.package.aws-sdk-kms]
opt-level = "z"

[profile.release.package.aws-sdk-lambda]
opt-level = "z"

