opt-level = "z"

[profile.release.package.aws-sdk-sqs]
opt-level = "z"

[profile.release.package.aws-sdk-sso]
opt-level = "z"

[profile.release.package.aws-sdk-ssooidc]
opt-level = "z"

[profile.release.package.aws-sdk-ssm]
opt-level = "z"

[profile.release.package.aws-sdk-sts]
opt-level = "z"

[profile.release.package.aws-sigv4]
opt-level = "z"

[profile.release.package.aws-smithy-async]
opt-level = "z"

[profile.release.package.aws-smithy-checksums]
opt-level = "z"

[profile.release.package.aws-smithy-eventstream]
opt-level = "z"

[profile.release.package.aws-smithy-http]
