# ── Access map (not local-scan hot path) ─────────────────────────────
[profile.release.package.quick-xml]
opt-level = "z"

[profile.release.package.ipnet]
opt-level = "z"

# ── Web framework (view command / Slack integration only) ───────────
[profile.release.package.axum]
opt-level = "z"

[profile.release.package.axum-core]
opt-level = "z"

[profile.release.package.tower]
opt-level = "z"

