# ── Archive extraction (slow path: tar/gz/bz2/xz/zip/asar/cfb) ───────
[profile.release.package.cfb]
opt-level = "z"

[profile.release.package.bzip2-rs]
opt-level = "z"

[profile.release.package.lzma-rs]
opt-level = "z"

[profile.release.package.tar]
opt-level = "z"

[profile.release.package.flate2]
opt-level = "z"

[profile.release.package.zip]
opt-level = "z"

# Git pack ingestion checks every compressed object, so CRC is a hot path too.
[profile.release.package.crc32fast]
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256

# Fast Windows tests: production optimization is covered by release builds.
# Native Vectorscan stays optimized; avoid optimizing the large Rust SDK graph.
[profile.ci-test]
inherits = "dev"
opt-level = 0
debug = false
incremental = false
lto = "off"
codegen-units = 256

[profile.profiling]
inherits = "release"
debug = true

# Python extensions must let PyO3 contain Rust panics instead of aborting Python.
[profile.python-release]
inherits = "release"
panic = "unwind"
lto = false

# Native Node callbacks must be able to contain panics rather than abort Node.
[profile.node-release]
inherits = "release"
panic = "unwind"
lto = false
