rules:
  - name: Example payment card
    id: acme.structured.card
    pattern: '\bcard[=: ]+([0-9](?:[ -]?[0-9]){12,18})\b'
    confidence: medium
    pattern_requirements:
      checksum:
        actual:
          template: '{{ MATCH | luhn_valid }}'
        expected: 'true'
    examples:
      - 'card=4111 1111 1111 1111'
    negative_examples:
      - 'card=4111 1111 1111 1112'
  - name: Example IBAN
    id: acme.structured.iban
    pattern: '\biban[=: ]+([A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]){11,30})\b'
    confidence: medium
    pattern_requirements:
      checksum:
        actual:
          template: '{{ MATCH | iban_valid }}'
        expected: 'true'
    examples:
      - 'iban=GB82 WEST 1234 5698 7654 32'
    negative_examples:
      - 'iban=GB82 WEST 1234 5698 7654 33'
