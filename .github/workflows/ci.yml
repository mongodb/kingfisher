name: CI Pull Request

on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DOWNLOADS: C:\vcpkg\downloads
  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  # Avoid HTTP/2 framing failures observed on macOS and Windows runners.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  lint:
    name: Rust Clippy and API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config perl curl
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        env:
          CARGO_BUILD_JOBS: 2
      # Workspace feature unification enables validation through the CLI.
      # Check the dependency-light scanner configuration independently as well.
      - run: cargo clippy --locked -p kingfisher-scanner --all-targets --no-default-features -- -D warnings
      - name: Check application API documentation
        run: cargo doc --locked -p kingfisher-bin --no-deps --lib
        env:
          CARGO_BUILD_JOBS: 2
          RUSTDOCFLAGS: -D warnings

  latest-stable:
    name: Check latest stable Rust
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config perl curl
      - name: Check workspace and all targets
        run: cargo check --locked --workspace --all-targets
        env:
          CARGO_BUILD_JOBS: 2

  rule-bundle:
    name: Verify prepared rule bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build maintainer tool
        run: cargo build --locked -p kingfisher-rule-bundle
      - name: Verify artifacts with network disabled
        run: sudo unshare --net target/debug/kingfisher-rule-bundle --check

  library-contract:
    name: Stable library API (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: [default-features, all-features]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PR base still compiles vectorscan-rs-sys from source for semver checks.
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config perl curl libboost-all-dev ragel
      # Plain cargo test includes doctests, unlike --all-targets and nextest.
      - name: Test libraries, consumer contracts, and README examples
        env:
          FEATURE_GROUP: ${{ matrix.features }}
          RUSTDOCFLAGS: -D warnings
        run: |
          if [ "$FEATURE_GROUP" = all-features ]; then
            cargo test --locked -p kingfisher-core -p kingfisher-rules -p kingfisher-scanner --all-features
            cargo doc --locked -p kingfisher-core -p kingfisher-rules -p kingfisher-scanner --no-deps --all-features
          else
            cargo test --locked -p kingfisher-core -p kingfisher-rules -p kingfisher-scanner --no-default-features
            cargo doc --locked -p kingfisher-core -p kingfisher-rules -p kingfisher-scanner --no-deps --no-default-features
          fi
      - name: Test library example behavior and publication planner
        if: matrix.features == 'default-features'
        run: |
          python3 -m unittest discover -s scripts/tests -v
      - name: Check complete validation feature
        if: matrix.features == 'default-features'
        run: cargo check --locked -p kingfisher-scanner --no-default-features --features validation
      - name: Install compatibility checker
        if: github.event_name == 'pull_request'
        run: cargo install --locked cargo-semver-checks --version 0.50.0
      - name: Check public API compatibility against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
          FEATURE_GROUP: ${{ matrix.features }}
        run: |
          python3 scripts/check-library-compatibility.py \
            --baseline-rev "$BASE_REV" --features "$FEATURE_GROUP"

  viewer:
    name: Viewer regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make viewer-tests

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free up disk space on Ubuntu runners
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-tests-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      # Vectorscan uses a prebuilt archive; CMake is retained for AWS-LC.
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config perl curl

      - name: Run tests
        run: make tests
        env:
          # Bound compiler memory while allowing two crates to build concurrently.
          CARGO_BUILD_JOBS: 2
      - name: Run the kingfisher-bin library example
        run: cargo run --locked -p kingfisher-bin --example embedded_application
        env:
          CARGO_BUILD_JOBS: 2

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      # Free up disk space on Ubuntu runners
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-tests-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      
      # Vectorscan uses a prebuilt archive; CMake is retained for AWS-LC.
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config perl curl

      - name: Run tests
        run: make tests
        env:
          # Bound compiler memory while allowing two crates to build concurrently.
          CARGO_BUILD_JOBS: 2

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-14
          - arch: x64
            runs_on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-tests-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      # Retain CMake for AWS-LC; Vectorscan uses a prebuilt archive.
      - name: Install macOS test dependencies
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

      - name: Run tests
        run: make tests

      # Includes the process fixture harness and GPUI's headless UI tests.
      - name: Run wizard regressions
        run: |
          cargo test --locked -p kingfisher-bin --features gui-tests --lib wizard::

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    env:
      # Large static test binaries can exhaust memory when linked concurrently.
      CARGO_BUILD_JOBS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-latest
            msystem: MINGW64
          - arch: arm64
            runs_on: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python runtime for native binding tests
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            git

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-tests-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Prepare Windows dependencies
        shell: msys2 {0}
        run: WINDOWS_ONLY_DEPS=1 make windows-${{ matrix.arch }}

      - name: Run tests
        shell: msys2 {0}
        env:
          KF_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          # MSYS2 does not inherit the full Windows PATH. PyO3's ABI3 test
          # executable needs CPython's python3.dll for the target architecture.
          python_bin_dir="$(dirname "$(cygpath -u "$KF_TEST_PYTHON")")"
          export PATH="$python_bin_dir:$PATH"
          make windows-test-${{ matrix.arch }}

      - name: Test Git for Windows from PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "$env:ProgramFiles/Git/cmd/git.exe",
            "${env:ProgramFiles(x86)}/Git/cmd/git.exe",
            (Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue).Source
          )
          $env:KF_GIT_BINARY = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) {
              $version = & $candidate --version
              if ($LASTEXITCODE -eq 0 -and $version -match '\.windows\.') {
                $env:KF_GIT_BINARY = $candidate
                break
              }
            }
          }
          if (-not $env:KF_GIT_BINARY) { throw 'Git for Windows was not found' }
          & $env:KF_GIT_BINARY --version
          if ($LASTEXITCODE -ne 0) { throw 'Git for Windows is unavailable' }
          $triple = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-gnullvm' } else { 'x86_64-pc-windows-gnu' }
          # These paths match the ci-test profile and default target directory used by
          # make windows-test-* above. Keep them in sync if those build settings change.
          $harnesses = Get-ChildItem "target/$triple/ci-test/deps/kingfisher-*.exe" | Sort-Object LastWriteTime -Descending
          $gitHarnesses = @()
          foreach ($harness in $harnesses) {
            # Cargo also places the regular CLI executable in deps; it rejects --list.
            $previousPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $cases = & $harness.FullName --list 2>$null
              $listed = $LASTEXITCODE -eq 0
            } finally {
              $ErrorActionPreference = $previousPreference
            }
            if (-not $listed) { continue }
            if ($cases -match 'git_binary::tests::git_executable_override_is_literal_and_shared') {
              & $harness.FullName git_binary:: --skip test_create_fresh_clone --skip test_update_clone
              if ($LASTEXITCODE -ne 0) { throw 'Git for Windows regressions failed' }
              $gitHarnesses += $harness
              break
            }
          }
          if (-not $gitHarnesses) { throw 'Git regression harness was not found' }
          $stagedHarnesses = Get-ChildItem "target/$triple/ci-test/deps/smoke_branch-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $stagedHarnesses) { throw 'Staged scan regression harness was not found' }
          foreach ($harness in $stagedHarnesses) {
            & $harness.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Branch/staged scans with Git for Windows failed' }
          }
