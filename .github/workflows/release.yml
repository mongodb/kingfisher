name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DOWNLOADS: C:\vcpkg\downloads
  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  validate-release:
    name: Verify release ref and version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a tag matching the root Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = f"v{version}"
          if os.environ["GITHUB_REF"] != f"refs/tags/{tag}":
              raise SystemExit(f"::error::Release must run on refs/tags/{tag}, matching Cargo.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={os.environ['GITHUB_REF_NAME']}\n")
          PY

  # Tests save their own dependency caches, including Linux debug artifacts.
  # Build jobs run in parallel; publishing waits for both tests and builds.
  tests:
    needs: [validate-release]
    uses: ./.github/workflows/ci.yml

  # ──────────────── Linux (via Makefile) ────────────────
  linux-x64:
    name: Linux x64
    needs: [validate-release]
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free up disk space on Ubuntu runners
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-release-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm
          cargo install cargo-deb cargo-generate-rpm

      # Alpine supplies the GCC musl runtime required by Vectorscan 0.1.2 archives.
      # The reusable CI workflow runs tests separately.
      - name: Build (Makefile linux-x64)
        run: make linux-x64 SKIP_TESTS=1

      - name: Fix permissions
        run: sudo chown -R "$(id -u):$(id -g)" target

      - name: Verify static Linux executable
        run: |
          binary=target/x86_64-unknown-linux-musl/release/kingfisher
          "$binary" --version
          readelf --program-headers --dynamic "$binary" > target/elf-check.txt
          if grep -Eq 'INTERP|NEEDED' target/elf-check.txt; then
            cat target/elf-check.txt
            echo "Expected a static musl executable without shared-library dependencies" >&2
            exit 1
          fi

      - name: Build Debian package
        run: |
          cargo deb --no-build --target x86_64-unknown-linux-musl \
            --output target/release/kingfisher-linux-x64.deb

      - name: Build RPM package
        run: |
          cargo generate-rpm --target x86_64-unknown-linux-musl \
            --output target/release/kingfisher-linux-x64.rpm

      - name: Verify Linux package metadata
        run: python3 scripts/check-linux-packages.py --arch x64

      - name: Test RPM upgrades on Amazon Linux 2023
        run: python3 scripts/test-rpm-upgrades.py --arch x64

      - name: Move artifact to dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/kingfisher-linux-x64.tgz dist/
          cp target/release/kingfisher-linux-x64.deb dist/
          cp target/release/kingfisher-linux-x64.rpm dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-linux-x64.tgz
          path: dist/kingfisher-linux-x64.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-linux-x64.deb
          path: dist/kingfisher-linux-x64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-linux-x64.rpm
          path: dist/kingfisher-linux-x64.rpm

  linux-arm64:
    name: Linux arm64
    needs: [validate-release]
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free up disk space on Ubuntu runners
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-release-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm
          cargo install cargo-deb cargo-generate-rpm

      # Alpine supplies the GCC musl runtime required by Vectorscan 0.1.2 archives.
      # The reusable CI workflow runs tests separately.
      - name: Build (Makefile linux-arm64)
        run: make linux-arm64 SKIP_TESTS=1

      - name: Fix permissions
        run: sudo chown -R "$(id -u):$(id -g)" target

      - name: Verify static Linux executable
        run: |
          binary=target/aarch64-unknown-linux-musl/release/kingfisher
          "$binary" --version
          readelf --program-headers --dynamic "$binary" > target/elf-check.txt
          if grep -Eq 'INTERP|NEEDED' target/elf-check.txt; then
            cat target/elf-check.txt
            echo "Expected a static musl executable without shared-library dependencies" >&2
            exit 1
          fi

      - name: Build Debian package
        run: |
          cargo deb --no-build --target aarch64-unknown-linux-musl \
            --output target/release/kingfisher-linux-arm64.deb

      - name: Build RPM package
        run: |
          cargo generate-rpm --target aarch64-unknown-linux-musl \
            --output target/release/kingfisher-linux-arm64.rpm

      - name: Verify Linux package metadata
        run: python3 scripts/check-linux-packages.py --arch arm64

      - name: Test RPM upgrades on Amazon Linux 2023
        run: python3 scripts/test-rpm-upgrades.py --arch arm64

      - name: Move artifact to dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/kingfisher-linux-arm64.tgz dist/
          cp target/release/kingfisher-linux-arm64.deb dist/
          cp target/release/kingfisher-linux-arm64.rpm dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-linux-arm64.tgz
          path: dist/kingfisher-linux-arm64.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-linux-arm64.deb
          path: dist/kingfisher-linux-arm64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-linux-arm64.rpm
          path: dist/kingfisher-linux-arm64.rpm

  macos-x64:
    name: macOS x64
    needs: [validate-release]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-release-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      # Retain CMake for AWS-LC; Vectorscan uses a prebuilt archive.
      - name: Install macOS build dependencies
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

      - name: Build Darwin x64
        run: make darwin-x64

      - name: Move artifacts to dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/kingfisher-darwin-x64.tgz  dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-darwin-x64.tgz
          path: dist/kingfisher-darwin-x64.tgz

  macos-arm64:
    name: macOS arm64
    needs: [validate-release]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-release-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      # Retain CMake for AWS-LC; Vectorscan uses a prebuilt archive.
      - name: Install macOS build dependencies
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

      - name: Build Darwin arm64
        run: make darwin-arm64

      - name: Move artifacts to dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/kingfisher-darwin-arm64.tgz dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-darwin-arm64.tgz
          path: dist/kingfisher-darwin-arm64.tgz

  # ──────────────── Windows ────────────────
  windows:
    name: Windows ${{ matrix.arch }}
    needs: [validate-release]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-latest
            msystem: MINGW64
          - arch: arm64
            runs_on: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            git

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: kingfisher-release-v2-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Build
        shell: msys2 {0}
        run: make windows-${{ matrix.arch }}

      - name: Move artifact to dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/kingfisher-windows-${{ matrix.arch }}.zip dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingfisher-windows-${{ matrix.arch }}
          path: dist/kingfisher-windows-${{ matrix.arch }}.zip

  release:
    name: Public GitHub Release
    needs: [validate-release, tests, linux-x64, linux-arm64, windows, macos-x64, macos-arm64]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.validate-release.outputs.tag }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kingfisher-*
          path: target/release
          merge-multiple: true
      - name: Require every platform archive and Linux package
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -s "target/release/kingfisher-${platform}.tgz"
          done
          for arch in x64 arm64; do
            test -s "target/release/kingfisher-windows-${arch}.zip"
            for format in deb rpm; do
              test -s "target/release/kingfisher-linux-${arch}.${format}"
            done
          done
      - name: Stage rule provenance and archived inputs
        run: |
          mkdir -p target/release
          tar -czf target/release/kingfisher-rule-bundle.tgz -C crates/kingfisher-rules generated

      - name: Extract latest changelog section
        run: |
          awk '
            BEGIN            { grabbing = 0 }
            /^## \[Unreleased\]/ { next }
            /^## \[/         {
                               if (grabbing) exit;  # already grabbed latest entry
                               grabbing = 1
                             }
            grabbing         { print }
          ' CHANGELOG.md > .latest_changelog.md

      # ── Sign every release artifact with a SLSA v1 build-provenance attestation.
      #    actions/attest-build-provenance produces a multi-subject Sigstore Bundle
      #    in JSONL format and writes it to bundle-path. We ship that file alongside
      #    the binaries as `multiple.intoto.jsonl` so users can verify offline with
      #    `gh attestation verify`, `cosign`, or `slsa-verifier` — no GitHub API call
      #    required at verify time. This also satisfies the OSSF Scorecard
      #    `Signed-Releases` check, which scans for *.intoto.jsonl in release assets.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Include platform packages and the archived rule bundle.
          subject-path: |
            target/release/**/kingfisher-*.tgz
            target/release/**/kingfisher-*.zip
            target/release/**/kingfisher-*.deb
            target/release/**/kingfisher-*.rpm

      - name: Stage attestation bundle as a release asset
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_PATH='${{ steps.attest.outputs.bundle-path }}'
          if [[ -z "${BUNDLE_PATH}" || ! -f "${BUNDLE_PATH}" ]]; then
            echo "::error::attest-build-provenance did not produce a bundle at '${BUNDLE_PATH}'"
            exit 1
          fi
          # Use the slsa-verifier-recognized filename for multi-subject bundles.
          mkdir -p target/release
          cp "${BUNDLE_PATH}" target/release/multiple.intoto.jsonl
          echo "Bundle line count (one DSSE-wrapped attestation per subject):"
          wc -l target/release/multiple.intoto.jsonl

      # Keep new releases and retries in draft until all uploads succeed.
      - name: Create draft release & upload assets
        id: draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.validate-release.outputs.tag }}
          name: "Kingfisher ${{ needs.validate-release.outputs.tag }}"
          bodyFile: .latest_changelog.md # ← only the most-recent entry
          allowUpdates: true
          skipIfReleaseExists: true
          draft: true
          artifactErrorsFailBuild: true
          generateReleaseNotes: false
          artifacts: target/release/*

      - name: Publish release after successful asset uploads
        if: steps.draft.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # ──────────────── Publish Docker image ────────────────
  publish-docker:
    needs: [release]
    uses: ./.github/workflows/release-docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write

  # ──────────────── Publish PyPI wheels ────────────────
  publish-pypi:
    needs: [release]
    uses: ./.github/workflows/pypi.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  publish-crates:
    name: Publish crates.io packages
    needs: [release]
    if: github.repository == 'mongodb/kingfisher'
    runs-on: ubuntu-24.04
    environment: crates-io
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Publish the same commit that passed the build/test jobs above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release tag identifies the tested commit
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config perl curl
      - name: Verify rule bundle and extracted packages before authenticating
        run: |
          cargo run --locked -p kingfisher-rule-bundle -- --check
          cargo package --locked -p kingfisher-core -p kingfisher-rules -p kingfisher-scanner -p kingfisher-bin
      - name: Plan changed releases and reject missing version bumps
        id: plan
        run: python3 scripts/publish-crates.py --tag "$RELEASE_TAG"
      - name: Select bootstrap-token or trusted-publisher authentication
        if: steps.plan.outputs.pending == 'true'
        id: credentials
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Obtain short-lived crates.io token
        if: steps.plan.outputs.pending == 'true' && steps.credentials.outputs.bootstrap == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish missing versions in dependency order
        if: steps.plan.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish-crates.py --tag "$RELEASE_TAG" --publish
