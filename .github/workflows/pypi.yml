name: pypi-wheels

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to package (e.g., v1.2.3)"
        required: true
        type: string
      phase:
        description: Build, or publish the already built wheels after the shared gate
        type: string
        default: build
      use_artifacts:
        description: Package this run's tested binaries instead of a public release
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g., v1.2.3). Leave blank to use the latest release."
        required: false
        type: string

permissions: {}

jobs:
  build-wheels:
    name: Build PyPI wheels
    if: inputs.phase != 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Determine version/tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_TAG}" ]]; then
            set +e
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)"
            gh_status=$?
            set -e
            if [[ ${gh_status} -ne 0 || -z "${TAG}" ]]; then
              echo "No tag provided and failed to determine latest release tag (gh release view exit status: ${gh_status})" >&2
              exit 1
            fi
          else
            TAG="${INPUT_TAG}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid tag format: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.use_artifacts && github.sha || steps.version.outputs.tag }}
          persist-credentials: false

      - name: Download staged Unix binaries from this run
        if: inputs.use_artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: kingfisher-*.tgz
          path: release-assets
          merge-multiple: true
      - name: Download staged Windows binaries from this run
        if: inputs.use_artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: kingfisher-windows-*
          path: release-assets
          merge-multiple: true
      - name: Download release assets
        if: ${{ !inputs.use_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.version.outputs.tag }}" \
            -p "kingfisher-*.tgz" \
            -p "kingfisher-*.zip" \
            -D release-assets

      - name: Extract binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          for archive in release-assets/*; do
            name=$(basename "$archive")
            dir="extracted/${name%.*}"
            mkdir -p "$dir"
            case "$archive" in
              *.tgz)
                tar -xzf "$archive" -C "$dir"
                ;;
              *.zip)
                unzip -q "$archive" -d "$dir"
                ;;
              *)
                echo "Unknown archive: $archive" >&2
                exit 1
                ;;
            esac
          done

          mkdir -p extracted/bin
          while IFS= read -r -d '' bin; do
            chmod +x "$bin" || true
          done < <(find extracted -type f \( -name "kingfisher" -o -name "kingfisher.exe" \) -print0)

      - name: Install build tooling
        run: "python -m pip install --upgrade --only-binary :all: --require-hashes -r .github/requirements/pypi-build.txt"

      - name: Build wheels
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          linux_x64=$(find extracted -type f -name "kingfisher" | grep -m1 "linux-x64")
          linux_arm64=$(find extracted -type f -name "kingfisher" | grep -m1 "linux-arm64")
          mac_x64=$(find extracted -type f -name "kingfisher" | grep -m1 "darwin-x64")
          mac_arm64=$(find extracted -type f -name "kingfisher" | grep -m1 "darwin-arm64")
          win_x64=$(find extracted -type f -name "kingfisher.exe" | grep -m1 "windows-x64")
          win_arm64=$(find extracted -type f -name "kingfisher.exe" | grep -m1 "windows-arm64")

          scripts/build-pypi-wheel.sh \
            --binary "$linux_x64" \
            --version "$version" \
            --plat-name manylinux_2_17_x86_64.musllinux_1_2_x86_64

          scripts/build-pypi-wheel.sh \
            --binary "$linux_arm64" \
            --version "$version" \
            --plat-name manylinux_2_17_aarch64.musllinux_1_2_aarch64

          scripts/build-pypi-wheel.sh \
            --binary "$mac_x64" \
            --version "$version" \
            --plat-name macosx_10_9_x86_64

          scripts/build-pypi-wheel.sh \
            --binary "$mac_arm64" \
            --version "$version" \
            --plat-name macosx_11_0_arm64

          scripts/build-pypi-wheel.sh \
            --binary "$win_x64" \
            --version "$version" \
            --plat-name win_amd64

          scripts/build-pypi-wheel.sh \
            --binary "$win_arm64" \
            --version "$version" \
            --plat-name win_arm64

      - name: Verify all wheels are platform-specific
        shell: bash
        run: |
          set -euo pipefail
          if ls dist-pypi/*-py3-none-any.whl >/dev/null 2>&1; then
            echo "::error::Refusing to publish: pure-Python wheel found in dist-pypi/." >&2
            ls -la dist-pypi/ >&2
            exit 1
          fi
          echo "Wheels to publish:"
          ls -la dist-pypi/

      - name: Validate every wheel archive before the release gate
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import email.parser
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('dist-pypi').glob('*.whl'))
          assert len(wheels) == 6, f'Expected six CLI wheels, found {len(wheels)}'
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  assert archive.testzip() is None, f'Corrupt wheel: {wheel}'
                  metadata = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
                  assert len(metadata) == 1, f'Invalid metadata: {wheel}'
                  headers = email.parser.BytesParser().parsebytes(archive.read(metadata[0]))
                  assert headers['Version'] == os.environ['RELEASE_VERSION'], wheel
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-pypi-staging
          path: dist-pypi/*.whl
          if-no-files-found: error

  publish:
    # Standalone manual calls prepare wheels; only the coordinator supplies this phase.
    if: inputs.phase == 'publish' && github.repository == 'mongodb/kingfisher' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: cli-pypi-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recheck the tested release source
        run: python3 scripts/check-release-source.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cli-pypi-staging
          path: dist-pypi
      - name: Publish the exact staged wheels to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-pypi
          verbose: true
          skip-existing: true
          attestations: false
