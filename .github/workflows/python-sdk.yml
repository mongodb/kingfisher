name: Python SDK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['python-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR checks supersede earlier runs. Every release keeps its own slot,
  # including pending runs: GitHub concurrency is not a FIFO release queue.
  group: python-sdk-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  # A panic in an extension must unwind to PyO3, not abort the Python process.
  CARGO_PROFILE_RELEASE_PANIC: unwind
  CARGO_HTTP_MULTIPLEXING: 'false'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            msystem: MINGW64
            packages: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
            cc: gcc
            cxx: g++
          - os: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-zlib
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: python-${{ matrix.target }}
      - name: Verify SDK release tag
        if: startsWith(github.ref, 'refs/tags/python-v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c 'import os,tomllib; from pathlib import Path; version=tomllib.loads(Path("crates/kingfisher-python/Cargo.toml").read_text())["package"]["version"]; assert os.environ["RELEASE_TAG"] == "python-v" + version'
      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          maturin-version: 'v1.15.0'
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --profile python-release --locked --out dist-python --find-interpreter
          # Published Vectorscan archives require glibc 2.35. Build from the
          # vendored source inside manylinux to keep the advertised 2.28 floor.
          before-script-linux: yum install -y boost-devel ragel perl-core
          docker-options: -e VECTORSCAN_BUILD_FROM_SOURCE=1 -e CARGO_PROFILE_RELEASE_PANIC=unwind -e CARGO_PROFILE_RELEASE_LTO=false
      - name: Build macOS wheel
        if: runner.os == 'macOS'
        run: uv run --no-project --with maturin==1.15.0 maturin build --profile python-release --locked --target ${{ matrix.target }} --out dist-python
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: ${{ matrix.packages }} make git
      - name: Build Windows wheel
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # Keep rustc and native CMake builds within hosted-runner memory limits.
          CARGO_BUILD_JOBS: '2'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_GENERATOR: MinGW Makefiles
          SDK_TARGET: ${{ matrix.target }}
        run: |
          # Vectorscan adds the MSYS2 runtime library directory to rustc's
          # search path. Its Python import libraries shadow PyO3's generated
          # python3.dll import library and link the wheel to libpython3.dll.
          # These runners build for standard CPython, not MSYS2 Python.
          rm -f "$MINGW_PREFIX"/lib/libpython*.dll.a
          uv run --no-project --with maturin==1.15.0 maturin build --profile python-release --locked --target "$SDK_TARGET" --out unrepaired
          # Reject accidental MSYS2 Python linkage before DLL repair can bundle it.
          uv run --no-project --with pefile python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import pefile

          for wheel in Path("unrepaired").glob("*.whl"):
              with ZipFile(wheel) as archive:
                  native = next(name for name in archive.namelist() if name.endswith(".pyd"))
                  binary = pefile.PE(data=archive.read(native))
                  imports = {entry.dll.decode("ascii").lower() for entry in binary.DIRECTORY_ENTRY_IMPORT}
                  python_dlls = {name for name in imports if "python" in name}
                  assert python_dlls == {"python3.dll"}, python_dlls
          PY
          # Bundle GNU/LLVM runtime DLLs; do not rely on MSYS2 at installation.
          uv run --no-project --with delvewheel delvewheel repair --add-path "$(cygpath -w "$MINGW_PREFIX/bin")" --wheel-dir dist-python unrepaired/*.whl
      - name: Install wheel into an isolated environment
        shell: bash
        run: |
          uv venv .venv-wheel --python 3.13
          uv pip install --python .venv-wheel dist-python/*.whl pytest
      - name: Test installed wheel (no editable source imports)
        shell: bash
        run: uv run --no-project --python .venv-wheel python -m pytest python/tests -q
      - name: Seed compiled cache fixtures for other hosts
        shell: bash
        id: cache-fixtures
        run: |
          # Use the same private temporary area as the SDK tests. Windows
          # checkout directories can inherit ACLs that permit other users to
          # replace cache ancestors, so native bytecode correctly bypasses them.
          SDK_CACHE_FIXTURES=$(uv run --no-project --python .venv-wheel python -c 'import tempfile; from pathlib import Path; print(Path(tempfile.mkdtemp(prefix="kingfisher-rule-cache-")).as_posix())')
          echo "path=$SDK_CACHE_FIXTURES" >> "$GITHUB_OUTPUT"
          uv run --no-project --python .venv-wheel python python/tests/cache_portability.py seed "$SDK_CACHE_FIXTURES"
          uv run --no-project --python .venv-wheel python python/tests/cache_portability.py check "$SDK_CACHE_FIXTURES" --require-hit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rule-cache-${{ matrix.target }}
          path: ${{ steps.cache-fixtures.outputs.path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-${{ matrix.target }}
          path: dist-python/*.whl
          if-no-files-found: error

  cache-portability:
    name: Cache portability (${{ matrix.target }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-${{ matrix.target }}
          path: dist-python
      - name: Select private directory for transferred caches
        id: cache-fixtures
        shell: bash
        run: |
          SDK_CACHE_FIXTURES=$(uv run --no-project python -c 'import tempfile; from pathlib import Path; print(Path(tempfile.mkdtemp(prefix="kingfisher-foreign-cache-")).as_posix())')
          echo "path=$SDK_CACHE_FIXTURES" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rule-cache-*
          path: ${{ steps.cache-fixtures.outputs.path }}
      - name: Assign downloaded caches to the Windows runtime account
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_CACHE_FIXTURES: ${{ steps.cache-fixtures.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Artifact extraction can assign Administrators as owner under an
          # elevated token. Normalize only these freshly downloaded fixtures;
          # native bytecode still must pass the existing DACL and path checks.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $fixtures = (Resolve-Path -LiteralPath $env:SDK_CACHE_FIXTURES).Path
          & "$env:SystemRoot\System32\icacls.exe" $fixtures /setowner "*$sid" /T /Q
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot assign cache fixtures to the runtime account"
          }
      - name: Load foreign caches and verify local reuse after fallback
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          SDK_CACHE_FIXTURES: ${{ steps.cache-fixtures.outputs.path }}
        run: |
          uv venv .venv-wheel --python 3.13
          uv pip install --python .venv-wheel dist-python/*.whl
          for cache in "$SDK_CACHE_FIXTURES"/rule-cache-*; do
            # Require reuse from this exact wheel build. Foreign builds may differ
            # in native engine identity even when their CPU baseline is compatible.
            require_hit=()
            if [[ "$cache" == */rule-cache-"$SDK_TARGET" ]]; then
              require_hit=(--require-hit)
            fi
            uv run --no-project --python .venv-wheel python python/tests/cache_portability.py check "$cache" "${require_hit[@]}"
          done

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Format, lint, and shared scanner tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p kingfisher-python --all-targets -- -D warnings
          cargo test --locked -p kingfisher-scanner --features validation validation::revocation
          cargo test --locked -p kingfisher-scanner --features context --test context
      - name: Build source distribution
        run: uv run --no-project --with maturin==1.15.0 maturin sdist --out dist-python
      - name: Build and test from sdist with oldest Python
        shell: bash
        run: |
          uv venv .venv-sdist --python 3.10
          uv pip install --python .venv-sdist dist-python/*.tar.gz pytest
          mkdir sdist-check
          tar -xzf dist-python/*.tar.gz -C sdist-check --strip-components=1
          uv run --no-project --python .venv-sdist python -m pytest sdist-check/python/tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-sdist
          path: dist-python/*.tar.gz
          if-no-files-found: error

  plan-publish:
    if: github.repository == 'mongodb/kingfisher' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/python-v'))
    needs: [wheels, source, cache-portability]
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Skip SDK versions already published on PyPI
        id: plan
        run: python scripts/plan-python-sdk-publish.py --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.plan.outputs.pending == 'true'
        with:
          name: python-sdk-pending
          path: dist/*
          if-no-files-found: error

  publish:
    if: needs.plan-publish.outputs.pending == 'true'
    needs: [plan-publish]
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-sdk-publish-${{ github.run_id }}
      cancel-in-progress: false
    environment:
      name: pypi-sdk
      url: https://pypi.org/p/kingfisher-secret-scanner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-sdk-pending
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          # Handle a concurrent run publishing this version after the read-only plan.
          skip-existing: true
