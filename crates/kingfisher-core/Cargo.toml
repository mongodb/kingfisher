[package]
name = "kingfisher-core"
version = "2.1.0"
description = "Core types and traits for Kingfisher secret scanner"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
include = ["src/**", "examples/**", "build_support/**", "generated/**", "data/**", "LICENSE", "README.md"]

[dependencies]
# Serialization
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
schemars.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Hashing and crypto
sha1.workspace = true
hex.workspace = true

# Memory management
memmap2 = "0.9"
parking_lot.workspace = true

# Collections
smallvec.workspace = true
rustc-hash.workspace = true
dashmap = "6.2"

# Byte string handling
bstr.workspace = true
memchr = "2.8"

# Git types (minimal, for ObjectId and Time)
gix = { version = "0.90", default-features = false, features = ["serde", "sha1"] }

# ANSI stripping only; terminal I/O and Unicode display widths are unused.
console = { version = "0.16", default-features = false, features = ["alloc", "ansi-parsing"] }
