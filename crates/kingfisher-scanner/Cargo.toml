[package]
name = "kingfisher-scanner"
version = "1.1.0"
description = "High-level scanning API for Kingfisher secret scanner"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
include = ["src/**", "examples/**", "build_support/**", "generated/**", "data/**", "LICENSE", "README.md"]

# docs.rs blocks network access, so compile the vendored native source there.
[package.metadata.docs.rs]
features = ["kingfisher-vectorscan/build-from-source"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []

# Validation is all-or-nothing; scanning alone remains dependency-light.
validation = [
    "dep:reqwest",
    "dep:tokio",
    "dep:liquid",
    "dep:liquid-core",
    "dep:quick-xml",
    "dep:sha1",
    "dep:hex",
    "dep:time",
    "dep:hmac",
    "dep:sha2",
    "dep:futures",
    "dep:chrono",
    "dep:url",
    "dep:percent-encoding",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "dep:ldap3",
    "dep:bip32",
    "dep:bip39",
    "dep:sha3",
    "dep:zeroize",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-iam",
    "dep:aws-sdk-sts",
    "dep:aws-types",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "dep:base32",
    "dep:byteorder",
    "dep:rand",
    "dep:ed25519-dalek",
    "dep:p256",
    "dep:pem",
    "dep:aws-lc-rs",
    "dep:jsonwebtoken",
    "dep:mongodb",
    "dep:mysql_async",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "tokio/rt",
    "dep:h2",
    "dep:bytes",
]

# Compatibility aliases: every former provider feature now enables all validation.
validation-http = ["validation"]
validation-raw = ["validation"]
validation-ethereum = ["validation"]
validation-aws = ["validation"]
validation-azure = ["validation"]
validation-coinbase = ["validation"]
validation-gcp = ["validation"]
validation-jwt = ["validation"]
validation-database = ["validation"]
validation-grpc = ["validation"]
validation-all = ["validation"]

[dependencies]
# Internal dependencies
kingfisher-core = { version = "1.0.0", path = "../kingfisher-core" }
kingfisher-rules = { version = "1.0.1", path = "../kingfisher-rules" }

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

# Regex
regex.workspace = true

# Hashing
xxhash-rust.workspace = true

# Vectorscan
kingfisher-vectorscan.workspace = true

# Collections
smallvec.workspace = true
rustc-hash.workspace = true

# Concurrency
parking_lot.workspace = true
thread_local = "1.1"
crossbeam-skiplist = "0.1.3"

# HTTP status codes
http.workspace = true

# Byte strings
bstr.workspace = true

# Base64 for decoding
base64.workspace = true

# Logging
tracing.workspace = true

# ---- Optional validation dependencies ----

# Local Ethereum key-material validation
bip32 = { workspace = true, optional = true }
bip39 = { workspace = true, optional = true }
sha3 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# HTTP validation
futures = { version = "0.3.34", optional = true }
h2 = { version = "0.4.19", optional = true }
bytes = { version = "1.12.1", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
    "json", "gzip", "brotli", "deflate", "form", "query", "stream", "http2", "rustls", "multipart"
], optional = true }
tokio = { version = "1.53", features = ["net", "time", "sync", "io-util"], optional = true }
liquid = { version = "0.26", optional = true }
liquid-core = { version = "0.26", optional = true }
quick-xml = { version = "0.42", features = ["serde", "serialize"], optional = true }
sha1 = { workspace = true, optional = true }
time = { workspace = true, optional = true }
chrono = { version = "0.4.45", optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
pem = { version = "4.0.0", optional = true }
percent-encoding = { workspace = true, optional = true }
aws-lc-rs = { version = "1.18", optional = true }

jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"], optional = true }
p256 = { version = "0.14.0", optional = true }
ed25519-dalek = { version = "3.0", features = ["pkcs8"], optional = true }
hex = { workspace = true, optional = true }
url = { version = "2.5.8", optional = true }
mongodb = { version = "3.8.0", default-features = false, features = ["rustls-tls-aws-lc", "aws-auth", "compat-3-0-0", "dns-resolver"], optional = true }
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls"], optional = true }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
rustls = { version = "0.23.43", optional = true }
rustls-native-certs = { version = "0.8.4", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
# AWS validation
aws-config = { version = "1.11.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-sdk-iam = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sts = { version = "1.113.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-types = { version = "1.5.0", optional = true }
aws-smithy-http-client = { version = "1.4.0", optional = true }
aws-smithy-runtime-api = { version = "1.15.0", optional = true }
aws-smithy-types = { version = "1.6.2", optional = true }
base32 = { version = "0.5", optional = true }
byteorder = { version = "1.5", optional = true }
rand = { version = "0.10", optional = true }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
# ldap3's rustls backend still pulls ring 0.16, which fails to build on Windows ARM64.
# Use the platform TLS backend there to keep the raw LDAP validator available.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-native"], optional = true }

[target.'cfg(not(all(windows, target_arch = "aarch64")))'.dependencies]
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"], optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
pretty_assertions = "1.4"
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt", "sync"] }

[[example]]
name = "local_validation"
required-features = ["validation"]

[[example]]
name = "http_validation"
required-features = ["validation"]

[[example]]
name = "validate_file"
required-features = ["validation"]
