[package]
name = "kingfisher-rules"
version = "0.1.0"
description = "Rule definitions and database for Kingfisher secret scanner"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Internal dependencies
kingfisher-core = { path = "../kingfisher-core" }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml = "0.8"
schemars.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Regex
regex.workspace = true

# Hashing
xxhash-rust.workspace = true

# Liquid templating (for checksum validation)
liquid = "0.26"
liquid-core = "0.26"

# Crypto for liquid filters
base32.workspace = true
base64.workspace = true
bip39.workspace = true
crc32fast = "1.5"
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
rand.workspace = true
zeroize.workspace = true

# Vectorscan for pattern matching
vectorscan-rs.workspace = true
thread_local.workspace = true

# Logging
tracing.workspace = true
tiktoken-rs.workspace = true

# File walking
walkdir.workspace = true
ignore.workspace = true

# Embedded rule bundle
flate2 = "1.1"

[build-dependencies]
anyhow.workspace = true
flate2 = "1.1"
regex.workspace = true
serde.workspace = true
serde_yaml = "0.9"
toml = "0.8"
sha2.workspace = true
# Avoid Rustls/ring in the build script: ClusterFuzzLite's sanitizer CFLAGS would
# otherwise instrument ring and break the non-fuzz build-script linker.
ureq = { version = "3.1", default-features = false, features = ["native-tls"] }

[dev-dependencies]
pretty_assertions = "1.4"
proptest = "1.11"
