[package]
name = "kingfisher-rules"
version = "1.2.0"
description = "Rule definitions and database for Kingfisher secret scanner"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
include = ["src/**", "examples/**", "build_support/**", "generated/**", "data/*.yml", "data/*.md", "LICENSE", "README.md"]

# docs.rs blocks network access, so compile the vendored native source there.
[package.metadata.docs.rs]
features = ["kingfisher-vectorscan/build-from-source"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# Unstable regex-bound integration used by kingfisher-scanner; no semver guarantee.
__scanner-internals = []

[dependencies]
# Internal dependencies
kingfisher-core = { version = "1.0.3", path = "../kingfisher-core" }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml = "1.1"
schemars.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Regex
regex.workspace = true
regex-syntax.workspace = true

# Hashing
xxhash-rust.workspace = true

# Liquid templating (for checksum validation)
liquid = "0.26"
liquid-core = "0.26"

# Crypto for liquid filters
base32.workspace = true
base64.workspace = true
bip39.workspace = true
crc32fast = "1.5"
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
rand.workspace = true
zeroize.workspace = true

# Vectorscan for pattern matching
kingfisher-vectorscan.workspace = true
# Keep this exact pin in sync with cache_vectorscan_version(). Dependency feature
# unification may alter the native build; the full runtime build version is also keyed.
kingfisher-vectorscan-sys = "=0.1.2"
thread_local.workspace = true

# Logging
tracing.workspace = true
tiktoken-rs.workspace = true

# File walking
walkdir.workspace = true
ignore.workspace = true

# Embedded rule bundle
flate2 = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = "1.4"
proptest = "1.11"
