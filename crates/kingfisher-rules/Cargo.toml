[package]
name = "kingfisher-rules"
version = "3.2.1"
description = "Rule definitions and database for Kingfisher secret scanner"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT AND CC-BY-SA-4.0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
include = ["src/**", "examples/**", "build.rs", "build_support/**", "generated/**", "data/*.yml", "data/*.md", "data/*.gz", "data/*.txt", "LICENSE", "README.md"]

# docs.rs blocks network access, so compile the vendored native source there.
[package.metadata.docs.rs]
features = ["kingfisher-vectorscan/build-from-source"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# Unstable confirmation integration used by kingfisher-scanner; no semver guarantee.
__scanner-internals = ["dep:memchr", "dep:regex-automata"]

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
toml = "1.2"
schemars.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Regex and literal-set matching
aho-corasick = "1.1"
memchr = { version = "2.8", optional = true }
regex.workspace = true
regex-automata = { workspace = true, optional = true }
regex-syntax.workspace = true

# Hashing
xxhash-rust.workspace = true

# Liquid templating (for checksum validation)
liquid = "0.26"
liquid-core = "0.26"

# Crypto for liquid filters
aws-lc-rs = "1.19"
base64.workspace = true
bip39.workspace = true
crc32fast = "1.5"
der = { version = "0.8.3", features = ["oid"] }
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding.workspace = true
pem = "4.0.0"
pkcs1 = { version = "0.8", features = ["alloc"] }
pkcs8 = "0.11"
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
rand.workspace = true
zeroize.workspace = true

# Vectorscan for pattern matching
kingfisher-vectorscan.workspace = true
# Keep this exact pin in sync with cache_vectorscan_version(). Dependency feature
# unification may alter the native build; the full runtime build version is also keyed.
kingfisher-vectorscan-sys = "=0.1.4"
thread_local.workspace = true

# Logging
tracing.workspace = true
tiktoken-rs.workspace = true
rustc-hash.workspace = true

# File walking
ignore.workspace = true

# Embedded rule bundle
flate2 = "1.1.11"

[build-dependencies]
flate2 = "1.1.11"
tiktoken-rs.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
# Keep fork/timeout support; none of our strategies require optional bit sets.
proptest = { version = "1.12", default-features = false, features = ["std", "fork", "timeout"] }
rsa = { version = "0.10", features = ["getrandom", "pkcs1v15"] }
