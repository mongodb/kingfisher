rules:
  - name: Heroku API Key
    id: kingfisher.heroku.1
    pattern: |
      (?xi)
      \b                                
      heroku
      (?:.|[\n\r]){0,32}?
      \b
      (                                    
        [[:xdigit:]]{8}-[[:xdigit:]]{4}-
        [[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - "HEROKU_API_KEY: c55dbac4-e0e8-4a06-b892-75cac2387ce5"
    references:
      - https://devcenter.heroku.com/articles/authentication
      - https://devcenter.heroku.com/articles/oauth
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/heroku.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/heroku.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/token-spray/api-heroku.yaml
    validation:
      type: Http
      content:
        request:
          method: GET
          headers:
            Accept: application/vnd.heroku+json; version=3
            Authorization: Bearer {{ TOKEN }}
          url: https://api.heroku.com/apps
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_authorization_id
            request:
              method: GET
              url: https://api.heroku.com/oauth/authorizations
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: Bearer {{ TOKEN }}
              response_matcher:
                - type: StatusMatch
                  status: [200]
            extract:
              AUTHORIZATION_ID:
                type: Regex
                pattern: '"id":"([^"]+)"[^{}]{0,2048}?"token":"{{ TOKEN }}"'
          - name: revoke_authorization
            request:
              method: DELETE
              url: https://api.heroku.com/oauth/authorizations/{{ AUTHORIZATION_ID }}
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: Bearer {{ TOKEN }}
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200]
  - name: Heroku API Key (Platform Key)
    id: kingfisher.heroku.2
    pattern: |
      (?x)
      (
        HRKU-[[:alnum:]_-]{60}
      )
    confidence: medium
    min_entropy: 4.0
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.heroku.com/account"
          headers:
            Authorization: "Bearer {{TOKEN}}"
            Accept: "application/vnd.heroku+json;version=3"
          response_matcher:
            - type: StatusMatch
              status: [200]
            - type: StatusMatch
              status: [401]
              negative: true
            - type: JsonValid
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_authorization_id
            request:
              method: GET
              url: https://api.heroku.com/oauth/authorizations
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: Bearer {{TOKEN}}
              response_matcher:
                - type: StatusMatch
                  status: [200]
            extract:
              AUTHORIZATION_ID:
                type: Regex
                pattern: '"id":"([^"]+)"[^{}]{0,2048}?"token":"{{ TOKEN }}"'
          - name: revoke_authorization
            request:
              method: DELETE
              url: https://api.heroku.com/oauth/authorizations/{{ AUTHORIZATION_ID }}
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: "Bearer {{TOKEN}}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200]
    references:
      - https://devcenter.heroku.com/articles/platform-api-quickstart
      - https://devcenter.heroku.com/articles/oauth
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/heroku.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/heroku.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/herokuplatformkey/detector.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/herokuplatformkey/validator.go
    examples:
      - "HRKU-AADVTUYvfjT4nhuJ07bEfAUq9GS3PkTdyWuNBiXYmYMg_____wgAf6OTnGyh"
      - "HRKU-AABW9W1iH9NHEIlAABq9nZUq9GS3PkTdyWuNBiXYmYMg_____wV2XYIXxm5p"
      - "HRKU-AAWpqREEr2V1gqh6urSXWYUq9GS3PkTdyWuNBiXYmYMg_____wNI1VGijd8y"
