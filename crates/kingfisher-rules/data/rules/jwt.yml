rules:
  - name: JSON Web Token (base64url-encoded)
    id: kingfisher.jwt.1
    pattern: |
      (?x)
      (
        (?:ey|ewogIC)[A-Za-z0-9_-]{12,}  (?# header )
        \.
        ey[A-Za-z0-9_-]{12,}  (?# payload )
        \.
        [A-Za-z0-9_-]{24,}    (?# signature )
      )
      (?:[^A-Za-z0-9_-]|$)
    pattern_requirements:
      min_digits: 4
    min_entropy: 3.3
    confidence: medium
    examples:
      - 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJsb2dnZWRJbkFzIjoiYWRtaW4iLCJpYXQiOjE0MjI3Nzk2Mzh9.gzSraSYS8EXBxLN_oWnFSRgCzcmEmMjLiuyu5CSpyHI'
      - 'NUCLEAR_SERVICES_ANON_KEY=eyJhbGciOiJIUzI1NiIsEnR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqcnVqc2lzY2Nzdnl2am5xdG5xIiwicm9sZSI6ImEub24iLCJpYXQiOjE2NTY1OTY0NjEsImV4cCI6MTk3MjE3MjQ2MX0.WQWcwBAQFNE259f2o8ruFln_UMLTFEnEaUD7KHrs9Aw'
    references:
      - https://en.wikipedia.org/wiki/JSON_Web_Token
      - https://datatracker.ietf.org/doc/html/rfc7519
      - https://en.wikipedia.org/wiki/Base64#URL_applications
      - https://datatracker.ietf.org/doc/html/rfc4648
      - https://developer.okta.com/blog/2018/06/20/what-happens-if-your-jwt-is-stolen
    validation:
      type: JWT
    tls_mode: lax

  - name: Base64-Encoded JSON Web Token
    id: kingfisher.jwt.2
    pattern: |
      (?xi)
      \b
      (
        ZXlK
        (?:aGJHY2lPaU|aGNIVWlPaU|aGNIWWlPaU|aGRXUWlPaU|aU5qUWlP|amNtbDBJanBi|amRIa2lPaU|bGNHc2lPbn|bGJtTWlPaU|cWEzVWlPaU|cWQyc2lPb|cGMzTWlPaU|cGRpSTZJ|cmFXUWlP|clpYbGZiM0J6SWpwY|cmRIa2lPaUp|dWIyNWpaU0k2|d01tTWlP|d01uTWlPaU|d2NIUWlPaU|emRXSWlPaU|emRuUWlP|MFlXY2lPaU|MGVYQWlPaUp|MWNtd2l|MWMyVWlPaUp|MlpYSWlPaU|MlpYSnphVzl1SWpv|NElqb2|NE5XTWlP|NE5YUWlPaU|NE5YUWpVekkxTmlJNkl|NE5YVWlPaU|NmFYQWlPaU)
        [a-zA-Z0-9/\\_+\-]{40,}
        ={0,2}
      )
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - 
    references:
      - https://en.wikipedia.org/wiki/JSON_Web_Token
      - https://datatracker.ietf.org/doc/html/rfc7519
      - https://www.iana.org/assignments/jose/jose.xhtml
      - https://datatracker.ietf.org/doc/html/rfc4648
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/jwt.go#L77
    # No validation: a base64-encoded JWT wraps a standard JWT (which can be
    # validated via the JWT typed validator once decoded). The base64 layer
    # means the inner JWT's issuer (iss) claim is not directly available to
    # fetch JWKS keys for signature verification. The base64 prefix `ZXlK`
    # decodes to `eyJ` (base64 of `{"`), confirming the inner content is a JWT.
    tls_mode: lax