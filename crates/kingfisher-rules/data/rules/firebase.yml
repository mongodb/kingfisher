rules:
  - name: Firebase Cloud Messaging Server Key
    id: kingfisher.firebase.1
    pattern: |
      (?x)
      \b
      (
        AAAA[A-Za-z0-9_-]{7}
        :
        APA91b[A-Za-z0-9_-]{120,180}
      )
      (?:[^A-Za-z0-9_-]|$)
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
      ignore_if_contains:
        - example
        - sample
        - placeholder
        - your_key_here
    min_entropy: 4.0
    confidence: medium
    examples:
      - FCM_SERVER_KEY=AAAAA1b2CdE:APA91bAbCdEfGhIjKlMnOpQrStUvWxYz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-AaBbCcDdEeFfGgHhIiJj
      - 'firebase_server_key: "AAAAQ1w2ErT:APA91bZaYxWvUtSrQpOnMlKjIhGfEdCbA9876543210ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-MmNnOoPpQqRrSsTtUuVv"'
    references:
      - https://firebase.google.com/docs/cloud-messaging/migrate-v1
      # FCM legacy server keys no longer have a safe token-only validation path.
      # HTTP v1 requires OAuth2 access tokens from service accounts rather than the legacy key itself.
      - https://firebase.google.com/docs/cloud-messaging/send/v1-api
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/firebase-fcm-server-key-disclosure.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/fcm-api-key.yaml

  - name: Firebase Cloud Messaging Device Token
    id: kingfisher.firebase.2
    pattern: |
      (?x)
      \b
      (
        [A-Za-z0-9_-]{22}
        :
        APA91b[A-Za-z0-9_-]{120,180}
      )
      (?:[^A-Za-z0-9_-]|$)
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
      ignore_if_contains:
        - example
        - sample
        - placeholder
    min_entropy: 4.0
    confidence: medium
    examples:
      - FCM_DEVICE_TOKEN=AbCdEfGhIjKlMnOpQrStUv:APA91bZaYxWvUtSrQpOnMlKjIhGfEdCbA9876543210ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-AaBbCcDdEeFfGgHhIiJj
      - 'registrationToken: "AbCdEfGhIjKlMnOpQrStUv:APA91bZaYxWvUtSrQpOnMlKjIhGfEdCbA9876543210ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-AaBbCcDdEeFfGgHhIiJj"'
    references:
      - https://firebase.google.com/docs/cloud-messaging/manage-tokens
    # Registration tokens can’t be safely live-validated using only the token value.

  - name: Firebase Web API Key
    id: kingfisher.firebase.3
    # Same AIza... format as google.7; labelled Firebase only when the word
    # appears nearby (e.g. firebaseConfig.apiKey blocks).
    pattern: |
      (?xi)
      \b
      firebase
      (?:.|[\n\r]){0,80}?
      \b
      (
        AIza[A-Za-z0-9_\-\\]{35}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.5
    confidence: medium
    examples:
      - 'const firebaseConfig = { apiKey: "AIzaSyByz6BGQf8QtcQLml8spbyy8x5_327PTow", authDomain: "app.firebaseapp.com" };'
    references:
      - https://firebase.google.com/docs/projects/api-keys
      - https://docs.cloud.google.com/identity-platform/docs/use-rest-api
      - https://cloud.google.com/docs/authentication/api-keys
    validation:
      # accounts:signUp checks the key before the body, so an empty body against
      # a live key fails on missing email/password, not API_KEY_INVALID.
      type: Http
      content:
        request:
          method: POST
          url: https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={{ TOKEN | url_encode }}
          headers:
            Content-Type: application/json
          body: "{}"
          response_matcher:
            - report_response: true
            - type: JsonValid
            - type: WordMatch
              words:
                - API_KEY_INVALID
              negative: true
