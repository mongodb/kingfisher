rules:
  - name: Firebase Cloud Messaging Legacy Server Key
    id: kingfisher.firebase.1
    # Legacy FCM server keys authorize server-to-FCM sends and must be treated
    # as secrets. They are distinct from public Firebase Web API keys and
    # device registration tokens. Current FCM HTTP v1 uses OAuth 2.0 service-
    # account credentials instead; this rule covers historical key exposure.
    pattern: |
      (?x)
      \b
      (
        AAAA[A-Za-z0-9_-]{7}
        :
        APA91b[A-Za-z0-9_-]{120,180}
      )
      (?:[^A-Za-z0-9_-]|$)
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
      ignore_if_contains:
        - example
        - sample
        - placeholder
        - your_key_here
    min_entropy: 4.0
    confidence: medium
    examples:
      - FCM_SERVER_KEY=AAAAA1b2CdE:APA91bAbCdEfGhIjKlMnOpQrStUvWxYz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-AaBbCcDdEeFfGgHhIiJj
      - 'firebase_server_key: "AAAAQ1w2ErT:APA91bZaYxWvUtSrQpOnMlKjIhGfEdCbA9876543210ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-MmNnOoPpQqRrSsTtUuVv"'
    references:
      - https://firebase.google.com/docs/cloud-messaging/server-environment
      - https://firebase.google.com/docs/cloud-messaging/send/v1-api
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/firebase-fcm-server-key-disclosure.yaml

  - name: Firebase Cloud Messaging Device Token
    id: kingfisher.firebase.2
    pattern: |
      (?x)
      \b
      (
        [A-Za-z0-9_-]{22}
        :
        APA91b[A-Za-z0-9_-]{120,180}
      )
      (?:[^A-Za-z0-9_-]|$)
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
      ignore_if_contains:
        - example
        - sample
        - placeholder
    min_entropy: 4.0
    confidence: medium
    examples:
      - FCM_DEVICE_TOKEN=AbCdEfGhIjKlMnOpQrStUv:APA91bZaYxWvUtSrQpOnMlKjIhGfEdCbA9876543210ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-AaBbCcDdEeFfGgHhIiJj
      - 'registrationToken: "AbCdEfGhIjKlMnOpQrStUv:APA91bZaYxWvUtSrQpOnMlKjIhGfEdCbA9876543210ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-AaBbCcDdEeFfGgHhIiJj"'
    references:
      - https://firebase.google.com/docs/cloud-messaging/manage-tokens
    # Registration tokens can’t be safely live-validated using only the token value.
