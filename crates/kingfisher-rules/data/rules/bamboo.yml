rules:
  - name: Bamboo Data Center Personal Access Token
    id: kingfisher.bamboo.1
    pattern: |
      (?x)
      (?i:bamboo)
      (?:.|[\n\r]){0,48}?
      (?i:personal[_ -]?access[_ -]?token|pat|token|authorization|bearer)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [MNO][[:alnum:]+/]{15}
        O[g-v]
        [[:alnum:]+/]{26}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 4.0
    confidence: medium
    examples:
      - 'BAMBOO_PAT="MTIzNDU2Nzg5MDEyOkExYjJDM2Q0RTVmNkc3aDhJOWow"'
      - 'bamboo personal access token: "NDc4NDkyNDg3ODE3OstHYSeYC1UgXqRacSqvUbookcZk"'
    references:
      - https://confluence.atlassian.com/security/personal-access-tokens-in-bamboo-1402421021.html
      - https://developer.atlassian.com/server/bamboo/rest/api-group-api/
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "{{ BAMBOO_BASE_URL }}/rest/api/latest/access-token?limit=1"
          headers:
            Accept: application/json
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
    depends_on_rule:
      - rule_id: kingfisher.bamboo.2
        variable: BAMBOO_BASE_URL

  - name: Bamboo Data Center Base URL
    id: kingfisher.bamboo.2
    pattern: |
      (?xi)
      \b
      (
        https://
        (?:
          (?:[[:alnum:]-]+\.){0,4}
          bamboo(?:-[[:alnum:]]{1,16})?
          (?:\.[[:alnum:]-]{1,63}){1,4}
          (?::[[:digit:]]{2,5})?
          (?:/bamboo)?
          |
          (?:[[:alnum:]-]+\.){1,5}
          [[:alnum:]-]{2,63}
          (?::[[:digit:]]{2,5})?
          /bamboo
        )
      )
      \b
    pattern_requirements:
      ignore_if_contains:
        - atlassian.com
        - atlassian.net
        - localhost
    min_entropy: 3.0
    confidence: medium
    visible: false
    examples:
      - https://bamboo.example.com
      - https://bamboo-staging.corp.example.com:8443/bamboo
      - https://ci.example.org/bamboo
    references:
      - https://confluence.atlassian.com/bamboo/specifying-bamboo-s-url-289277242.html
      - https://developer.atlassian.com/server/bamboo/rest/api-group-api/
