rules:
  - name: Solana Private Key
    id: kingfisher.solana.1
    # A Solana keypair is the 64-byte ed25519 secret concatenated with the
    # public key, base58-encoded to 87-88 characters. That length plus the
    # base58 alphabet (no 0/O/I/l) is already highly specific, so the leading
    # context only has to disambiguate the surrounding assignment.
    pattern: |
      (?x)
      \b
      (?i:solana|phantom|solflare|sollet|secret[_-]?key|private[_-]?key|keypair|payer)
      (?:.|[\n\r]){0,50}?
      ["']?
      (
        [1-9A-HJ-NP-Za-km-z]{87,88}
      )
      \b
    min_entropy: 4.5
    confidence: medium
    validation:
      type: Assumed
    examples:
      - 'solana_private_key = "hb3tPskg92GpYEg3Wu9trex6uYP4kyTpWRoiK9zUdhn787GvbzhV2GJjVyNPCVUP9g59JNj8Q3vjedJLwmPJsVqC"'
      - "phantom: hb3tPskg92GpYEg3Wu9trex6uYP4kyTpWRoiK9zUdhn787GvbzhV2GJjVyNPCVUP9g59JNj8Q3vjedJLwmPJsVqC"
    references:
      - https://solana.com/docs/intro/installation
      - https://github.com/google/osv-scalibr/pull/2013
