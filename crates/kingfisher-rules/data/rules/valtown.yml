rules:
  - name: Val Town API Token
    id: kingfisher.valtown.1
    pattern: |
      (?x)
      \b
      (
        vtwn_[a-zA-Z0-9_-]{20,48}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "VALTOWN_TOKEN=vtwn_AbCdEfGhIjKlMnOpQrStUvWxYz123456"
    references:
      - https://docs.val.town/reference/api/authentication
      - https://github.com/val-town/val-town-docs/blob/0baaebe3208afc046b98d49966431e4710e588f2/src/content/docs/guides/auth.mdx
      - https://github.com/val-town/vt/blob/1eb64134b29ccec4c0465c8647f03e6edcfd7d22/src/cmd/lib/config.ts
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.val.town/v1/me
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"id"'
