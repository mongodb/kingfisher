rules:
  - name: Azure OpenAI API Key
    id: kingfisher.azureopenai.1
    pattern: |
      (?xi)
      \b
      azure
      (?:.|[\n\r]){0,8}?
      (?:openai)
      (?:.|[\n\r]){0,16}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,8}?
      (
        [[:xdigit:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_lowercase: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - azure_openai_key=1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
      - azure_openai_secret=abcdef0123456789abcdef0123456789
    references:
      - https://learn.microsoft.com/en-us/rest/api/azureopenai/models/list?view=rest-azureopenai-2024-10-21&tabs=HTTP
      - https://github.com/Azure-Samples/Legacy-Modernization-Agents/blob/b260b5ad01e52d9c2e928edf7c53f05e8ae52eac/doctor.sh
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://{{ AZUREHOST }}/openai/models?api-version=2024-10-21"
          headers:
            Api-Key: "{{ TOKEN }}"
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
            - type: WordMatch
              words:
                - '"object":'
    depends_on_rule:
      - rule_id: kingfisher.azureopenai.host.1
        variable: AZUREHOST
  - name: Azure OpenAI Host
    id: kingfisher.azureopenai.host.1
    pattern: |
      (?xi)
      \b(?:endpoint|base_?url|uri|url|host|azure[_-]?endpoint|azure[_-]?openai[_-]?(?:endpoint|uri|host|base_?url)|openai[_-]?api[_-]?base)\b
      ["']?\s*[:=]\s*
      ["']?
      (?:https?://)?
      (
        [a-z0-9-]{3,32}
        \.openai\.azure\.com
      )
      \b
    min_entropy: 2.5
    visible: false
    confidence: medium
    examples:
      - AZURE_OPENAI_ENDPOINT=https://my-instance.openai.azure.com
      - '  "endpoint": "https://mycompany-east-us.openai.azure.com"'
      - endpoint=https://test.openai.azure.com
    references:
      - https://learn.microsoft.com/en-us/rest/api/azureopenai/models/list?view=rest-azureopenai-2024-10-21&tabs=HTTP
