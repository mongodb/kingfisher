rules:
  - name: Apify API Token
    id: kingfisher.apify.1
    pattern: |
      (?xi)
      (
        apify_api_[[:alnum:]]{34,38}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    confidence: high
    min_entropy: 3.5
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.apify.com/v2/users/me"
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"data"'
                - '"username"'
              match_all_words: true
    references:
      - https://docs.gitguardian.com/secrets-detection/secrets-detection-engine/detectors/specifics/apify_token
      - https://docs.apify.com/api/v2#/reference/users/user-object/get-user-public-profile-or-me
      - https://docs.apify.com/api/v2/users-me-get
      - https://github.com/apify/apify-cli/blob/addc8c8f1f3a7114888acae0d0cec39a5668402c/src/commands/auth/login.ts
      - https://github.com/apify/crawlee-python/blob/2bc10ad0af92ebf2f49105c4b384af78e4b3d465/docs/deployment/code_examples/apify/log_with_config_example.py
    examples:
      - "apify_api_NcjXcxEz2XL1irjppyWSHvjghalQOd1LXOHv"
      - "apify_api_9uyewBxQUF1EXWdKVc4lNaTSM461Ls4oQouz"
