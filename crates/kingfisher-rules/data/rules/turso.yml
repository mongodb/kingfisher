rules:
  - name: Turso Auth Token
    id: kingfisher.turso.1
    pattern: |
      (?x)
      \b
      (?:
        TURSO_(?:AUTH_TOKEN|API_TOKEN)
        |
        turso[\s_-]*(?:auth|api)[\s_-]*token
      )
      \s*[=:]\s*["']?
      (
        eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - 'TURSO_AUTH_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0dXJzby1hdXRoLXRva2VuIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
      - 'turso api_token="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0dXJzby1hcGktdG9rZW4iLCJvcmciOiJteS1vcmcifQ.k3OFAEWF0XnJzxk5hfn3OPD89In5Mrtw5cJiwk3c8"'
    references:
      - https://docs.turso.tech/sdk/authorization
      - https://docs.turso.tech/api-reference/authentication
      - https://docs.turso.tech/api-reference/tokens/create
      - https://docs.turso.tech/sdk/authentication
      - https://github.com/tursodatabase/turso-docs/blob/2558aded557c9daa18ed07184c5bc1e83024ec3f/sdk/authorization.mdx#L5-L29
      - https://github.com/tursodatabase/sqlalchemy-libsql/blob/1561796825980a28fe6e744e02484ff00a06fd8a/README.md
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.turso.tech/v1/auth/api-tokens
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: "application/json"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
    # Platform API tokens can be revoked via DELETE /v1/auth/api-tokens/{tokenId}
    # or in the Turso dashboard. Database auth tokens can be invalidated with
    # `turso db tokens invalidate <database>` or the Platform API endpoint
    # POST /v1/organizations/{org}/databases/{db}/auth/tokens/invalidate.
