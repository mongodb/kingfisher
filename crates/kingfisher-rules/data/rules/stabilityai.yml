rules:
  - name: Stability AI API Key
    id: kingfisher.stabilityai.1
    pattern: |
      (?x)
      \b
      (                
        sk-     
        [A-Za-z0-9]{48}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 4.0
    confidence: medium
    examples:
      - sk-AnmgropvAII5XEoxVPjbnSMG3XhacEwhJlLh8ossXh7K1iLP
      - sk-gQHyuK4k6Vw2viJRaAnLh6zAULaWtUg40ZHWcYjw7JGutlW6
      - sk-nwvJypEMFNASJLiPBgNnzJj1xsDwlHChbFRMNwVkzy3e4UJg
    references:
      - https://platform.stability.ai/docs/api-reference#v1-user-account
      - https://github.com/betterleaks/betterleaks/blob/06e89aa9d3745546f9d201cab86225270f78ff04/config/betterleaks.toml#L6548
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/stabilityai.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.stability.ai/v1/user/account
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words:
                - '"id"'
                - '"email"'
