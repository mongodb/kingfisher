rules:
  - name: HOP Project Token
    id: kingfisher.hop.1
    pattern: |
      (?x)
      \b
      (
        ptk_[a-zA-Z0-9_-]{40,80}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "HOP_TOKEN=ptk_c183M2U0N2RlYzZjZTQ1ZmM5M2MxNmViNWNiZWU0ZWIwMV81MDcyNjAzNjAyNjc2MTIzM0"
    references:
      - https://docs.hop.io/reference/rest-api
      - https://docs.hop.io/reference/project-tokens
      - https://github.com/hopinc/docs/blob/16f3b923f0d52f7ae675d88d399de903b1140182/reference/rest-api.mdx
      - https://github.com/hopinc/js/blob/adfc06da14c6a4ad32efaa291b4f35da26f0f208/README.md
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.hop.io/v1/projects/@this
          headers:
            Authorization: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: HOP Personal Access Token
    id: kingfisher.hop.2
    pattern: |
      (?x)
      (?:^|['"\x60\s>=:(,])
      (
        hop_pat_[a-zA-Z0-9_-]{20,50}
      )
      (?:$|['"\x60\s<),])
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - 'HOP_PAT="hop_pat_AbCdEfGhIjKlMnOpQrStUvWxYz123456"'
    references:
      - https://docs.hop.io/reference/rest-api
      - https://docs.hop.io/reference/project-tokens
      - https://github.com/hopinc/docs/blob/16f3b923f0d52f7ae675d88d399de903b1140182/reference/rest-api.mdx
      - https://github.com/hopinc/js/blob/adfc06da14c6a4ad32efaa291b4f35da26f0f208/README.md
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.hop.io/v1/users/@me
          headers:
            Authorization: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
