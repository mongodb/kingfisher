rules:
  - name: Hack Club AI API Key
    id: kingfisher.hackclub.1
    pattern: |
      (?x)
      \b
      (
        sk-hc-v1-[a-f0-9]{64}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - "HACKCLUB_API_KEY=sk-hc-v1-9f014e0f299f43848b4aa17fa0c69b3f5347bb18ef7f4627b5cea30023ddc1f0"
    references:
      - https://jams.hackclub.com/jam/ai-travel
      - https://github.com/hackclub/ai/blob/7c1f145fefe5b4a97f5c8e605de730a40a61bfe2/src/routes/api.tsx
