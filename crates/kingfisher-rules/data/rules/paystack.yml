rules:
  - name: Paystack API Key
    id: kingfisher.paystack.1
    pattern: |
      (?x)
      \b
      (
        sk_
        [[:lower:]]{1,15}
        _
        [[:lower:][:digit:]]{40}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - sk_test_bmuas223uty73mmpzdjbyy9xrcb7qe73saos9022
      - sk_live_gixbo7tt4ybdxu1qmzft09spbbbz7xt0o9zwlfjz
    references:
      - https://paystack.com/docs/api/authentication/
      - https://paystack.com/docs/api/transfer-control/
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/paystacksecretkey/detector.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/paystacksecretkey/validator.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.paystack.co/balance
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ['"message":"Balances retrieved"', '"data"']
