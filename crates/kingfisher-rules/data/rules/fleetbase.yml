rules:
  - name: Fleetbase API Key
    id: kingfisher.fleetbase.1
    pattern: |
      (?x)
      \b
      (
        flb_(?:live|test)_[0-9a-zA-Z]{20,64}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - flb_live_1234567890abcdefGHIJ
      - flb_test_1234567890abcdefGHIJ
      - "Authorization: Bearer flb_live_1234567890abcdefGHIJ"
    categories:
      - api
      - secret
    references:
      - https://docs.fleetbase.io/developers/api/
      - https://github.com/fleetbase/fleetbase.io/blob/9f8124f1bda23f35c34d82f1b236741fd362ac00/content/docs/api/index.mdx
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.fleetbase.io/v1"
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: "application/json"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
