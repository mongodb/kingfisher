rules:
  - name: Wiz Client ID
    id: kingfisher.wiz.1
    pattern: |
      (?x)
      \b
      (?i:WIZ[_-]?CLIENT[_-]?ID)
      \b
      \s*(?:=|:)\s*["']?
      (
        [[:alnum:]]{56}
      )
      (?:["'\s,;}]|$)
    pattern_requirements:
      min_digits: 3
      min_uppercase: 3
      min_lowercase: 3
    min_entropy: 4.0
    confidence: medium
    visible: false
    examples:
      - 'WIZ_CLIENT_ID="aB1cD2eF3gH4iJ5kL6mN7oP8qR9sT0uV1wX2yZ3aA4bB5cC6dD7eF8gH"'
    references:
      - https://docs.wiz.io/docs/using-the-wiz-api

  - name: Wiz Client Secret
    id: kingfisher.wiz.2
    pattern: |
      (?x)
      \b
      (?i:WIZ[_-]?CLIENT[_-]?SECRET)
      \b
      \s*(?:=|:)\s*["']?
      (
        [[:alnum:]]{64}
      )
      (?:["'\s,;}]|$)
    pattern_requirements:
      min_digits: 4
      min_uppercase: 4
      min_lowercase: 4
    min_entropy: 4.0
    confidence: medium
    depends_on_rule:
      - rule_id: kingfisher.wiz.1
        variable: CLIENT_ID
    examples:
      - 'WIZ_CLIENT_SECRET="aB1cD2eF3gH4iJ5kL6mN7oP8qR9sT0uV1wX2yZ3aA4bB5cC6dD7eE8fF9gG0hH1i"'
    references:
      # From https://docs.wiz.io/docs/using-the-wiz-api:
      # curl --request POST \
      # --url 'TOKEN_URL' \
      # --header 'content-type: application/x-www-form-urlencoded' \
      # --data grant_type=client_credentials \
      # --data client_id=WIZ_SA_CLIENT_ID \
      # --data client_secret=WIZ_SA_CLIENT_SECRET \
      # --data audience=wiz-api
      - https://docs.wiz.io/docs/using-the-wiz-api
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://auth.app.wiz.io/oauth/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          body: "grant_type=client_credentials&client_id={{ CLIENT_ID }}&client_secret={{ TOKEN }}&audience=wiz-api"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
