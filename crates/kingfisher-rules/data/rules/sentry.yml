rules:
  - name: Sentry Access Token
    id: kingfisher.sentry.1
    pattern: |
      (?xi)
      \b
      sentry
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:xdigit:]]{64}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - SENTRY_TOKEN=cbadefcbadefc12defcbadefcbadefcbadefcbadefcbadefcbadefcbadefcbad
      - '"sentry-key": "3214567890cbadef3214567890cbadef3214567890cbadef3214567890cbadef"'
    references:
      - https://docs.sentry.io/api/auth/
      - https://docs.sentry.io/api/organizations/
      - https://docs.sentry.io/api/permissions/
      - https://github.com/getsentry/sentry-cli/blob/0f55bf46f56e544503dc355eb7df3336414d49c2/src/utils/auth_token/user_auth_token.rs
      # Validator: 200=organization access; 403=authenticated without org:read (active);
      # 401=expired, revoked, absent, or invalid.
      - https://github.com/gitleaks/gitleaks/blob/3fa5a3a954e5ffabab36f327a88841510cbc9c29/cmd/generate/config/rules/sentry.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://sentry.io/api/0/organizations/
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 403]

  - name: Sentry DSN
    id: kingfisher.sentry.4
    pattern: |
      (?xi)(?:\bSENTRY[_-]?DSN\b\s*[:=]\s*["']?)?(https://[[:xdigit:]]{32}@(?:(?:o\d+\.)?sentry\.io|[a-z0-9][a-z0-9.-]*\.[a-z]{2,})/\d+)
    min_entropy: 3.0
    confidence: medium
    examples:
      - SENTRY_DSN=https://0123456789abcdef0123456789abcdef@sentry.io/12345
    references:
      - https://docs.sentry.io/concepts/key-terms/dsn-explainer/
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/sentry.yml

  - name: Sentry Organization Token
    id: kingfisher.sentry.2
    pattern: |
      (?x)
      \b
      (
        sntrys_
        [[:alnum:]+/]{16,512}
        ={0,2}
        _
        [[:alnum:]+/]{43}
      )
      (?:$|[^[:alnum:]+/])
    pattern_requirements:
      min_digits: 2
    min_entropy: 4.5
    confidence: medium
    examples:
      - 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
      - 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
    references:
      - https://docs.sentry.io/api/auth/
      - https://docs.sentry.io/account/auth-tokens/
      - https://docs.sentry.io/api/organizations/
      - https://docs.sentry.io/api/permissions/
      - https://github.com/getsentry/rfcs/blob/3ffac9cc6a50ab179aa26a21ec0efc2eddb41271/text/0091-ci-upload-tokens.md
      - https://github.com/getsentry/sentry-cli/blob/0f55bf46f56e544503dc355eb7df3336414d49c2/src/utils/auth_token/org_auth_token.rs
      # Validator: 200=organization access; 403=authenticated without org:read (active);
      # 401=expired, revoked, absent, or invalid.
      - https://github.com/getsentry/rfcs/blob/3ffac9cc6a50ab179aa26a21ec0efc2eddb41271/text/0091-ci-upload-tokens.md
      - https://github.com/gitleaks/gitleaks/blob/3fa5a3a954e5ffabab36f327a88841510cbc9c29/cmd/generate/config/rules/sentry.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://sentry.io/api/0/organizations/
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 403]

  - name: Sentry User Token
    id: kingfisher.sentry.3
    pattern: |
      (?x)
      \b
      (
        sntryu_
        [[:xdigit:]]{64}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - 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
      - SNTRY_USER="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"
    references:
      - https://docs.sentry.io/api/auth/
      - https://docs.sentry.io/api/organizations/
      - https://docs.sentry.io/api/permissions/
      - https://github.com/getsentry/sentry-cli/blob/0f55bf46f56e544503dc355eb7df3336414d49c2/src/utils/auth_token/user_auth_token.rs
      # Validator: 200=organization access; 403=authenticated without org:read (active);
      # 401=expired, revoked, absent, or invalid.
      - https://github.com/gitleaks/gitleaks/blob/3fa5a3a954e5ffabab36f327a88841510cbc9c29/cmd/generate/config/rules/sentry.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://sentry.io/api/0/organizations/
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 403]
