rules:
  - name: 1Password Service-Account Token
    id: kingfisher.1password.1
    pattern: |
      (?xi)
      \b
      (
        ops_eyj[A-Za-z0-9_-]{80,500}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 4.0
    confidence: medium
    examples:
      - export OP_SERVICE_ACCOUNT_TOKEN=ops_
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://events.1password.com/api/v2/auth/introspect
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ['"features"']
              match_all_words: true
    references:
      - https://developer.1password.com/docs/service-accounts/security
      - https://developer.1password.com/docs/service-accounts/get-started
      - https://developer.1password.com/docs/cli/environment-variables
      - https://developer.1password.com/docs/events-api/reference
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/1password.go

  - name: 1Password Account Secret Key
    id: kingfisher.1password.2
    pattern: |
      (?xi)
      (
        A[0-9]-[[:alnum:]]{6}-[[:alnum:]]{6}-[[:alnum:]]{5}(?:-[[:alnum:]]{5}){3}
      )
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.8
    confidence: medium
    examples:
      - A3-R69SQK-TZ9KPW-8MXYD-6W373-V7GHJ-EDJQW
      - A3-ASWWYB-798JRY-LJVD4-23DC2-86TVM-H43EB
    references:
      - https://support.1password.com/secret-key-security/
      - https://1passwordstatic.com/files/security/1password-white-paper.pdf
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/1password.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/onepasswordkeys/detector.go

  - name: 1Password Recovery Key
    id: kingfisher.1password.3
    pattern: |
      (?x)
      \b
      (
        1PRK(?:-[[:upper:][:digit:]]{4}){13}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - 1PRK-ABCD-EFGH-IJKL-MNOP-QRST-UVWX-YZ12-3456-789A-BCDE-FGHI-JKLM-NOPQ
    references:
      - https://support.1password.com/recovery-codes/
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/onepasswordkeys/detector.go
