rules:
  - name: Sendinblue API Token
    id: kingfisher.sendinblue.1
    pattern: |
      (?x)
      \b
      (
        xkeysib-[a-fA-F0-9]{64}-[a-zA-Z0-9]{16}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.2
    confidence: medium
    examples:
      - XKEYSIB_TOKEN=xkeysib-abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd-1234567890abcd12
      - '"sendinblue": "xkeysib-1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef-ab12cd34ef56gh78"'
    references:
      - https://developers.sendinblue.com/docs/authentication
      - https://developers.brevo.com/docs/authentication-schemes
      - https://developers.brevo.com/docs/api-key-authentication
      - https://developers.brevo.com/reference/get-account
      - https://github.com/sendinblue/APIv3-php-library/blob/a966642e5fcbf3de87148dc619c36b464db7f991/lib/Configuration.php
      - https://github.com/sendinblue/APIv3-php-library/blob/a966642e5fcbf3de87148dc619c36b464db7f991/docs/Api/AccountApi.md
      - https://github.com/gitleaks/gitleaks/blob/c11adc91ad701db3e2c8df030f747086ebca8847/cmd/generate/config/rules/sendinblue.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.sendinblue.com/v3/account
          headers:
            api-key: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status:
                - 200
