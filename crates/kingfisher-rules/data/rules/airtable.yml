rules:
  - name: Airtable Personal Access Token
    id: kingfisher.airtable.1
    pattern: |
      (?x)                    
      \b                       
      (                        
        pat
        [A-Za-z0-9]{14}
        \.                     
        [a-f0-9]{64}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.3
    confidence: medium
    examples:
      - airtable_pat = patXfsZBLOgxbJqSi.fd6210cfb2e0b2049bd8e7fa0e69f26a3a704412af6fcbd93a097c42507fc893
    categories:
      - api
      - secret
    references:
      - https://airtable.com/developers/web/api/authentication
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/airtable.go
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.airtable.com/v0/meta/whoami

  - name: Airtable Legacy API Key
    id: kingfisher.airtable.3
    pattern: |
      (?xi)
      \b
      airtable
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:alnum:]]{17}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: low
    examples:
      - airtable_api_key = "keyaBcDeF1234567"
    references:
      - https://airtable.com/developers/web/api/authentication
      - https://airtable.com/developers/web/api/get-metadata
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/airtable.go#L10
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.airtable.com/v0/meta/whoami

  - name: Airtable OAuth Token
    id: kingfisher.airtable.2
    pattern: |
      (?xi)
      (
        [[:alnum:]]+\.v1\.[A-Z0-9_-]+\.[[:xdigit:]]+
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - example.v1.XYZ123_ABC.abcdef123456
    references:
      - https://airtable.com/developers/web/api/oauth-reference
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/airtable.go
      - https://datatracker.ietf.org/doc/html/rfc6749
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.airtable.com/v0/meta/whoami
