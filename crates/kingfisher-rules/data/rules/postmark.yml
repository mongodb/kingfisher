rules:
  - name: Postmark API Token
    id: kingfisher.postmark.1
    pattern: |
      (?xi)
      postmark [a-z0-9_-]{0,20}
      .{0,10}
      \b
      (
        [[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.0
    examples:
      - |
        postmark: "f59dffd2-83ea-47c7-ba8f-95e053a6d0ae",

      - |
        postmark: {
          fromEmail: '...@....com', // must be verified with postmarkapp.com
          postmarkApiToken: '00917922-dbe7-4882-bedc-10b93fc4c4c5', // our account token
        },

      - |
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json",
          "X-Postmark-Server-Token": "c2321bd2-5a8f-46f2-b8fb-dbc706bd6923",
        },
    references:
      - https://postmarkapp.com/developer/api/overview
      - https://github.com/praetorian-inc/noseyparker/blob/6dd8a6b0730cf2345b92f95f15946059e10dda19/crates/noseyparker/data/default/builtin/rules/postmark.yml
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.postmarkapp.com/server"
          headers:
            X-Postmark-Server-Token: "{{TOKEN}}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"ID":'
                - '"Name":'
              match_all_words: true
