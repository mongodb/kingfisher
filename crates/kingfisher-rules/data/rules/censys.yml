rules:
  - name: Censys API ID
    id: kingfisher.censys.1
    visible: false
    pattern: |
      (?xi)
      \b
      censys
      (?:.|[\n\r]){0,32}?
      (?:API[_-]?ID|APP[_-]?ID|ID)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "CENSYS_API_ID=a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    references:
      - https://search.censys.io/api

  - name: Censys API Secret
    id: kingfisher.censys.2
    pattern: |
      (?xi)
      \b
      censys
      (?:.|[\n\r]){0,32}?
      (?:SECRET|API[_-]?SECRET|KEY|TOKEN)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:alnum:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 3
      min_uppercase: 3
      min_lowercase: 3
    min_entropy: 3.5
    confidence: medium
    examples:
      - "CENSYS_API_SECRET=aBcDeFgHiJkLmNoPqRsTuVwXyZ012345"
    references:
      - https://search.censys.io/api
      - https://docs.censys.com/docs/ls-api
      - https://github.com/knownsec/pocsuite3/blob/9bed2883b86a8996f8805fc44da4a1911f52a11e/pocsuite3/modules/censys/__init__.py
    depends_on_rule:
      - rule_id: kingfisher.censys.1
        variable: CENSYS_API_ID
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://search.censys.io/api/v2/hosts/8.8.8.8
          headers:
            Accept: application/json
            Authorization: "Basic {{ CENSYS_API_ID | append: ':' | append: TOKEN | b64enc }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"status"', '"result"']
