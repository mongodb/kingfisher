rules:
  # Helper: extract the Datadog site domain from env/config assignments.
  # We capture the "site parameter" (domain), then validation uses https://api.<site>.
  - name: Datadog Site Domain
    id: kingfisher.datadog.1
    visible: false
    confidence: medium
    min_entropy: 2.5
    pattern: |
      (?xi)
      \b(?:DD_SITE|DD_API_URL|DATADOG_SITE|DATADOG_HOST|DATADOG_API_URL)\b\s*[:=]\s*["']?
      (?:https?://)?
      (?:api\.|app\.)?
      (
        datadoghq\.com
        | us3\.datadoghq\.com
        | us5\.datadoghq\.com
        | datadoghq\.eu
        | ap1\.datadoghq\.com
        | ap2\.datadoghq\.com
        | ddog-gov\.com
      )
      \b
    examples:
      - DD_SITE=datadoghq.eu
      - DATADOG_HOST=https://api.us3.datadoghq.com
      - DD_SITE=datadoghq.com
      - DATADOG_HOST=https://api.ddog-gov.com

  - name: Datadog API Key
    id: kingfisher.datadog.2
    pattern: |
      (?xi)
      \b(?:datadog|dd)
      (?:.|[\n\r]){0,64}?
      (?:api[_-]?key|dd[_-]?api[_-]?key|secret|private|access|token)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:alnum:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 3
    min_entropy: 3.3
    confidence: medium
    examples:
      - DD_API_KEY=0024a29224affe29d173c0bf99e5a89d
    references:
      - https://docs.datadoghq.com/account_management/api-app-keys/
      - https://github.com/projectdiscovery/nuclei-templates/blob/3c29bfc0cbceae06014a38c2baa2936b981f0038/http/global-matchers/secrets-patterns-rules.yaml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/datadog.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.datadoghq.com/api/v1/validate
          headers:
            Accept: application/json
            DD-API-KEY: "{{ TOKEN }}"
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
            - type: WordMatch
              words:
                - '"Forbidden"'
              negative: true

  - name: Datadog Application Key
    id: kingfisher.datadog.3
    pattern: |
      (?xi)
      \b(?:datadog|dd)
      (?:.|[\n\r]){0,64}?
      (?:app(?:lication)?[_-]?key|dd[_-]?application[_-]?key|secret|private|access|token)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Za-z0-9-]{40}
      )
      \b
    pattern_requirements:
      min_digits: 3
    min_entropy: 3.5
    confidence: medium
    examples:
      - DD_APPLICATION_KEY=abcDEF0123456789abcDEF0123456789abcDEF01
    references:
      - https://docs.datadoghq.com/account_management/api-app-keys/
      - https://docs.datadoghq.com/getting_started/site/
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/datadog.go
    depends_on_rule:
      - rule_id: kingfisher.datadog.2
        variable: DD_API_KEY
      - rule_id: kingfisher.datadog.1
        variable: DD_SITE_DOMAIN
    validation:
      type: Http
      content:
        request:
          method: GET
          # Datadog recommends /api/v2/validate_keys to verify app keys with the key pair
          url: "https://api.{{ DD_SITE_DOMAIN }}/api/v2/validate_keys"
          headers:
            Accept: application/json
            DD-API-KEY: "{{ DD_API_KEY }}"
            DD-APPLICATION-KEY: "{{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]

  - name: Datadog RUM Client Token
    id: kingfisher.datadog.4
    pattern: |
      (?xi)
      (?:["']?(?:DATADOG|DD)[_-]?(?:RUM[_-]?)?(?:CLIENT[_-]?)?TOKEN["']?|["']?(?:DATADOG|DD)[_-]?TOKEN["']?)
      \s*[":=]\s*["']?(pub[a-f0-9]{32})\b
    min_entropy: 3.0
    confidence: medium
    examples:
      - DATADOG_RUM_TOKEN=pub0123456789abcdef0123456789abcdef
    references:
      - https://docs.datadoghq.com/real_user_monitoring/browser/setup/
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/datadog.yml
