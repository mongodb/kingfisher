rules:
  - name: SiliconFlow API Key
    id: kingfisher.siliconflow.1
    pattern: |
      (?x)
      \b
      (?:
        SILICONFLOW_(?:API_KEY|API_TOKEN|TOKEN)
        |
        siliconflow[\s_-]*(?:api[\s_-]*(?:key|token)|token)
      )
      \s*[=:]\s*["']?
      (
        sk-[A-Za-z0-9]{48}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - "SILICONFLOW_API_KEY=sk-aB3dE5fG7hI9jK1lM3nO5pQ7rS9tU1vW3xY5zA7b9C1d3E5f"
      - 'siliconflow api_key="sk-Z9y8X7w6V5u4T3s2R1q0PnMlKjIhGfEdCbA0987654321Z0Y"'
    references:
      - https://docs.siliconflow.com/en/usercases/use-siliconcloud-in-ClaudeCode
      - https://cloud.siliconflow.com/account/ak
      - https://github.com/siliconflow/langchain-siliconflow/blob/730b2eb64d4227475179c953be6c79fff5a5881f/langchain_siliconflow/utils.py#L10-L22
      - https://github.com/siliconflow/OpenAPI
      - https://github.com/groq/openbench/blob/3f190a835f7fee34ccd96e17242a36a29e0620a6/README.md
      - https://github.com/BenedictKing/ccx/blob/7835222674d5d1ebd475ff996856c8acdd2ba65e/frontend/src/utils/quickInputParser.ts#L72-L86
      - https://huggingface.co/spaces/inclusionAI/ling-mini-2.0/commit/742582eef26ab4d45385c5cd26a1f6a492597376#d2h-170465
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.siliconflow.com/v1/models
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: "application/json"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
    # API-key rotation is managed in the SiliconFlow console at
    # https://cloud.siliconflow.com/account/ak; no public same-key revocation endpoint is documented.
