rules:
  - name: Hashicorp Vault Service Token (< v1.10)
    id: kingfisher.hashicorp.1

    pattern: |
      (?x)
      (?i: hashicorp | vault | token | key | secret )
      (?:.|[\n\r]){0,32}?
      \b
      (
        s\.[A-Za-z0-9_-]{24,128}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.0

    examples:
      - 'VAULT_CLIENT_TOKEN="s.Z4bTMtngfLeQ18AqVoBBkUAOD1"'
      - 'vaultToken="s.CAESIP2jTxc9S3K7Z6CtcFWQv7-044m_oS.0H3nF89l3GiYKHGh3cy5sQmlIZVNyTWJNcDRsYWJpQjlhYjVlb2cQh6PL8wEYAg"`'

    references:
      - https://developer.hashicorp.com/vault/docs/concepts/tokens
      - https://developer.hashicorp.com/hcp/docs/vault-radar/manage/secret-types
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/hashicorp.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/hashicorp.go

  - name: Hashicorp Vault Batch Token (< v1.10)
    id: kingfisher.hashicorp.2

    pattern: |
      (?x)
      (?i: hashicorp | vault | token | key | secret )
      ["':=\ ]{0,5}
      (b\.[A-Za-z0-9_-]{24,500})
      (?: [^A-Za-z0-9_-] | $ )
    pattern_requirements:
      min_digits: 2

    examples:
      - 'VAULT_CLIENT_TOKEN="b.Z4bTMtngfLeQ18AqVoBBkUAOD1"'
    confidence: medium
    min_entropy: 3.0
    references:
      - https://developer.hashicorp.com/vault/docs/concepts/tokens
      - https://developer.hashicorp.com/hcp/docs/vault-radar/manage/secret-types

  - name: Hashicorp Vault Recovery Token (< v1.10)
    id: kingfisher.hashicorp.3

    pattern: |
      (?x)
      (?i: hashicorp | vault | token | key | secret )
      ["':=\ ]{0,5}
      (r\.[A-Za-z0-9_-]{24,500})
      (?: [^A-Za-z0-9_-] | $ )
    pattern_requirements:
      min_digits: 2

    examples:
      - 'VAULT_CLIENT_TOKEN="r.Z4bTMtngfLeQ18AqVoBBkUAOD1"'

    confidence: medium
    min_entropy: 3.0
    references:
      - https://developer.hashicorp.com/vault/docs/concepts/tokens
      - https://developer.hashicorp.com/vault/docs/concepts/recovery-mode
      - https://developer.hashicorp.com/hcp/docs/vault-radar/manage/secret-types

  - name: Hashicorp Vault Service Token (>= v1.10)
    id: kingfisher.hashicorp.4

    pattern: |
      (?x)
      (hvs\.[A-Za-z0-9]{24,130})
      (?: [^A-Za-z0-9_-] | $ )
    pattern_requirements:
      min_digits: 2

    examples:
      - "apikey: hvs.JGbZZaCkOSgsZ56uhGlTK2zyC1j2mwhy0VLp4"

    confidence: medium
    min_entropy: 3.0
    references:
      - https://developer.hashicorp.com/vault/docs/concepts/tokens
      - https://developer.hashicorp.com/hcp/docs/vault-radar/manage/secret-types
      - https://github.com/projectdiscovery/nuclei-templates/blob/3c29bfc0cbceae06014a38c2baa2936b981f0038/http/exposures/tokens/vault/vault-service-token.yaml

  - name: Hashicorp Vault Batch Token (>= v1.10)
    id: kingfisher.hashicorp.5

    pattern: |
      (?x)
      (hvb\.[A-Za-z0-9_-]{24,500})
      (?: [^A-Za-z0-9_-] | $ )
    pattern_requirements:
      min_digits: 2

    examples:
      - "apikey: hvb.JGbZZaCkOSgsZ56uhGlTK2zyC1j2mwhy0VLp4"
      - "hvb.AAAAAQJgxDgqsGNorpoOR8hPZ5SU-ynBvCl764jyRP_fnX8WvkdkDzGjbLNGdPdtlY32Als2P36yDZueqzfdGw9RsaTeaYXSH5E4RYSWuRoQ9YRKIw9o7mDDY2ZcT3KOB7RwtW2w1FN2eDqcy_sbCjXPaM1iBVH-mqMSYRmRd2nb5D1SJPeBzIYRqSglLc32wUGN7xEzyrKUczqOKsIcybQA"

    confidence: medium
    min_entropy: 3.0

    references:
      - https://developer.hashicorp.com/vault/docs/concepts/tokens
      - https://developer.hashicorp.com/hcp/docs/vault-radar/manage/secret-types
      - https://github.com/projectdiscovery/nuclei-templates/blob/3c29bfc0cbceae06014a38c2baa2936b981f0038/http/exposures/tokens/vault/vault-batch-token.yaml

  - name: Hashicorp Vault Recovery Token (>= v1.10)
    id: kingfisher.hashicorp.6

    pattern: |
      (?x)
      (hvr\.[A-Za-z0-9]{24,130})
      (?: [^A-Za-z0-9_-] | $ )
    pattern_requirements:
      min_digits: 2

    examples:
      - "apikey: hvr.JGbZZaCkOSgsZ56uhGlTK2zyC1j2mwhy0VLp4"

    confidence: medium
    min_entropy: 3.0
    references:
      - https://developer.hashicorp.com/vault/docs/concepts/tokens
      - https://developer.hashicorp.com/vault/docs/concepts/recovery-mode
      - https://developer.hashicorp.com/hcp/docs/vault-radar/manage/secret-types

  - name: Hashicorp Vault Unseal Key
    id: kingfisher.hashicorp.7

    pattern: |
      (?x)
      (?i: unseal )
      \b
      .{1,10}
      ([a-zA-Z0-9+/]{44})
      (?: [^a-zA-Z0-9+/] | $ )
    pattern_requirements:
      min_digits: 2

    examples:
      - "Unseal Key 2: 0tZn+7QQCxphpHwTm7/dC3LpP5JGIbYl3PK8Sy81R+P2"
      - "oc -n vault exec -ti vault-0 -- vault operator unseal 98m+o2ylRhVbOi+3o5ub6PbP343ocFUVORgSYeypMDjh"

    confidence: medium
    min_entropy: 3.0
    references:
      - https://developer.hashicorp.com/vault/docs/concepts/seal

  - name: Hashicorp Vault AppRole Role ID
    id: kingfisher.hashicorp.8
    pattern: |
      (?x)
      (?i: role[_-]?id )
      \s* [:\s=] \s*
      (
        [[:xdigit:]]{8}
        (?:-[[:xdigit:]]{4}){3}
        -[[:xdigit:]]{12}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    visible: false
    examples:
      - "role_id: 87654321-4321-4321-4321-210987654321"
    references:
      - https://developer.hashicorp.com/vault/docs/auth/approle
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/hashicorpvault/detector.go

  - name: Hashicorp Vault AppRole Secret ID
    id: kingfisher.hashicorp.9
    pattern: |
      (?x)
      (?i: secret[_-]?id )
      \s* [:\s=] \s*
      (
        [[:xdigit:]]{8}
        (?:-[[:xdigit:]]{4}){3}
        -[[:xdigit:]]{12}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "secret_id: 1a85e8c0-3fed-4f06-8f1b-f52bd3de4617"
    references:
      - https://developer.hashicorp.com/vault/docs/auth/approle
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/hashicorpvault/detector.go
    # AppRole validation also requires the role ID and deployment-specific Vault URL.
    # Do not send discovered credentials to arbitrary scan-derived hosts.
