rules:
  - name: ClickHouse Cloud Secret Key
    id: kingfisher.clickhouse.1
    pattern: |
      (?x)
      \b
      (
        4b1d[a-zA-Z0-9]{38}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: high
    min_entropy: 3.5
    examples:
      - "4b1dwEZ8aNo1U9ODBqffSci1INBrltLHM2d1bHF4dq"
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.clickhouse.cloud/v1/organizations"
          headers:
            Authorization: "Basic {{ CLICKHOUSE_ID | append: ':' | append: TOKEN | b64enc }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"id":'
                - '"name":'
              match_all_words: true
    depends_on_rule:
      - rule_id: "kingfisher.clickhouse.2"
        variable: CLICKHOUSE_ID
    references:
      - https://clickhouse.com/docs/cloud/security/cloud-access-management/overview
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/clickhouse.go
      - https://datatracker.ietf.org/doc/html/rfc7617
  - name: ClickHouse Cloud Key ID
    id: kingfisher.clickhouse.2
    pattern: |
      (?xi)
      \b
      clickhouse
      (?:.|[\n\r]){0,16}?
      (?:ID|USER)
      (?:.|[\n\r]){0,16}?
      (
        [[:alnum:]]{20}
      )
    pattern_requirements:
      min_digits: 2
    confidence: medium
    visible: false
    min_entropy: 3.0
    examples:
      - "clickhouse_id = 4ywspD2Tb0gJh4QbLnDI"
    references:
      - https://clickhouse.com/docs/cloud/security/cloud-access-management/overview
