rules:
  - name: Shippo API Token
    id: kingfisher.shippo.1
    pattern: |
      (?xi)
      \b
      (
        shippo_(?:live|test)_[[:xdigit:]]{40}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - SHIPPO_TOKEN=shippo_test_1234567890abcdef1234567890abcdef12345678
      - 'Authorization: "ShippoToken shippo_live_abc12fabcdefabcdefabcdefabcdefabcdefabcd"'
    references:
      - https://goshippo.com/docs/reference
      - https://github.com/gitleaks/gitleaks/blob/c11adc91ad701db3e2c8df030f747086ebca8847/cmd/generate/config/rules/shippo.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.goshippo.com/shipments/
          headers:
            Authorization: "ShippoToken {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status:
                - 200
