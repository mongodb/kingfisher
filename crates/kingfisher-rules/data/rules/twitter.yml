rules:
  - name: X / Twitter Bearer Token (App-only)
    id: kingfisher.twitter.1
    pattern: |
      (?xi)           
      \b                       
      (?:twitter|x.com|twtr)?
      (?:.|[\n\r]){0,16}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN|BEARER)
      (?:.|[\n\r]){0,16}?
      \b
      (                                      
        A{10,}[A-Za-z0-9_\-]{40,200}         
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 4.0
    confidence: medium
    examples:
      - "Twitter Secret: Bearer AAAAAAAAAAAAAAAAAAAb342O1ksbnZiwemJv0g9LrF6cRazflLJEDbmmuAr8GQbDkDrYHoqPM1xr8tmP5LGW1Vq_soJIsolxqOXtAPA2hUGXIBYubxWPLVZkUs7jYBizqlDRDSHRGXKP2nuCzdbNlxKcgMQzrm"
      - TWITTER_BEARER="AAAAAAAAAAAAAAxrrTSuijZNLygaTAEMAc_iY1nOdFRc1OP4fpMZiEkTQ4D-QaCvOhvBvpu5zwH67VvwE9MlmL78ptDdFP_FX6fgcJnQOcvsedOXNP9t3D1fYkJcJT3kXldAIJJ"
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.x.com/1.1/application/rate_limit_status.json
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ['"rate_limit_context"']
              match_all_words: true
    references:
      - https://developer.x.com/en/docs/x-api/v1/developer-utilities/rate-limit-status/api-reference/get-application-rate_limit_status
  - name: Twitter Consumer Key
    id: kingfisher.twitter.2
    pattern: |
      (?xi)
      \b
      twitter
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      (
        [A-Z0-9]{25}
      )
    min_entropy: 3.5
    visible: false
    examples:
      - "TWITTER_KEY=4RTBCyG2TbvL407A1lWxQFKCC"
  - name: X / Twitter Consumer Secret
    id: kingfisher.twitter.3
    pattern: |
      (?xi)
      \b
      twitter
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      (
        [A-Z0-9]{50}
      )
    min_entropy: 4.0
    examples:
      - "TWITTER_SECRET=ZGwXeK2DNCqv49Z9ofwYdqlBgeoHDyh8uoAgHju6OeYC7wTQJq"
    references:
      - https://developer.x.com/en/docs/authentication/oauth-2-0/application-only
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.twitter.com/oauth2/token
          headers:
            Authorization: "Basic {{ TWITTER_KEY | append: ':' | append: TOKEN | b64enc }}"
            Content-Type: "application/x-www-form-urlencoded;charset=UTF-8"
          body: "grant_type=client_credentials"
          response_matcher:
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"token_type":"bearer"'
                - '"access_token":'
              match_all_words: true
    depends_on_rule:
      - rule_id: "kingfisher.twitter.2"
        variable: TWITTER_KEY

  - name: X / Twitter Access Token
    id: kingfisher.twitter.4
    pattern: |
      (?xi)
      \b
      twitter
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [0-9]{15,25}-
        [a-zA-Z0-9]{20,40}
      )
      \b
    pattern_requirements:
      min_digits: 6
    min_entropy: 3.5
    confidence: medium
    examples:
      - twitter_access_token = "1234567890123456789-aBcDeFgHiJkLmNoPqRsT"
      - twitter_access_token = "123456789012345-aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"
    references:
      - https://developer.x.com/en/docs/authentication/oauth-1-0a
      - https://developer.x.com/en/docs/authentication/oauth-1-0a/creating-a-signature
      - https://github.com/tweepy/tweepy/blob/c1978d643ecce491929084e4290b35f57e4921ad/examples/API_v1/authentication.py
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/twitter.go#L52
    # No validation: X/Twitter access tokens use OAuth 1.0a HMAC-SHA1 request
    # signing that requires the consumer key, consumer secret, access token, and
    # access token secret combined into a signature. This cannot be expressed as
    # a simple HTTP validation. See tweepy's OAuth1UserHandler for the signing
    # flow: https://github.com/tweepy/tweepy/blob/c1978d643ecce491929084e4290b35f57e4921ad/examples/API_v1/authentication.py

  - name: X / Twitter Access Secret
    id: kingfisher.twitter.5
    pattern: |
      (?xi)
      \b
      twitter
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [a-zA-Z0-9]{45}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - twitter_access_secret = "aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789aBcDeFgHi"
    references:
      - https://developer.x.com/en/docs/authentication/oauth-1-0a
      - https://developer.x.com/en/docs/authentication/oauth-1-0a/creating-a-signature
      - https://github.com/tweepy/tweepy/blob/c1978d643ecce491929084e4290b35f57e4921ad/examples/API_v1/authentication.py
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/twitter.go#L66
    # No validation: the access token secret is the HMAC-SHA1 signing key in
    # OAuth 1.0a. It cannot be validated independently — it must be combined
    # with the consumer key, consumer secret, and access token to sign a
    # request. See tweepy's authentication example:
    # https://github.com/tweepy/tweepy/blob/c1978d643ecce491929084e4290b35f57e4921ad/examples/API_v1/authentication.py
