rules:
  - name: Honeycomb API Key
    id: kingfisher.honeycomb.1
    pattern: |
      (?x)
      \b
      (?i:
        HONEYCOMB(?:[_-](?:API|TEAM|WRITE|SECRET|ACCESS))?[_-]?(?:API[_-]?)?KEY
        | HONEYCOMB[_-]TOKEN
        | X[-_]HONEYCOMB[-_]TEAM
      )
      \b
      \s*(?:=|:)\s*["']?
      (
        hc[a-z0-9]ik_[[:alnum:]]{58}
        | [[:alnum:]]{22}
        | [[:xdigit:]]{32}
      )
      (?:["'\s,;}]|$)
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - HONEYCOMB_API_KEY=hcxik_ncxnrFlCIxlWrL9yMpl92MiKfainwFEWLGAG3BLRX5BA8XXq2fAXUHe3AM
      - HONEYCOMB_TOKEN=z0d1f2bcaloumn3456789P
      - "X_HONEYCOMB_TEAM: 8f14e45fceea167a5a36dedd4bea2543"
    references:
      - https://api-docs.honeycomb.io/api/auth
      - https://docs.honeycomb.io/api/
      - https://github.com/honeycombio/meminator-workshop/blob/1afe8020b1202dcd7ee2c96222539d9d91845b9c/scripts/honeycomb-whoami.sh
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.honeycomb.io/1/auth
          headers:
            X-Honeycomb-Team: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ['"id"', '"type"', '"team"', '"environment"']
