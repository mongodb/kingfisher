rules:
  - name: Tolgee Project API Key
    id: kingfisher.tolgee.1
    pattern: |
      (?x)
      \b
      (
        tgpak_[a-z0-9]{45,64}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "TOLGEE_API_KEY=tgpak_grpxa5lfgvzdsnluovswknluonrtc3rxnzzw2nttmjww7"
      - "X-API-Key: tgpak_geytmnk7onuwy3lmmztgk5tkmezwsz3bg53g4mzrmqzhen3ghb"
    references:
      - https://tolgee.io/platform/account_settings/api_keys_and_pat_tokens
      - https://github.com/tolgee/documentation/blob/311743e5e668481f951a486531eeba6c9c8f8352/platform/account_settings/api_keys_and_pat_tokens.mdx
      - https://github.com/tolgee/documentation/blob/311743e5e668481f951a486531eeba6c9c8f8352/api/tolgee-api.info.mdx
      - https://github.com/tolgee/tolgee-platform/blob/0987795171979736ef39d032b7efd96956654364/backend/data/src/main/kotlin/io/tolgee/security/constants.kt
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://app.tolgee.io/v2/projects
          headers:
            X-API-Key: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: Tolgee Personal Access Token
    id: kingfisher.tolgee.2
    pattern: |
      (?x)
      \b
      (
        tgpat_[a-z0-9]{48,64}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "TOLGEE_PAT=tgpat_1sv7jfqkcfanhv7fsff49tbedffm2jptusg5ngcp4e98nc7ijhq7"
    references:
      - https://tolgee.io/platform/account_settings/api_keys_and_pat_tokens
      - https://github.com/tolgee/documentation/blob/311743e5e668481f951a486531eeba6c9c8f8352/platform/account_settings/api_keys_and_pat_tokens.mdx
      - https://github.com/tolgee/documentation/blob/311743e5e668481f951a486531eeba6c9c8f8352/api/tolgee-api.info.mdx
      - https://github.com/tolgee/tolgee-platform/blob/0987795171979736ef39d032b7efd96956654364/backend/data/src/main/kotlin/io/tolgee/security/constants.kt
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://app.tolgee.io/v2/projects
          headers:
            X-API-Key: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
