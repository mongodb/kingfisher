rules:
  - name: HuggingFace User Access Token
    id: kingfisher.huggingface.1
    pattern: |
      (?xi)
      (?:
        (
          (?:api_org|hf)_
          (?:[[:alnum:]]{17}){2}
        )   
      )
      \b
    references:
      - https://huggingface.co/docs/hub/security-tokens
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/huggingface.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/huggingface.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/huggingface/huggingface-user-access-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/huggingface/huggingface-user-access.yaml
    min_entropy: 3.3
    confidence: medium
    examples:
      - 'HF_TOKEN:"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"'
      - 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
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
            Content-Type: application/json
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
            - match_all_words: true
              type: WordMatch
              words:
                - '"name":'
                - '"id":'
          url: https://huggingface.co/api/whoami-v2
