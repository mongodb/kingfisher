rules:
  - name: Lichess Personal Access Token
    id: kingfisher.lichess.1
    pattern: |
      (?x)
      \b
      (
        lip_[a-zA-Z0-9_]{17,30}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    categories: [api, key]
    examples:
      - "LICHESS_TOKEN=lip_8UWFEBAszsk2iTyY1eq1"
      - "LICHESS_TOKEN=lip_AbCdEfGhIjKlMnOpQr12"
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://lichess.org/api/account
          headers:
            Authorization: Bearer {{ TOKEN }}
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    references:
      - https://lichess.org/api
      - https://github.com/lichess-org/berserk/blob/3d074f9bfccf7e861d2c5896fe891b65c818fd8c/berserk/session.py
      - https://github.com/lichess-org/api/blob/3033570771c5583c9cfc077ba68231b9b5172182/example/oauth-backend/index.js
