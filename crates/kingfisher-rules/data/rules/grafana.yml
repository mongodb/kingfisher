rules:
  - name: Grafana API Token
    id: kingfisher.grafana.1
    pattern: |
      (?x)
      \b
      (
        eyJrIjoi
        [A-Za-z0-9+/]{40,380}
        ={0,2}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - "Authorization: Bearer eyJrIjoiWHZiSWd5NzdCYUZnNUtibE8obUpESmE2bzJYNDRIc1UiLCJuIjoibXlrZXkiLCJpZCI6MX0="
      - 'admin_client = GrafanaClient("eyJrIjoiY21sM1JRYjB6RnVYSTNLenRWQkFEaWN2bXI2V202U2IiLCJuIjoiYWRtaW5rZXkiLCJpZCI6MX0=", host=grafana_host, port=3000, protocol="http")'
    references:
      - https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/authentication/
      - https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/org/
      - https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/api-legacy/authentication/
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/grafana.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/grafana.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/grafana/grafana-key.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/grafana/grafana-api-key.yaml
    depends_on_rule:
      - rule_id: kingfisher.grafana.4
        variable: GRAFANADOMAIN
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://{{ GRAFANADOMAIN }}/api/org"
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ['"id"', '"name"']

  - name: Grafana Cloud API Token
    id: kingfisher.grafana.2
    pattern: |
      (?xi)
      \b
      (
        glc_
        [a-z0-9+/]{40,150}
        ={0,2}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_lowercase: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - '  "token": "glc_eyJrIjoiZjI0YzZkNGEwZDBmZmZjMmUzNTU3ODcxMmY0ZWZlNTQ1NTljMDFjOCIsIm6iOiJteXRva3VuIiwiaWQiOjF8"'
      - "grafana = glc_etLvNLoNMLt7MTczNNwNbN6Nm1ldGEtbW9paxRvcmlpZt14ZXN4NNwNatN6NLCxdKeH7KTUvWpNqCrHlMKE9EhLcZH7to"
    references:
      - https://grafana.com/docs/grafana/latest/developer-resources/api-reference/cloud-api/
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/grafana.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/grafana/grafana-cloud-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/grafana/grafana-cloud-api-token.yaml
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://grafana.com/api/stack-regions
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: Grafana Service Account Token
    id: kingfisher.grafana.3
    pattern: |
      (?xi)
      \b
      (
        glsa_[[:alnum:]]{32}_[[:xdigit:]]{8}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - |
        curl -H "Authorization: Bearer glsa_HOruNAb7SOiCdshU7algkrq7FDsNSLAa_55e2f8be" -X GET '<grafana_url>/api/org' | jq
      - |
        // headers: { Authorization: `Bearer glsa_Sof0HKi3agxrQP9qm5r2G98VacBNwV5P_9b638c45` }
    references:
      - https://grafana.com/blog/new-in-grafana-9-1-service-accounts-are-now-ga/
      - https://grafana.com/docs/grafana/latest/administration/service-accounts/
      - https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/org/
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/grafana.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/grafana/grafana-serviceaccount-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/grafana/grafana-service-account-token.yaml
    depends_on_rule:
      - rule_id: kingfisher.grafana.4
        variable: GRAFANADOMAIN
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://{{ GRAFANADOMAIN }}/api/org"
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ['"id"', '"name"']

  - name: Grafana Domain
    id: kingfisher.grafana.4
    pattern: |
      (?xi)
      \b(?:url|host|endpoint|base_?url|domain|root_?url|grafana[_-]?(?:url|host|endpoint|server|base_?url|domain))\b
      ["']?\s*[:=]\s*
      ["']?
      (?:https?://)?
      (
        (?:[a-z0-9-]+\.){0,4}
        grafana(?:\.[a-z0-9-]{1,63}){1,4}
        (?::\d{2,5})?
      )
      \b
    min_entropy: 3.0
    pattern_requirements:
      ignore_if_contains:
        - grafana.com
        - grafana.net
        - grafana.org
    visible: false
    confidence: medium
    examples:
      - GRAFANA_URL=https://grafana.example.com
      - grafana_host=https://grafana.prod.eu-west.mycorp.internal:3000
      - '  "endpoint": "https://api.team1.grafana.services.cluster.local"'
      - url = https://grafana.dev.foo-bar.co.uk
    references:
      - https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/api-legacy/authentication/
