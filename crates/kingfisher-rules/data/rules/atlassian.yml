rules:
  - name: Atlassian API token
    id: kingfisher.atlassian.1
    pattern: |
      (?xi)                       
      \b                         
      atlassian
      (?:.|[\n\r]){0,20}?
      [^[:alnum:]]
      (?:api[_-]?token|api[_-]?key|token|key|secret|password)
      \b
      (?:.|[\n\r]){0,32}?
      \b                         
      (
        [[:alnum:]]{24}
      )
      \b
    pattern_requirements:
      min_lowercase: 1
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - Atlassian_key = "DjayBeny2rtpvydF4zAphcqc"
      - "ATLASSIAN_API_TOKEN:'abcdef1234567890abcdef12'"
    references:
      - https://developer.atlassian.com/cloud/admin/organization/rest/api-group-orgs/
      - https://developer.atlassian.com/cloud/admin/user-management/delete-managed-account/
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/atlassian.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.atlassian.com/admin/v1/orgs
          headers:
            Accept: application/json
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: Atlassian Admin API Key
    id: kingfisher.atlassian.3
    pattern: |
      (?x)
      (?:atlassian|api\.atlassian\.com)
      (?:.|[\n\r]){0,128}?
      \b
      (
        AT
        [[:alnum:]_=-]{60,260}
      )
      \b
    pattern_requirements:
      ignore_if_contains:
        - ATATT3xFfGF0
        - ATCTT3xFfGN0
        - ATBB
        - ATCO
    min_entropy: 3.8
    confidence: medium
    examples:
      - |
        # Example usage calling the Atlassian admin APIs
        curl --request GET \
          'https://api.atlassian.com/admin/v1/orgs' \
          --header 'Authorization: Bearer ATEXAMPLE1234567890abcdefghijklmnopqrstuvwxyz_-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789foobarAA11BB22'
    references:
      - https://community.atlassian.com/forums/Questions/Unauthorised-response-in-Get-Organizations-API/qaa-p/1216883#M4324
      - https://developer.atlassian.com/cloud/admin/organization/rest/
      - https://developer.atlassian.com/cloud/admin/api-access/rest/
      - https://support.atlassian.com/organization-administration/docs/manage-an-organization-with-the-admin-apis/
      - https://community.atlassian.com/learning/lesson/what-are-admin-apis
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.atlassian.com/admin/v1/orgs
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: Atlassian Account Email
    id: kingfisher.atlassian.4
    pattern: |
      (?xi)
      \b
      (?:
        ATLASSIAN_EMAIL
        |
        (?:atlassian|jira|confluence)
        (?:.|[\n\r]){0,48}?
        (?:email|user(?:name)?|account)
      )
      (?:.|[\n\r]){0,16}?
      (
        [[:alnum:]._%+-]+
        @
        [[:alnum:].-]+\.[[:alpha:]]{2,}
      )
      \b
    min_entropy: 2.0
    confidence: medium
    visible: false
    examples:
      - 'ATLASSIAN_EMAIL="developer@example.com"'
      - "jira username: release.bot@example.org"
    references:
      - https://developer.atlassian.com/cloud/jira/platform/basic-auth-for-rest-apis/

  - name: Atlassian Cloud API Token
    id: kingfisher.atlassian.5
    pattern: |
      (?x)
      \b
      (
        (?P<body>ATATT3xFfGF0[[:alnum:]_-]{20,800}=)
        (?P<checksum>[[:xdigit:]]{8})
      )
      \b
    pattern_requirements:
      checksum:
        actual:
          template: "{{ CHECKSUM | downcase }}"
          requires_capture: checksum
        expected: "{{ BODY | crc32_hex }}"
    min_entropy: 4.0
    confidence: medium
    examples:
      - ATATT3xFfGF0Ab3_defGh7-Jk9LmN2PqR5StUv8WxYz0Ab3_defGh7-Jk9LmN2PqR5StUv8WxYz0Ab3_defGh7-Jk9LmN2PqR5StUv8WxYz0=91BF55F4
    references:
      - https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
      - https://developer.atlassian.com/cloud/jira/platform/basic-auth-for-rest-apis/
      - https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-myself/
      - https://community.atlassian.com/forums/Bitbucket-questions/Can-we-confirm-BitBucket-s-token-prefixes/qaq-p/3093481
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/rules/config.yaml
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/filters/value_atlassian_token_check.py
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/atlassian.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/atlassian.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://{{ DOMAIN }}/rest/api/3/myself"
          headers:
            Accept: application/json
            Authorization: "Basic {{ ATLASSIAN_EMAIL | append: ':' | append: TOKEN | b64enc }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words:
                - '"accountId"'
    depends_on_rule:
      - rule_id: kingfisher.jira.1
        variable: DOMAIN
      - rule_id: kingfisher.atlassian.4
        variable: ATLASSIAN_EMAIL

  - name: Atlassian Connect Shared Secret
    id: kingfisher.atlassian.6
    pattern: |
      (?x)
      \b
      (
        ATCO[[:alnum:]_+/=-]{20,396}
      )
      (?:[^[:alnum:]_+/=-]|$)
    min_entropy: 4.0
    confidence: medium
    examples:
      - 'sharedSecret: "ATCOAb3_defGh7-Jk9LmN2PqR5StUv8WxYz0Ab3_defGh7-Jk9LmN2PqR5StUv8WxYz0"'
    references:
      - https://community.developer.atlassian.com/t/storing-and-handling-app-installation-secrets/51468
      - https://developer.atlassian.com/cloud/bitbucket/authentication-for-apps/
      - https://developer.atlassian.com/cloud/confluence/connect-app-descriptor/
      - https://bitbucket.org/atlassian/atlassian-connect-express/src/master/
    # Connect authentication also requires tenant context and a request-specific JWT, so there is no safe token-only validation endpoint.
