rules:
  - name: Gitalk OAuth Credentials
    id: kingfisher.gitalk.1
    pattern: |
      (?x)
      \b
      new \s+ Gitalk \s* \( \s* \{ \s*
        clientID: \s* '([a-f0-9]{20})', \s*
        clientSecret: \s* '([a-f0-9]{40})',
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.0
    references:
      - https://gitalk.github.io
      - https://github.com/gitalk/gitalk
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/gitalk.yml
    examples:
      - |
        new Gitalk({
          clientID: 'd17d49be2e680b78a83d',
          clientSecret:'9363cb456dda6402cb71d65092490e75c9f11873',
