rules:
  - name: Confluent Client ID
    id: kingfisher.confluent.1
    pattern: |
      (?xi)
      \b(?:confluent|ccloud|cpdev|kafka)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:alnum:]]{16}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3
    confidence: medium
    visible: false
    examples:
      - confluent client_id=ABCD1234EFGH5678
      - kafka_client=WXYZ9876MNOP5432
    references:
      - https://docs.confluent.io/cloud/current/access-management/authenticate/api-keys.html
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/confluent.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/confluent/confluent-accesstoken.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/confluent/confluent-access-token.yaml
  - name: Confluent API Secret
    id: kingfisher.confluent.2
    pattern: |
      (?xi)
      (?:confluent|ccloud|cpdev|kafka)
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Z0-9\+/]{64}
      )
    min_entropy: 3.3
    confidence: medium
    examples:
      - confluent secret=cbadefghijklmnopqrstuvwxyzcbaDEFGHIJKLMNOPQRSTUVWXYZ3214567890ab
      - kafka_token=cbaDEFGHIJKLMNOPQRSTUVWXYZ3214567890cbadefghijklmnopqrstuvwxyzAB
    references:
      - https://docs.confluent.io/cloud/current/api.html#tag/API-Keys-(iamv2)/operation/getIamV2ApiKey
      - https://docs.confluent.io/cloud/current/api.html#tag/API-Keys-(iamv2)/operation/deleteIamV2ApiKey
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/confluent.go
      - https://datatracker.ietf.org/doc/html/rfc7617
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/confluent/confluent-secretkey.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/confluent/confluent-secret-token.yaml
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ CLIENTID | append: ":" | append: TOKEN | b64enc }}'
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.confluent.cloud/iam/v2/api-keys/{{ CLIENTID }}
    revocation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ CLIENTID | append: ":" | append: TOKEN | b64enc }}'
          method: DELETE
          url: https://api.confluent.cloud/iam/v2/api-keys/{{ CLIENTID }}
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 204]
    depends_on_rule:
      - rule_id: "kingfisher.confluent.1"
        variable: CLIENTID
  - name: Confluent API Secret - Updated Format
    id: kingfisher.confluent.3
    pattern: |
      (?xi)
      \b
      (
        cflt(?P<body>[A-Za-z0-9\+/]{54})(?P<checksum>[A-Za-z0-9\+/]{6})
      )
    pattern_requirements:
      checksum:
        actual:
          template: "{{ checksum }}"
          requires_capture: checksum
        expected: "{{ body | crc32_le_b64: 6 }}"
        skip_if_missing: true
    min_entropy: 3.3
    confidence: medium
    examples:
      - confluent secret=cfltcUBElySxR0ubmwjcLaVic7aOYceZ1HzCyW9BbhBhC+KbPgaTcGc9S4HfrjhA
    references:
      - https://docs.confluent.io/cloud/current/api.html#tag/API-Keys-(iamv2)/operation/getIamV2ApiKey
      - https://docs.confluent.io/cloud/current/api.html#tag/API-Keys-(iamv2)/operation/deleteIamV2ApiKey
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ CLIENTID | append: ":" | append: TOKEN | b64enc }}'
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.confluent.cloud/iam/v2/api-keys/{{ CLIENTID }}
    revocation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ CLIENTID | append: ":" | append: TOKEN | b64enc }}'
          method: DELETE
          url: https://api.confluent.cloud/iam/v2/api-keys/{{ CLIENTID }}
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 204]
    depends_on_rule:
      - rule_id: "kingfisher.confluent.1"
        variable: CLIENTID
