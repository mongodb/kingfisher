rules:
  - name: Duffel API Token
    id: kingfisher.duffel.1
    pattern: |
      (?x)
      \b
      (
        duffel_(?:test|live)_[a-zA-Z0-9_\-=]{43}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.2
    confidence: high
    examples:
      - DUFFEL_TOKEN=duffel_test_qwertyuiopasdfghjklzxcvbnm123456789abcdefgh
      - 'Authorization: "Bearer duffel_live_abcd1234efgh5678ijkl9012mnop3456qrstuvwxyza"'
    references:
      - https://duffel.com/docs/api
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/duffel.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.duffel.com/airlines
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
            Duffel-Version: v1
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status:
                - 200
