rules:
  - name: Pinterest Access Token
    id: kingfisher.pinterest.1
    pattern: |
      (?x)
      \b
      (
        pina_[a-zA-Z0-9_-]{20,100}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "PINTEREST_ACCESS_TOKEN=pina_AMAY5MAXAAO3OBAAGBAJ6DU2Z7NMHHQ8ACGSPPGHEIKF53FOGOTUH43N5OIC27ZPVRG3BGK25AIP4U26QXOGS4TERUEROOIB"
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.pinterest.com/v5/user_account
          headers:
            Authorization: Bearer {{ TOKEN }}
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    references:
      - https://developers.pinterest.com/docs/api/v5/
      - https://developers.pinterest.com/docs/getting-started/set-up-authentication-and-authorization
      - https://github.com/pinterest/api-quickstart/blob/592b4bacd85e5bb483bef2e2145aa841ae37ac5a/python/tests/src/test_access_token.py

  - name: Pinterest Refresh Token
    id: kingfisher.pinterest.2
    pattern: |
      (?x)
      \b
      (
        pinr_[a-zA-Z0-9._-]{20,300}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "PINTEREST_REFRESH_TOKEN=pinr_eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc123"
    references:
      - https://developers.pinterest.com/docs/api/v5/oauth-token/
      - https://developers.pinterest.com/docs/getting-started/set-up-authentication-and-authorization
      - https://github.com/pinterest/api-quickstart/blob/592b4bacd85e5bb483bef2e2145aa841ae37ac5a/python/tests/src/test_access_token.py
