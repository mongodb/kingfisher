rules:
  - name: Storyblok API Token
    id: kingfisher.storyblok.1
    pattern: |
      (?x)
      \b
      (
        [[:alnum:]]{22}tt
      )
      \b
    min_entropy: 3.5
    confidence: medium
    pattern_requirements:
      min_digits: 1
      min_uppercase: 1
      min_lowercase: 1
    examples:
      - storyblok_theme_token = "J8a0kIiQV4SBvnv7q0ddUwtt"
      - storyblok_preview_token = "KODXRlrsHSirnbZ4OQFPrQtt"
      - storyblok_public_token = "rxzkt2RmiMrCNyYHjlvLLQtt"
      - storyblok_token = "qqeNjdtdYztgaidoo5SHaAtt"
    references:
      - https://www.storyblok.com/docs/api/content-delivery/v2/getting-started/authentication
      - https://www.storyblok.com/docs/concepts/access-tokens
      - https://www.storyblok.com/docs/api/content-delivery/v2#authentication
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.storyblok.com/v2/cdn/stories?token={{ TOKEN }}&version=published&per_page=1"
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
