rules:
  - name: MailGun Token
    id: kingfisher.mailgun.1
    pattern: |
      (?xi)
      \b
      mailgun
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b                     
      (                      
        (?:[0-9A-Z-]{24}){3}
      )
    pattern_requirements:
      min_digits: 2
      min_lowercase: 1
    min_entropy: 3.5
    confidence: medium
    examples:
      - mailgun_api_key=abcdef123456abcdef123456abcdef123456abcdef123456abcdef123456abcdef123456
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Basic {{ TOKEN | b64enc }}
            Accept: application/json
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.mailgun.net/v3/address/validate?address=test@example.com
    references:
      - https://documentation.mailgun.com/docs/mailgun/api-reference/mg-auth
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/mailgun.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/mailgun.go

  - name: MailGun Webhook Signing Key
    id: kingfisher.mailgun.3
    pattern: |
      (?xi)
      \b
      mailgun
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|SIGNING|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [a-h0-9]{32}-
        [a-h0-9]{8}-
        [a-h0-9]{8}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - mailgun_signing_key = "a1b2c3d4e5f67890a1b2c3d4e5f67890-00001111-22223333"
    references:
      - https://documentation.mailgun.com/docs/mailgun/api-reference/mg-auth
      - https://documentation.mailgun.com/docs/mailgun/webhooks/#webhook-signatures
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/mailgun.go#L52
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ "api:" | append: TOKEN | b64enc }}'
            Accept: application/json
          method: GET
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
          url: https://api.mailgun.net/v3/domains
    # Revocation not added: Mailgun API key revocation (DELETE /v1/keys/{key_id})
    # requires the key_id (not the key value) and the token format here doesn't
    # allow us to reliably extract the key_id from a listing.
  - name: MailGun Primary Key
    id: kingfisher.mailgun.2
    pattern: |
      (?xi)
      (?:mailgun|mg)
      (?:.|[\n\r]){0,64}?
      \b
      (                      
        key-(?:[[:xdigit:]]{8}){4}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - key-mailgun_token= key-ad13dfc23adf55fa404a91e76d96f472
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ "api:" | append: TOKEN | b64enc }}'
            Accept: application/json
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.mailgun.net/v3/address/validate?address=test@example.com
    references:
      - https://documentation.mailgun.com/docs/mailgun/api-reference/mg-auth
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/mailgun.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/mailgun.go
