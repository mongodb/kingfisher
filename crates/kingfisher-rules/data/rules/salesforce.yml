rules:
  - name: Salesforce Access Token
    id: kingfisher.salesforce.1
    pattern: |
      (?xi)
      \b
      (
        00
        [A-Z0-9]{13}
        !
        [A-Z0-9._-]{80,260}
      )
    pattern_requirements:
      min_digits: 6
    min_entropy: 3.3
    confidence: medium
    examples:
      - 00DE0X0A0M0PeLE!CJoAQOx1GCLf1UIt4UU9y0VOPLUZAYN6I8DsdGEDyHh5cO02egObcAhIDHYiGCfi94c53oFbr4HB.xZfuYRGhvNuxobAAXRe
      - |
        === Org Description
        KEY               VALUE
        ────────────────  ────────────────────────────────────────────────────────────────────────────────────────────────────────────────
        Access Token      00DE0X0A0M0PeLE!AQcAQH0dMHEXAMPLEzmpkb58urFRkgeBGsxL_QJWwYMfAbUeeG7c1EXAMPLEDUkWe6H34r1AAwOR8B8fLEz6nEXAMPLEAAAA
        Client Id         PlatformCLI
        Connected Status  Connected
        Id                00D5fORGIDEXAMPLE
        Instance Url      https://MyDomainName.my.salesforce.com
        Username          juliet.capulet@empathetic-wolf-g5qddtr.com
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          method: GET
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ["DailyApiRequests"]
              match_all_words: true
          url: "https://{{ INSTANCE }}/services/data/v60.0/limits"
    references:
      - https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_authentication.htm
      - https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-direct-api-connected-app.html
      - https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_describeGlobal.htm
      - https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_query.htm
      - https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_userpermissionaccess.htm
      - https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_permissionsetassignment.htm
    depends_on_rule:
      - rule_id: "kingfisher.salesforce.2"
        variable: INSTANCE

  - name: Salesforce Instance URL
    id: kingfisher.salesforce.2
    pattern: |
      (?xi)
      \b
      (?:https?://)?
      (
        (?:
          [0-9A-Z](?:[0-9A-Z-]{0,61}[0-9A-Z])?
          (?:\.[0-9A-Z](?:[0-9A-Z-]{0,61}[0-9A-Z])?){0,4}
          \.my\.salesforce\.com
          |
          [A-Z]{2,8}[0-9]{1,4}\.salesforce\.com
        )
      )
      \b
    min_entropy: 2.5
    confidence: medium
    visible: false
    examples:
      - https://example123.my.salesforce.com
      - mydomainname.my.salesforce.com
      - acme--dev.sandbox.my.salesforce.com
      - na123.salesforce.com
    references:
      - https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_authentication.htm
  - name: Salesforce Consumer Key
    id: kingfisher.salesforce.3
    pattern: |
      (?x)(?s)
        \bconsumerKey\b
        (?:.|[\n\r]){0,32}?
        \b
        (
          [A-Za-z0-9+/=._-]{16,256}
        )
        \b
    min_entropy: 3.3
    pattern_requirements:
      min_digits: 3
    confidence: medium
    examples:
      - |
        <?xml version="1.0" encoding="UTF-8"?>
        <AuthProvider xmlns="http://soap.sforce.com/2006/04/metadata">
