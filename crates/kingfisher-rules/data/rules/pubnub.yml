rules:
  - name: PubNub Publish Key
    id: kingfisher.pubnub.1
    pattern: |
      (?xi)
      \b
      (
        pub-c-[[:alnum:]]{8}(?:-[[:alnum:]]{4}){3}-[[:alnum:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    examples:
      - pub-c-12345678-1234-1234-1234-123456789012
    validation:
      type: Http
      content:
        request:
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: "https://ps.pndsn.com/publish/{{ TOKEN }}/{{ SUBSCRIPTIONTOKEN }}/0/kingfisher/0/%22ping%22?uuid=kingfisher_validate"
    references:
      - https://www.pubnub.com/docs/sdks/rest-api
    depends_on_rule:
      - rule_id: "kingfisher.pubnub.2"
        variable: SUBSCRIPTIONTOKEN
  - name: PubNub Subscription Key
    id: kingfisher.pubnub.2
    pattern: |
      (?xi)
      \b
      (
        sub-c-[[:alnum:]]{8}(?:-[[:alnum:]]{4}){3}-[[:alnum:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - sub-c-12345678-abcd-1234-efgh-567890abcdef
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://ps.pndsn.com/v2/objects/{{ TOKEN }}/uuids/kingfisher_validate"
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
    references:
      - https://www.pubnub.com/docs/sdks/rest-api
      - https://www.pubnub.com/docs/sdks/rest-api # Vendor docs document the same validation endpoint (ps.pndsn.com):
