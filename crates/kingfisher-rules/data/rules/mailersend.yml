rules:
  - name: MailerSend API Token
    id: kingfisher.mailersend.1
    pattern: |
      (?x)
      \b
      (
        mlsn\.[a-zA-Z0-9]{30,100}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "MAILERSEND_API_TOKEN=mlsn.AbCdEfGhIjKlMnOpQrStUvWxYz1234567890AbCdEfGhIj"
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.mailersend.com/v1/api-quota
          headers:
            Authorization: Bearer {{ TOKEN }}
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    references:
      - https://www.mailersend.com/help/managing-api-tokens
      - https://developers.mailersend.com/
      - https://github.com/mailersend/mailersend-ruby/blob/4f448a264b264216b418f56bad63d2c6968909d4/fixtures/api_quota/api_quota_get.yml
