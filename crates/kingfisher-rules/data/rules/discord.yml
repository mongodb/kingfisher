rules:
  - name: Discord Webhook URL
    id: kingfisher.discord.1
    pattern: |
      (?xi)
      (
        https://discord(app)?\.com/api/webhooks/
        [0-9]{17,20}
      )/
      (
        [0-9a-z_\-]{60,68}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - https://discord.com/api/webhooks/123456789012345678/abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdef
    categories:
      - api
      - webhook
    validation:
      type: Http
      content:
        request:
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: "{{ TOKEN }}"
    references:
      - https://discord.com/developers/docs/resources/webhook
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/discord.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/discord/discord-webhook.yaml
    revocation:
      type: Http
      content:
        request:
          method: DELETE
          url: "{{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [204]
  - name: Discord Bot Token
    id: kingfisher.discord.2
    pattern: |
      (?xi)
      (
        [MNO][[:alnum:]_-]{23}\.[[:alnum:]_-]{6}\.[[:alnum:]_-]{27}
      )  
      \b
    min_entropy: 3.3
    confidence: medium
    examples:
      - "apikey: MC0dBvKTjD0rY0cV8i37CjBf.uLHQPq.Nb1Ok1mEhe-3iTdrGOuegj29yQR"
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bot {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://discord.com/api/v10/users/@me
    references:
      - https://discord.com/developers/docs/reference#authentication
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/discord.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/discord/discord-api-token.yaml
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/discordbottoken/detector.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/discordbottoken/validator.go
  - name: Discord Bot ID
    id: kingfisher.discord.3
    pattern: |
      (?xi)
      (?:discord|botid|bot_id)
      (?:.|[\n\r]){0,64}?
      (
        \d{17,19}
      )
    min_entropy: 3.5
    visible: false
    confidence: medium
    examples:
      - discord = 12345678901234567
      - 'bot_id: "123456789012345678"'
    references:
      - https://discord.com/developers/docs/topics/oauth2#bots
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/discord/discord-clientid.yaml

  - name: Discord MFA Token
    id: kingfisher.discord.4
    pattern: |
      (?xi)
      (?i:discord)
      (?:.|[\n\r]){0,50}?
      (
        mfa\.[[:alnum:]_-]{20,100}
      )
      \b
    min_entropy: 3.3
    confidence: medium
    examples:
      - DISCORD_MFA_TOKEN=mfa.0cnbipS2Fc6ulEt19f_SoljuV8CnfttTGHS1YJDdplIAuYNG
    references:
      - https://discord.com/developers/docs/reference#authentication
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/discordbottoken/detector.go
    # MFA tokens are user credentials, not bot tokens, so the Bot-auth
    # validator used by kingfisher.discord.2 does not apply safely.
