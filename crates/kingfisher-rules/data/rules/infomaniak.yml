rules:
  - name: Infomaniak API Token
    id: kingfisher.infomaniak.1
    pattern: |
      (?xi)
      \b
      infomaniak
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Za-z0-9_\-]{60,100}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 4.0
    confidence: medium
    examples:
      - infomaniak_api_token = "AYF5lSh3c7XyRm4n1aK2bBcCdDeEfFgGhHiIjJkKlLmMnNoOpPqQrRsStTuUvVwWxXyYzZ0123456789ABCD"
    references:
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/infomaniak.go#L9
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.infomaniak.com/1/profile
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
