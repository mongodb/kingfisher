rules:
  - name: Thunderstore API Token
    id: kingfisher.thunderstore.1
    pattern: |
      (?x)
      \b
      (
        tss_[A-Za-z0-9]{36}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    categories: [api, key]
    examples:
      - "THUNDERSTORE_TOKEN=tss_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789"
    references:
      - https://thunderstore.io/api/docs/
      - https://github.com/thunderstore-io/Thunderstore/blob/3657fa0f9e5ee7f77a2a3e1f60bd799ac09a226a/django/thunderstore/account/tokens.py
      - https://github.com/thunderstore-io/Thunderstore/blob/3657fa0f9e5ee7f77a2a3e1f60bd799ac09a226a/django/thunderstore/account/tests/test_service_account_api_token.py
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://thunderstore.io/api/experimental/current-user/
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"username"'
