rules:
  - name: Astral pyx User Key (v1)
    id: kingfisher.pyx.1
    pattern: |
      (?x)
      \b
      (
        sk-pyx-
        [[:alnum:]]{64}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 4.0
    confidence: medium
    examples:
      - sk-pyx-ABCDEFGHabcdefgh12345678ABCDEFGHabcdefgh12345678ABCDEFGHIJKLMNOP
    references:
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/pyxkeyv1/detector.go

  - name: Astral pyx User Key (v2)
    id: kingfisher.pyx.2
    pattern: |
      (?x)
      \b
      (
        sk-pyx-2
        [[:alpha:]]{45}
      )
      \b
    min_entropy: 3.8
    confidence: medium
    examples:
      - sk-pyx-2ABCDEFGHIJKLMNOPQRSTUVWXabcdefghijklmnopqrstu
    references:
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/pyxkeyv2/detector.go
