rules:
  - name: Ramp Client ID
    id: kingfisher.ramp.1
    pattern: |
      (?x)
      \b
      (
        ramp_id_[a-zA-Z0-9]{40}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "RAMP_CLIENT_ID=ramp_id_e7tkgf34YRlnUy17n4cuwMb3g2hYyPsTY0eS6GCQ"
    references:
      - https://docs.ramp.com/developer-api/v1/authorization
      - https://github.com/betterleaks/betterleaks/blob/6381fa45ae946c588e2e1334d8396a15e5171ad6/cmd/generate/config/rules/ramp.go
      - https://github.com/PostHog/posthog.com/blob/79cc49f3d14f41d08dbf4ba7639f33cec7a749ac/contents/docs/cdp/sources/ramp.md?plain=1#L58
      - https://github.com/scifleetb/ugolf/blob/6fbc0d0b2998768be21cf75f9ac9a3f4fbbede3a/.streamlit/secrets.toml

  - name: Ramp Client Secret
    id: kingfisher.ramp.2
    pattern: |
      (?x)
      \b
      (
        ramp_sec_[a-zA-Z0-9]{48}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - "RAMP_CLIENT_SECRET=ramp_sec_GcOkPC8YeGT5RsDztY1o9R2WN0aMMJsm9JksL2lPemGBgfyr"
    references:
      - https://docs.ramp.com/developer-api/v1/authorization
      - https://docs.ramp.com/openapi/developer-api.json
      - https://github.com/betterleaks/betterleaks/blob/6381fa45ae946c588e2e1334d8396a15e5171ad6/cmd/generate/config/rules/ramp.go
      - https://github.com/PostHog/posthog.com/blob/79cc49f3d14f41d08dbf4ba7639f33cec7a749ac/contents/docs/cdp/sources/ramp.md?plain=1#L58
      - https://github.com/PostHog/posthog.com/blob/79cc49f3d14f41d08dbf4ba7639f33cec7a749ac/contents/docs/cdp/sources/ramp.md?plain=1#L92
      - https://github.com/scifleetb/ugolf/blob/6fbc0d0b2998768be21cf75f9ac9a3f4fbbede3a/.streamlit/secrets.toml
      - https://github.com/metorial/metorial/blob/c4b365640ab06256b4f37f25842f696f876a2040/integrations/ramp/src/auth.ts
      - https://github.com/hotgluexyz/tap-ramp/blob/c940ee5c6eeedbaa8e3890a79c6e30b5ab58fdda/tap_ramp/auth.py
      - https://github.com/AccountingSeedDev/ASRamp/blob/788d9cdc9da843571483cf7b0fb165dc9467902d/force-app/main/default/classes/services/RampAuthService.cls
    depends_on_rule:
      - rule_id: kingfisher.ramp.1
        variable: CLIENT_ID
    # Ramp's OpenAPI defines this as the only non-destructive client-credentials endpoint.
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.ramp.com/developer/v1/token
          headers:
            Accept: application/json
            Content-Type: application/x-www-form-urlencoded
            Authorization: 'Basic {{ CLIENT_ID | append: ":" | append: TOKEN | b64enc }}'
          body: "grant_type=client_credentials&scope=transactions%3Aread"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 400, 401]
            - type: JsonValid
            - type: WordMatch
              match_all_words: false
              words:
                - '"access_token"'
                - invalid_scope
                - unauthorized_client
            - type: WordMatch
              negative: true
              words:
                - invalid_client

  - name: Ramp Application Signup Token
    id: kingfisher.ramp.3
    pattern: |
      (?x)
      \b
      (
        ramp_business_tok_[a-zA-Z0-9]{42}
      )
      \b
    pattern_requirements:
      min_digits: 1
    min_entropy: 3.5
    confidence: medium
    examples:
      - "RAMP_ACCESS_TOKEN=ramp_business_tok_N1wP4mT8vJ4xM9aB3cD4bF1gG2jT3uW2yZ0sQ3sY2f"
    references:
      - https://docs.ramp.com/developer-api/v1/authorization
      - https://github.com/ramp-public/ramp-cli/blob/23680ec97a21f30b08346d66abdeed05a94b81ae/src/ramp_cli/config/constants.py
      - https://github.com/ramp-public/ramp-cli/blob/23680ec97a21f30b08346d66abdeed05a94b81ae/src/ramp_cli/commands/feedback.py
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.ramp.com/developer/v1/token/info
          headers:
            Accept: application/json
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: StatusMatch
              status: [401]
              negative: true
            - type: JsonValid
