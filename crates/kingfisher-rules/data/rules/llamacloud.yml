rules:
  - name: Llama Cloud API Key
    id: kingfisher.llamacloud.1
    pattern: |
      (?x)
      \b
      (
        llx-
        [A-Za-z0-9]{44,52}
      )
      \b
    pattern_requirements:
      min_digits: 4
    min_entropy: 3.5
    confidence: high
    examples:
      - "LLAMA_CLOUD_API_KEY=llx-b3D8GhZgQ2iAY4qYvwueaOkedPrstZpASP4P4KrBaeeuR4CE"
      - "llama_api_key = 'llx-M0nQ3rS9tU5xZ7aB2dE4fG6hI1jK8lN0oPqRsT4wXyZa'"
    references:
      - https://docs.llmapi.com/quickstart
      - https://github.com/run-llama/llama_index/blob/7359b1acc74563f715d4463ace39fb4dc73d79af/docs/src/content/docs/framework/understanding/rag/loading/llamacloud.md
      - https://github.com/run-llama/n8n-llamacloud/blob/ba6281c53afe26f904117e7c717c1c9f569170c5/credentials/LlamaCloudApi.credentials.ts
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.cloud.llamaindex.ai/api/v1/projects
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
