rules:
  - name: HTML Password Input Pre-populated Credential
    id: kingfisher.html.1
    pattern: |
      (?xi)
      <input\b
      [^>]*?\btype\s*=\s*['"]?password['"]?[^>]*?\svalue\s*=\s*['"]([^'"]{4,200}?)['"]
      [^>]*?\/?>
    pattern_requirements:
      ignore_if_contains:
        - "****"
        - "***"
        - "••••"
        - "{{"
        - "${"
        - "<%"
        - "<?"
        - "{%"
        - "placeholder"
        - "changeme"
        - "example"
        - "test"
        - "demo"
        - "sample"
        - "your_password"
    min_entropy: 3.0
    confidence: low
    examples:
      - '<input type="password" value="Jasper@Admin2024!" name="jasper_password" />'
      - '<input name="smtp_pass" type=''password'' value="relay_secret_123">'
      - '<input type="password" value="AKIA6GTN2FZMZI2WBMDJ" class="form-control">'
      - '<input class="form-control" value="jasper_secret_XYZ!" type="password" name="jasper_password" />'
      - '<INPUT TYPE="PASSWORD" VALUE="Admin@1234" NAME="adminPass">'
      - '<input type=password value="UnquotedType!2024" name="pass" />'
    references:
      - https://cwe.mitre.org/data/definitions/312.html
      - https://owasp.org/www-project-web-security-testing-guide/stable/4-Web_Application_Security_Testing/01-Information_Gathering/05-Review_Webpage_Content_for_Information_Leakage
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/password
      - https://github.com/praetorian-inc/titus/blob/f7cbd26ffeef11c405893653f1d81e0bd5e708b6/pkg/rule/rules/html.yml

  - name: HTML Password Input Pre-populated Credential (Value Before Type)
    id: kingfisher.html.2
    pattern: |
      (?xi)
      <input\b
      [^>]*?\svalue\s*=\s*['"]([^'"]{4,200}?)['"][^>]*?\btype\s*=\s*['"]?password['"]?
      [^>]*?\/?>
    pattern_requirements:
      ignore_if_contains:
        - "****"
        - "***"
        - "••••"
        - "{{"
        - "${"
        - "<%"
        - "<?"
        - "{%"
        - "placeholder"
        - "changeme"
        - "example"
        - "test"
        - "demo"
        - "sample"
        - "your_password"
    min_entropy: 3.0
    confidence: low
    examples:
      - '<input class="form-control" value="jasper_secret_XYZ!" type="password" name="jasper_password" />'
    references:
      - https://cwe.mitre.org/data/definitions/312.html
      - https://owasp.org/www-project-web-security-testing-guide/stable/4-Web_Application_Security_Testing/01-Information_Gathering/05-Review_Webpage_Content_for_Information_Leakage
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/password
      - https://github.com/praetorian-inc/titus/blob/f7cbd26ffeef11c405893653f1d81e0bd5e708b6/pkg/rule/rules/html.yml
