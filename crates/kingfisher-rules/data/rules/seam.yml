rules:
  - name: Seam API Key
    id: kingfisher.seam.1
    pattern: |
      (?x)
      \b
      (
        seam_(?:test2|live)[a-zA-Z0-9]{1,8}_[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{20,32}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "SEAM_API_KEY=seam_test2bMS_94SrGUXuNR2JmJkjtvBQDg5c"
      - 'SEAM_API_KEY="seam_liveK3_7Zum8CdnFeJi2CysRnTBh3"'
    references:
      - https://docs.seam.co/latest/core-concepts/authentication/api-keys
      - https://github.com/seamapi/python/blob/d41bc9e7a8a07780160eab83a6467c1f66480744/README.rst
      - https://github.com/seamapi/javascript-http/blob/9540ba773d1a2e1616f6d1a2dcf60cbf2fe17777/src/lib/seam/connect/token.ts
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://connect.getseam.com/workspaces/get
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
