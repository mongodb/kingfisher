rules:
  - name: Mappedin API Key
    id: kingfisher.mappedin.1
    pattern: |
      (?x)
      \b
      (
        mik_[a-zA-Z0-9]{25}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "MAPPEDIN_KEY=mik_yeBk0Vf0nNJtpesfu560e07e6"
    references:
      - https://developer.mappedin.com/docs/mvf/v2/getting-started
      - https://developer.mappedin.com/docs/mvf/v3/getting-started
      - https://github.com/MappedIn/qgis-plugin/blob/a9be3f64a02cf42a1f758bcbbc2a972e03a55583/README.md

  - name: Mappedin API Secret
    id: kingfisher.mappedin.2
    pattern: |
      (?x)
      \b
      (
        mis_[a-zA-Z0-9]{51}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - "MAPPEDIN_SECRET=mis_4sDELo8xqkrXxLMPEUXzDQsf71J3bvI1UhbUVcWm3WW8dfa102f"
    references:
      - https://developer.mappedin.com/docs/mvf/v2/getting-started
      - https://developer.mappedin.com/docs/mvf/v3/getting-started
      - https://github.com/MappedIn/qgis-plugin/blob/a9be3f64a02cf42a1f758bcbbc2a972e03a55583/README.md
