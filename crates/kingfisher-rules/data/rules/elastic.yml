rules:
  - name: Elastic Cloud API Key
    id: kingfisher.elastic.1
    pattern: |
      (?x)
      \b
      (?:
        (?i:elastic(?:[_\s-]*(?:search|cloud))?)
        (?:.|[\n\r]){0,24}?
        (?i:api[_\s-]*key|apikey)
        |
        (?i:EC_API_KEY)
      )
      (?:.|[\n\r]){0,16}?
      (
        [A-Za-z0-9+/=]{40,120}
      )
    pattern_requirements:
      min_digits: 2
      min_uppercase: 2
      min_lowercase: 2
    min_entropy: 3.5
    confidence: medium
    categories: [api, key]
    examples:
      - "ELASTIC_CLOUD_API_KEY=VnVhQ2ZHY0JDZGJrUW0tZTVhT3g6dWkybHAyYXhUTm1zeWFrdzl0dk5udw=="
    references:
      - https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/elastic.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/elastic/elastic-cloud-api-key.yaml
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.elastic-cloud.com/api/v1/user
          headers:
            Authorization: "ApiKey {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"user_id"'

  - name: Elasticsearch API Key with Prefix
    id: kingfisher.elastic.2
    pattern: |
      (?x)
      \b
      (?i:Authorization:\s*ApiKey\s+)
      (
        [A-Za-z0-9+/=]{40,120}
      )
    pattern_requirements:
      min_digits: 2
      min_uppercase: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "Authorization: ApiKey VnVhQ2ZHY0JDZGJrUW0tZTVhT3g6dWkybHAyYXhUTm1zeWFrdzl0dk5udw=="
    references:
      - https://www.elastic.co/guide/en/elasticsearch/reference/current/security-api-create-api-key.html
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/elastic.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.elastic-cloud.com/api/v1/user
          headers:
            Authorization: "ApiKey {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"user_id"'
