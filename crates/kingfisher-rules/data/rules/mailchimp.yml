rules:
  - name: Mailchimp API Key
    id: kingfisher.mailchimp.1
    pattern: |
      (?xi)
      \b
      mailchimp
      (?:.|[\n\r]){0,128}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        (?:[[:xdigit:]]{8}){4}
        -us\d{1,2}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - "mailchimp_token = abcdef1234567890abcdef1234567890-us1"
      - 'mailchimp_key = "0123456789abcdeffedcba9876543210-us20"'
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: 'Basic {{ "x:" | append: TOKEN | b64enc }}'
            Accept: application/json
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: 'https://{{ TOKEN | split: "-" | last }}.api.mailchimp.com/3.0/ping'
    references:
      - https://mailchimp.com/developer/marketing/api/root/
      - https://mailchimp.com/developer/guides/marketing-api-conventions/
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/mailchimp.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/mailchimp.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/mailchimp/mailchimp-api-key.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/mailchimp-api.yaml
