rules:
  - name: RubyGems API Key
    id: kingfisher.rubygems.1
    pattern: |
      (?x)
      \b                     
      (                      
        rubygems_
        [[:digit:]a-f]{48}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    categories: [api, secret]
    references:
      - https://guides.rubygems.org/rubygems-org-api/
      - https://guides.rubygems.org/api-key-scopes/
      - https://github.com/praetorian-inc/noseyparker/blob/ca4ef4d2a4771f69e64daf7fbb4f8fafdd18f19d/crates/noseyparker/data/default/builtin/rules/rubygems.yml
      - https://github.com/gitleaks/gitleaks/blob/c11adc91ad701db3e2c8df030f747086ebca8847/cmd/generate/config/rules/rubygems.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/rubygemsapikey/detector.go
    examples:
      - |
        $ curl -H 'Authorization:rubygems_b9ce70c306b3a2e248679fbbbd66723d408d3c8c5f00566c' \
               https://rubygems.org/api/v1/web_hooks.json
      - "apikey: rubygems_123abc01a15f32b0be0103de4c9b3dcb3f2fea0fa8a84f23"
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: "{{ TOKEN }}"
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://rubygems.org/api/v1/web_hooks.json
