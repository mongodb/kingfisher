rules:
  - name: Cisco Enable Password
    id: kingfisher.cisco.1
    pattern: |
      (?xim)
      ^\s*enable\s+(?:password|secret)\s+
      (?:level\s+\d+\s+)?(?:\d\s+)?
      (\S{4,128})
    pattern_requirements:
      ignore_if_contains:
        [
          "<YOUR_",
          "PLACEHOLDER",
          "CHANGEME",
          "EXAMPLE",
          "${ENABLE",
          "YOUR_PASSWORD",
        ]
    confidence: medium
    examples:
      - "enable password MyS3cretP@ss"
      - "enable secret 5 $1$abc$hashvaluehere"
    references:
      - https://www.cisco.com/c/en/us/td/docs/ios/security/command/reference/sec_book/sec_e1.html
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/cisco.yml

  - name: SNMP Read-Write Community String
    id: kingfisher.cisco.2
    pattern: |
      (?xim)
      ^\s*snmp-server\s+community\s+(\S{2,64})\s+RW\b
    pattern_requirements:
      ignore_if_contains:
        ["<COMMUNITY>", "<string>", "PLACEHOLDER", "CHANGEME", "EXAMPLE"]
    confidence: medium
    examples:
      - "snmp-server community pr1vate RW"
      - "snmp-server community S3cretCommunity RW 99"
    references:
      - https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/xe-16/snmp-xe-16-book.html
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/cisco.yml

  - name: Cisco PAC Key
    id: kingfisher.cisco.3
    pattern: |
      (?xim)
      ^\s*pac\s+key\s+([0-7]\s+\S{4,128})
    confidence: medium
    examples:
      - "pac key 0 MyPacKeyS3cret"
      - "pac key 7 045802150C2E"
    references:
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/cisco.yml

  - name: Network Config NVRAM Indicator
    id: kingfisher.cisco.4
    pattern: |
      (?xi)(NVRAM\s+config\s+last\s+updated)
    visible: false
    confidence: medium
    examples:
      - "! NVRAM config last updated at 14:32:10 UTC Mon Jan 15 2024"
    references:
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/cisco.yml
