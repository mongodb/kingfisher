rules:
  - name: PdfLayer API Key
    id: kingfisher.pdflayer.1
    pattern: |
      (?x)
      (?:
        \b
        (?i:pdflayer)
        (?:.|[\n\r]){0,32}?
        (?i:SECRET|PRIVATE|ACCESS|KEY|TOKEN|ACCESS_KEY)
        (?:.|[\n\r]){0,32}?
        |
        \bapi\.pdflayer\.com/api/convert\?[^ \t\r\n"'<>]*\baccess_key\s*=\s*
      )
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - pdflayer_access_key = "4bf47a29c5ba2f5866a849450047ff5e"
      - pdflayer_access_key = "92e7159248f0a78ab4c9e2d7301ec7c9"
      - pdflayer_access_key = "aa8062bf5195c96f87852007c8c553fa"
      - pdflayer_access_key = "da88aa3e39e9f95ff65726b2c11f520f"
      - pdflayer_access_key = "ca9393336ca92d13ceb707188ae854b5"
    references:
      - https://pdflayer.com/documentation
    validation:
      type: Http
      content:
        request:
          method: GET
          # Use Sandbox Mode (test=1) and intentionally omit document_url/document_html.
          # This yields the authenticated `missing_document_source` JSON error instead of
          # generating a PDF, and should not count toward monthly API volume per docs.
          url: "https://api.pdflayer.com/api/convert?access_key={{ TOKEN }}&test=1"
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [400]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"code":313', '"type":"missing_document_source"']
