rules:
  - name: Weights and Biases API Key
    id: kingfisher.wandb.1
    pattern: |
      (?xi)
      (?:wandb|weightsandbiases)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{40}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.5
    examples:
      - "export WANDB_API_KEY=872ab943740b34157041da2529fb160d89632710"
      - "wandb_api_key: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      - "WeightsandBiases token => 7f9d2e34c1a0b5d6e7f81234abcd5678ef901234"
    validation:
      type: Http
      content:
        request:
          method: POST
          url: "https://api.wandb.ai/graphql"
          headers:
            Authorization: "Basic {{ 'api:' | append: TOKEN | b64enc }}"
            Content-Type: "application/json"
          body: |
            {"query":"query { viewer { email username } }"}
          response_matcher:
            - report_response: true
            - type: JsonValid
            - type: WordMatch
              words:
                - '"username"'
    references:
      - https://docs.wandb.ai/ref/cli/wandb-login
      - https://docs.wandb.ai/support/rotate_revoke_access
      - https://docs.wandb.ai/support/models/articles/how-can-i-rotate-or-revoke-access
      - https://github.com/wandb/wandb/blob/5f0c9d652f49826d27dfef14936a3c490c65be10/wandb/sdk/lib/wbauth/auth.py#L92-L101
      - https://github.com/wandb/weave/blob/984197453df024bdcc0273f084287b24cfae2228/sdks/node/src/wandb/wandbServerApi.ts#L20-L36
      - https://github.com/betterleaks/betterleaks/blob/e2ae8d541f505d0de045db55b5bc198b0418810e/cmd/generate/config/rules/weightsandbiases.go
      - https://datatracker.ietf.org/doc/html/rfc7617

  - name: Weights and Biases API Key (v1)
    id: kingfisher.wandb.2
    pattern: |
      (?x)
      \b
      (
        wandb_v1_[A-Za-z0-9_]{77}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.5
    examples:
      - "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"
      - "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"
    validation:
      type: Http
      content:
        request:
          method: POST
          url: "https://api.wandb.ai/graphql"
          headers:
            Authorization: "Basic {{ 'api:' | append: TOKEN | b64enc }}"
            Content-Type: "application/json"
          body: |
            {"query":"query { viewer { email username } }"}
          response_matcher:
            - report_response: true
            - type: JsonValid
            - type: WordMatch
              words:
                - '"username"'
    references:
      - https://docs.wandb.ai/ref/cli/wandb-login
      - https://docs.wandb.ai/support/rotate_revoke_access
      - https://docs.wandb.ai/support/models/articles/how-can-i-rotate-or-revoke-access
      - https://github.com/wandb/wandb/blob/5f0c9d652f49826d27dfef14936a3c490c65be10/wandb/sdk/lib/wbauth/auth.py#L92-L101
      - https://github.com/wandb/weave/blob/984197453df024bdcc0273f084287b24cfae2228/sdks/node/src/wandb/wandbServerApi.ts#L20
      - https://datatracker.ietf.org/doc/html/rfc7617
