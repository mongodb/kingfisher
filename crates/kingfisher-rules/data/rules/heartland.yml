rules:
  - name: Heartland Portico API Key
    id: kingfisher.heartland.1
    pattern: |
      (?x)
      \b
      (
        skapi_cert_
        [A-Za-z0-9]{34,42}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    examples:
      - 'config.secretApiKey = "skapi_cert_AeUdFKCJ8mBl5ThCDPCFdEgDJi8k9AaKO7c"'
      - "HEARTLAND_API_KEY=skapi_cert_ZfVeXwDUBbMlJnQIEsJGLbMkrQOiPtNh8e2"
    references:
      - https://developer.heartlandpaymentsystems.com/
      - https://github.com/globalpayments/node-sdk/blob/9f1da1f423865d1339b6723b661cda082cf1ca81/test/Unit/Builders/AuthorizationBuilder/Validation.test.ts
      - https://github.com/hps/heartland-ios/blob/4d5469c6db39ce148a57cf9195976f01ae0bc0df/Heartland-iOS-SDK/Classes/Services/HpsGatewayService.m
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://cert.api2-c.heartlandportico.com/Hps.Exchange.PosGateway/PosGatewayService.asmx
          headers:
            Authorization: "ApiKey {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 400]
            - type: StatusMatch
              status: [401, 403]
              negative: true
