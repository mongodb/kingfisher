rules:
  - name: Kimi (Moonshot AI) API Key
    id: kingfisher.kimi.1
    pattern: |
      (?x)
      \b
      (?i:kimi|moonshot)
      (?:.|[\n\r]){0,32}?
      (?i:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        sk-
        [A-Za-z0-9_-]{48}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - kimi_api_key = "sk-uBf3S6jw9Akw0X6u9KDygGb5rDn1LdZ7G3mVtvHhQb7x0sMn"
      - moonshot_api_key = "sk-aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789aBcDeFgHiJkL"
    references:
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/kimi.go#L9
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.moonshot.ai/v1/models
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: "application/json"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
