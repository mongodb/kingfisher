rules:
  - name: Diffbot API Key
    id: kingfisher.diffbot.1
    pattern: |
      (?xi)                       
      \b                         
      diffbot
      (?:.|[\n\r]){0,32}?
      \b                         
      (
        [[:alnum:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    examples:
      - diffbot_key = a7424adbafc4624e61482d0f60e43016
    references:
      - https://docs.diffbot.com/reference/account
      - https://github.com/diffbot/docs/blob/0f26e058ea2e30ac221336527aef701cfdcca703/docs/api-account.md?plain=1#L7-L37
      - https://github.com/diffbot/diffbot-python/blob/b64f6a16ac85e5db3783a9ea582b24f9e1874e54/src/diffbot/_auth.py#L1-L41
    validation:
      type: Http
      content:
        request:
          method: GET
          url: >-
            https://api.diffbot.com/v4/account?token={{ TOKEN }}
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ['"usage"']
