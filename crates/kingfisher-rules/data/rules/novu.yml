rules:
  - name: Novu Secret Key
    id: kingfisher.novu.1
    pattern: |
      (?x)
      \b
      (?:
        NOVU_SECRET_KEY
        |
        novu[\s_-]*secret[\s_-]*key
      )
      \s*[=:]\s*["']?
      (
        [0-9a-f]{32}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      # Synthetic, format-valid examples; these are not issued credentials.
      - 'NOVU_SECRET_KEY="4f7ca2b9d3e8f1a6c5b0d7e2f9a4c8b1"'
      - 'novu secret_key: 9e2d7c4b1a8f5e3d0c6b9a2f7e4d1c8b'
    references:
      - https://docs.novu.co/platform/developer/api-keys
      - https://docs.novu.co/api-reference/subscribers/search-subscribers
      - https://github.com/novuhq/novu/blob/99ef8c4164a2fcd918e83a7b65ce721af3b51d2b/apps/api/src/app/environments-v1/usecases/generate-unique-api-key/generate-unique-api-key.usecase.ts#L36-L41
      - https://github.com/novuhq/novu/blob/99ef8c4164a2fcd918e83a7b65ce721af3b51d2b/packages/agent-toolkit/README.md
      - https://github.com/novuhq/novu/blob/99ef8c4164a2fcd918e83a7b65ce721af3b51d2b/packages/novu/README.MD
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.novu.co/v2/subscribers?limit=1
          headers:
            Authorization: "ApiKey {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
    # Novu documents per-key deletion and rotation in its dashboard, not a public key-revocation API.
