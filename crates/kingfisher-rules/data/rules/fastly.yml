rules:
  - name: Fastly API token
    id: kingfisher.fastly.1
    pattern: |
      (?xi)
      \b
      fastly
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [a-z0-9_-]{32}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - "Fastly token: fgsb3ef237afd6c1b9d91f81cdba64f3"
    references:
      - https://developer.fastly.com/reference/api/#authentication
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/fastly.go
    validation:
      type: Http
      content:
        request:
          headers:
            Fastly-Key: "{{ TOKEN }}"
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.fastly.com/current_user
