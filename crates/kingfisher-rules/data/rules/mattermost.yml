rules:
  - name: Mattermost URL
    id: kingfisher.mattermost.1
    pattern: |
      (?xi)
      \b
      mattermost
      (?:.|[\n\r]){0,32}?
      (
        https?:\/\/[a-z0-9.-]+
        (?::\d{2,5})?
        (?:\/[A-Za-z0-9._~\-\/]*)?
      )
      \b
    confidence: medium
    visible: false
    min_entropy: 2.0
    examples:
      - mattermost_url = "https://community.mattermost.com"
      - mattermost_url='http://localhost:8065'
      - "mattermost_url: https://intra.example.com/mattermost"
    references:
      - https://developers.mattermost.com/api-documentation/

  - name: Mattermost Access Token
    id: kingfisher.mattermost.2
    pattern: |
      (?xi)
      \b
      mattermost
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:alnum:]]{26}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 4.0
    examples:
      - "mattermost_token: abcde12345fghij67890klmno1"
    validation:
      type: Http
      content:
        request:
          method: GET
          # Normalize any captured base that already includes /api/v4
          url: >
            {%- assign base = MATTERMOST_URL | replace: "/api/v4/", "/" | replace: "/api/v4", "" -%}
            {{ base }}/api/v4/users/me
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ['"id"', '"username"']
              match_all_words: true
    depends_on_rule:
      - rule_id: "kingfisher.mattermost.1"
        variable: MATTERMOST_URL
    references:
      - https://developers.mattermost.com/api-documentation/
      - https://developers.mattermost.com/integrate/faq/
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/mattermost.go

  - name: Mattermost Incoming Webhook URL
    id: kingfisher.mattermost.3
    pattern: |
      (?xi)(https?://[a-z0-9.-]*(?:mattermost|mm)[a-z0-9.-]*(?::\d{2,5})?/hooks/[a-z0-9]{26})\b
    min_entropy: 3.0
    confidence: medium
    examples:
      - 'WEBHOOK_URL=https://mattermost.example.com/hooks/9xuqwrwgstrb3mzrxb83nb357a'
    validation:
      type: Http
      content:
        request:
          method: POST
          url: "{{ TOKEN }}"
          headers:
            Content-Type: application/json
          # A malformed JSON document makes Mattermost reject the request before it can post.
          body: '{"text":'
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [400]
    references:
      - https://developers.mattermost.com/integrate/webhooks/incoming/
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/mattermost.yml

  - name: Mattermost Personal Access Token
    id: kingfisher.mattermost.4
    pattern: |
      (?xi)(?:mattermost|mm).?(?:access|api|auth|bot|personal|private|secret)?.?(?:key|pat|secret|token).{0,2}\s{0,20}.{0,2}\s{0,20}.{0,2}\b([a-km-uw-z13-9]{26})\b
    confidence: medium
    min_entropy: 3.5
    examples:
      - 'MM_TOKEN=9xuqwrwgstrb3mzrxb83nb357a'
      - 'mattermost_access_token: zmigewsanbbsdf59xnmduzypjc'
    depends_on_rule:
      - rule_id: "kingfisher.mattermost.1"
        variable: MATTERMOST_URL
    validation:
      type: Http
      content:
        request:
          method: GET
          # Normalize any captured base that already includes /api/v4.
          url: >
            {%- assign base = MATTERMOST_URL | replace: "/api/v4/", "/" | replace: "/api/v4", "" -%}
            {{ base }}/api/v4/users/me
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ['"id"', '"username"']
              match_all_words: true
    references:
      - https://developers.mattermost.com/integrate/reference/personal-access-token/
      - https://developers.mattermost.com/api-documentation/
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/mattermost.yml
