rules:
  - name: Linear API Key
    id: kingfisher.linear.1
    pattern: |
      (?xi)                   
      \b                     
      (                      
        lin_api_
        (?:[[:alnum:]]{8}){5}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - linear_api_key = lin_api_2thngjik222gkiihzivh242LU7zvkdvdgB14B41S
      - lin_api_token:"lin_api_9A6bCDeF0Gh1Ij2Klm3No4PQr5St6Uv7Wx8YZaBc"
    references:
      - https://linear.app/developers/graphql
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/linear.go
    validation:
      type: Http
      content:
        request:
          method: POST
          headers:
            Authorization: "{{ TOKEN }}"
            Content-Type: application/json
          body: >
            {
              "query": "query { issues(first: 1) { nodes { id } } }"
            }
          url: https://api.linear.app/graphql
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ['"issues":', '"nodes":']

  - name: Linear Client Secret
    id: kingfisher.linear.2
    pattern: |
      (?xi)
      \b
      linear
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|CLIENT)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - linear_client_secret = "a1b2c3d4e5f67890a1b2c3d4e5f67890"
    references:
      - https://developers.linear.app/docs/oauth-authentication
      - https://developers.linear.app/docs/getting-started#personal-api-keys
      - https://github.com/pocketbase/pocketbase/blob/de3c3f715bcab86d87ce51af96fdc05570afb25e/tools/auth/linear.go
      - https://github.com/linear/linear/blob/202a5e0fbce142cd1f0cd5c5265c3a310f629702/packages/sdk/src/client.ts
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/linear.go#L36
    # No validation: Linear OAuth uses authorization_code grant only (no
    # client_credentials). The client secret is paired with a client_id and
    # an authorization code to obtain an access token. Without an auth code,
    # the secret cannot be validated. See pocketbase's implementation:
    # https://github.com/pocketbase/pocketbase/blob/de3c3f715bcab86d87ce51af96fdc05570afb25e/tools/auth/linear.go
