rules:
  - name: New Relic Personal API Key
    id: kingfisher.newrelic.1
    pattern: |
      (?xi)
      \b
      newrelic
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Z0-9_.]{4}
        -
        [A-Z0-9_.]{42}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - newrelic_key = abcd-1234567890abcdef1234567890abcdef1234dd5678
      - newrelic_token = 1234-abcdefghijklmnopqrstuvwxyzABCD2342EFGHIJKL
    validation:
      type: Http
      content:
        request:
          method: GET
          headers:
            X-Api-Key: '{{ TOKEN }}'
          url: https://api.newrelic.com/v2/servers.json   
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    references:
      - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/

  - name: New Relic User API ID
    id: kingfisher.newrelic.2
    pattern: |
      (?xi)
      \b
      (?:new-relic|newrelic|new_relic)
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|ID|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [a-z0-9]{64}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - newrelic_api_id = "a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890"
    references:
      - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/newrelic.go#L30
    # No validation: the User API ID is a 64-char alphanumeric identifier, not a
    # secret key. It is used as a secondary credential alongside a User API Key
    # (NRAK-) and cannot be validated independently.

  - name: New Relic Browser API Token
    id: kingfisher.newrelic.3
    pattern: |
      (?xi)
      \b
      (
        NRJS-
        [a-f0-9]{19}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - newrelic_browser_token = "NRJS-a1b2c3d4e5f67890a1b"
    references:
      - https://docs.newrelic.com/docs/browser/browser-monitoring/installation/new-relic-browser-installation/
      - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/#browser-key
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/newrelic.go#L53
    # No validation: the Browser API Token (NRJS-) is a browser-agent key
    # embedded in client-side JavaScript. It reports data to New Relic's browser
    # ingestion endpoints but has no server-side API for key verification.

  - name: New Relic Insert Key
    id: kingfisher.newrelic.4
    pattern: |
      (?xi)
      \b
      (
        NRII-
        [a-z0-9-]{32}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - newrelic_insert_key = "NRII-a1b2c3d4e5f67890a1b2c3d4e5f67890"
    references:
      - https://docs.newrelic.com/docs/data-apis/ingest-apis/event-api/introduction-event-api/
      - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/#insights-insert-key
      - https://github.com/vectordotdev/vector/blob/ff3719d2f23e76a94d5781fd0a844830bf38bb09/src/sinks/new_relic/config.rs
      - https://github.com/concourse/concourse/blob/c127ddaee07de4d2448abd3bc678a88dde299dfe/atc/metric/emitter/newrelic.go
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/newrelic.go#L74
    # No validation: the Insert Key (NRII-) is used with the Event API at
    # https://insights-collector.newrelic.com/v1/accounts/{account_id}/events
    # which requires an account_id in the URL (not derivable from the key) and
    # only accepts POST requests that inject events into the user's account.
    # A depends_on rule for the account_id would enable validation but would
    # be destructive (injects a test event). See:
    # https://github.com/vectordotdev/vector/blob/ff3719d2f23e76a94d5781fd0a844830bf38bb09/src/sinks/new_relic/config.rs
