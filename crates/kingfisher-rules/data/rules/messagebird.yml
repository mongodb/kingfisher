rules:
  - name: MessageBird API Token
    id: kingfisher.messagebird.1
    pattern: |
      (?xi)
      \b
      message[_-]?bird
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:alnum:]]{25}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.4
    confidence: medium
    examples:
      - "MESSAGEBIRD_API_KEY=abcdefghijklmno12rstuvwxy"
      - "messagebird_token: 'abcde12345fghij67890klmno'"
    references:
      - https://developers.messagebird.com/api/#authentication
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/messagebird.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://rest.messagebird.com/balance
          headers:
            Authorization: "AccessKey {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: MessageBird Client ID
    id: kingfisher.messagebird.2
    pattern: |
      (?xi)
      \b
      message[_-]?bird
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|CLIENT|ID|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:xdigit:]]{8}-
        [[:xdigit:]]{4}-
        [[:xdigit:]]{4}-
        [[:xdigit:]]{4}-
        [[:xdigit:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 6
    min_entropy: 3.5
    confidence: medium
    examples:
      - 'const MessageBirdClientID = "12345678-abcd-1234-abcd-1234567890ab"'
      - 'MessageBirdClientID = "12345678-ABCD-ABCD-ABCD-1234567890AB"'
    references:
      - https://developers.messagebird.com/api/#authentication
      - https://developers.messagebird.com/api/#oauth
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/messagebird.go#L30
    # No validation: the client ID is a UUID-format identifier used in
    # MessageBird's OAuth 2.0 flow, paired with a client secret and
    # authorization code. It is not a secret and cannot be validated
    # independently. See: https://developers.messagebird.com/api/#oauth
