rules:
  - name: Scalingo API Token
    id: kingfisher.scalingo.1
    pattern: |
      (?xi)
      \b
      (
        tk-us-[\w-]{48}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - SCALINGO_TOKEN=tk-us-abcdefabcde12bcdefabcdefabcdefabcdefabcdefabcdef
      - '"scalingo": "tk-us-1234567890abcdef1234567890abcdef1234567890abcdef"'
    references:
      - https://developers.scalingo.com/index#authentication
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/scalingo.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.scalingo.com/v1/users/self
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status:
                - 200
