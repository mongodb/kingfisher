rules:
  - name: Supabase Management Token
    id: kingfisher.supabase.1
    pattern: |
      (?x)
      (
        sbp_[[:digit:]a-f]{40}
      )
    min_entropy: 3.5
    confidence: medium
    examples:
      - sbp_08414cedf15b7d3a53ce954db0b2ec90f4248ba0
    references:
      - https://supabase.com/docs/reference/api/v1-get-an-organization
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/supabase.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/supabase/detector.go
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          method: GET
          url: https://api.supabase.com/v1/organizations
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status:
                - 200
  - name: Supabase Project API Key
    id: kingfisher.supabase.2
    pattern: |
      (?xi)
      (
        sb_secret_[[:alnum:]_-]{31,36}
      )
    pattern_requirements:
      min_uppercase: 3
      min_lowercase: 3
    min_entropy: 4.0
    confidence: medium
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "{{SBPROJECTURL}}/rest/v1/?select=*"
          headers:
            Apikey: "{{TOKEN}}"
            User-Agent: ""
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"host":'
    references:
      - https://supabase.com/docs/reference/api/v1-get-an-organization
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/supabase/detector.go
    examples:
      - "sb_secret_9uM4GhB0STF5R4K3HxQtlg_bzWW6DRj"
      - "sb_secret_szE_jsbktD3pWgnfUjgahw_hcHEIOBH"
    depends_on_rule:
      - rule_id: "kingfisher.supabase.3"
        variable: SBPROJECTURL
  - name: Supabase Project URL
    id: kingfisher.supabase.3
    pattern: (?xi)
      \b
      (
      https:\/\/[a-z0-9]{16,32}\.supabase\.co
      )
      \b
    confidence: medium
    min_entropy: 3.0
    visible: false
    references:
      - https://supabase.com/docs/guides/api
    examples:
      - "https://ejcvydfyxzmbtfbfstnq.supabase.co"

  - name: Supabase Publishable Key
    id: kingfisher.supabase.4
    pattern: |
      (?x)
      \b
      (
        sb_publishable_[a-zA-Z0-9_-]{24,40}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_a1B2c3D4e5F6g7H8i9J0k1L2"
    references:
      - https://supabase.com/docs/guides/api
