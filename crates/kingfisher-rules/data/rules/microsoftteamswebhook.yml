rules:
  - name: Microsoft Teams Webhook
    id: kingfisher.microsoftteamswebhook.1
    pattern: |
      (?xi)
      \b
      (
        https://[[:alnum:]]+\.webhook\.office\.com/webhookb2
        /
        [[:alnum:]]{8}-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{12}
        @
        [[:alnum:]]{8}-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{12}
        /
        IncomingWebhook
        /
        [[:alnum:]]{32}
        /
        [[:alnum:]]{8}-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 8
    min_entropy: 3.3
    confidence: medium
    examples:
      - "https://contoso.webhook.office.com/webhookb2/12345678-abcd-1234-efgh-56789abcdef0@12345678-abcd-1234-efgh-56789abcdef0/IncomingWebhook/abcdefgh12345678abcdefgh12345678/12345678-abcd-1234-efgh-56789abcdef0"
    validation:
      type: Http
      content:
        request:
          body: '{"text":""}'
          headers:
            Content-Type: application/json
          method: POST
          response_matcher:
            - type: StatusMatch
              status:
                - 400
            - report_response: true
              type: WordMatch
              words:
                - "Text is required"
          url: "{{ TOKEN }}"
    references:
      - https://learn.microsoft.com/en-us/microsoftteams/platform/webhooks-and-connectors/how-to/add-incoming-webhook
      - https://github.com/pnp/cli-microsoft365/blob/c38a059b0733d931c824740f97d46ad6fde91cb6/docs/docs/cmd/adaptivecard/adaptivecard-send.mdx
      - https://github.com/prometheus-msteams/prometheus-msteams/blob/3414c33170615407615a247a0fa373cc65a9df4b/README.md
