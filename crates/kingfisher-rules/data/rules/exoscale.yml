rules:
  - name: Exoscale API Key
    id: kingfisher.exoscale.1
    pattern: |
      (?x)
      \b
      (
        EXO
        [a-zA-Z0-9]{24,30}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
    min_entropy: 3.0
    confidence: medium
    examples:
      - exoscale_api_key = "EXOabcdef1234567890abcdefghij"
    references:
      - https://community.exoscale.com/documentation/api/
      - https://community.exoscale.com/documentation/api/auth/
      - https://github.com/exoscale/egoscale/blob/1eaf385e1112565a62e1c3942cb977979e521249/client.go
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/exoscale.go#L9
      # No validation: Exoscale API requests use HMAC-SHA256 request signing with
      # the API key and secret. The signing process (described in the Exoscale
      # API auth docs) cannot be expressed as a simple HTTP validation in YAML.
      # See the egoscale client for the signing implementation:
      # https://github.com/exoscale/egoscale/blob/1eaf385e1112565a62e1c3942cb977979e521249/client.go
      - https://community.exoscale.com/product/iam/how-to/key-mgmt/
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/exoscale.go
    depends_on_rule:
      - rule_id: kingfisher.exoscale.2
        variable: SECRET

  - name: Exoscale API Secret
    id: kingfisher.exoscale.2
    pattern: |
      (?xi)
      \b
      exoscale
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|KEY)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Za-z0-9_\-]{40,60}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 4.0
    confidence: medium
    visible: false
    examples:
      - exoscale_api_secret = "AbCdEf1234567890GhIjKlMnOpQrStUvWxYz0123456789"
    references:
      - https://community.exoscale.com/documentation/api/
      - https://community.exoscale.com/documentation/api/auth/
      - https://github.com/exoscale/egoscale/blob/1eaf385e1112565a62e1c3942cb977979e521249/client.go
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/exoscale.go#L47
      - https://openapi-v2.exoscale.com/
      - https://community.exoscale.com/product/iam/how-to/key-mgmt/
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/exoscale.go
