rules:
  - name: VolcEngine Access Key ID
    id: kingfisher.volcengine.1
    pattern: |
      (?x)
      \b
      (?i:volcengine)
      (?:.|[\n\r]){0,32}?
      \b
      (
        AKLT[a-zA-Z0-9_-]{46,48}
      )
      \b
    pattern_requirements:
      min_digits: 4
    min_entropy: 3.0
    confidence: medium
    examples:
      - "VOLCENGINE_ACCESS_KEY=AKLTY2IwOGJIMTdiZmI5NGU1MWFiNWE3MWJkNWY2MDdmOGUxYz"
    references:
      - https://www.volcengine.com/docs/6291/65568

  - name: VolcEngine Ark API Key
    id: kingfisher.volcengine.2
    pattern: |
      (?x)
      \b
      (?i:
        ARK[\s_-]*API[\s_-]*KEY
        | VOLCENGINE(?:[\s_-]*ARK)?[\s_-]*API[\s_-]*KEY
        | volcano[\s_-]*ark(?:.|[\n\r]){0,24}?API[\s_-]*KEY
        | volcengine(?:.|[\n\r]){0,24}?API[\s_-]*KEY
        | doubao(?:.|[\n\r]){0,24}?API[\s_-]*KEY
      )
      (?:.|[\n\r]){0,32}?
      \b
      (
        [0-9a-f]{8}
        -
        [0-9a-f]{4}
        -
        [0-9a-f]{4}
        -
        [0-9a-f]{4}
        -
        [0-9a-f]{12}
      )
      \b
    pattern_requirements:
      min_digits: 8
    min_entropy: 3.0
    confidence: medium
    examples:
      - 'ARK_API_KEY="9f5a7c2e-4b10-47d8-9f2a-6b3c1d0e8a42"'
      - "volcengine_ark_api_key: 2a8f6d40-1c3e-4b7a-8d05-9e1f2c3a4b58"
      - 'doubao_api_key = "6e3d4c2b-9a81-4f70-b6c5-1d2e3f4a5b67"'
    references:
      - https://github.com/BenedictKing/ccx/blob/7835222674d5d1ebd475ff996856c8acdd2ba65e/frontend/src/utils/quickInputParser.ts#L72-L100
      - https://www.volcengine.com/docs/82379/1330626
      - https://www.volcengine.com/docs/82379/1885708
      - https://www.volcengine.com/docs/82379/2123215
      - https://github.com/volcengine/volcengine-python-sdk/blob/f7f3820608de75191c805efceb5727ad1baef906/volcenginesdkarkruntime/_constants.py#L15
      - https://github.com/volcengine/volcengine-python-sdk/blob/f7f3820608de75191c805efceb5727ad1baef906/volcenginesdkarkruntime/_client.py#L100-L106
      - https://github.com/volcengine/volcengine-python-sdk/blob/f7f3820608de75191c805efceb5727ad1baef906/volcenginesdkarkruntime/_client.py#L184-L186
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://ark.cn-beijing.volces.com/api/v3/files
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: "application/json"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
    # no safe documented revocation endpoint for Ark API keys.
