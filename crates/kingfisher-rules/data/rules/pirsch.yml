rules:
  - name: Pirsch Analytics Access Key
    id: kingfisher.pirsch.1
    pattern: |
      (?xi)
      pirsch
      (?:.|[\n\r]){0,32}?
      (?:SECRET|ACCESS|KEY|TOKEN|CLIENT)
      (?:.|[\n\r]){0,16}?
      \b
      (
        pa_[A-Za-z0-9]{32,48}
      )
      \b
    pattern_requirements:
      min_digits: 1
    min_entropy: 3.0
    confidence: medium
    examples:
      - "PIRSCH_ACCESS_KEY=pa_xsykowZrx3rr5U4o6t8Uepr5CseGOhzb8lLV3Z8YwhBQ"
      - 'pirsch_client_secret = "pa_xK8m2LpQr5nW0vYz3cJ7aB4dE6fG8hI0"'
    references:
      - https://docs.pirsch.io/api-sdks/api-guide
      - https://docs.pirsch.io/api-sdks/api-guide-v1
      - https://github.com/pirsch-analytics/pirsch-js-sdk/blob/aca0001a8e7a294f0598ebfd1905d18b8bf7a336/src/core.ts
