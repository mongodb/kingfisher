rules:
  - name: MongoDB API Private Key
    id: kingfisher.mongodb.1
    pattern: |
      (?xi)
      (?:
        (?:
          (?:\b|_|-|\.)
          (?:mongodb|atlas)
          (?:\b|_|-|\.)
          .{0,1000}?
          (?:private|priv|secret|auth|pass|key)
        )
        |
        \b(?:private[_-]?api[_-]?key|mongodb[_-]?atlas[_-]?private[_-]?key)\b
      )
      (?:.|[\n\r]){0,32}?
      \b
      (                        
        [[:xdigit:]]{8}
        -
        [[:xdigit:]]{4}
        -
        [[:xdigit:]]{4}
        -
        [[:xdigit:]]{4}
        -
        [[:xdigit:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_lowercase: 1
    min_entropy: 3.7
    examples:
      - ATLAS_PRIVATE_KEY=4b18315e-6b7d-4337-b449-5d38f5a189ec
      - 'private_api_key = "f0e21a1b-1c7d-3659-8564-7c38e75d7ff8"'
      - MONGODB_ATLAS_PRIVATE_KEY=f0e21a1b-1c7d-3659-8564-7c38e75d7ff8
    validation:
      type: Http
      content:
        request:
          headers:
            Accept: application/vnd.atlas.2023-02-01+json
            Content-Type: application/json
          method: GET
          digest: '{{ PUBKEY | append: ":" | append: TOKEN }}'
          response_matcher:
            - report_response: true
            - match_all_words: true
              type: WordMatch
              words:
                - '"orgId":'
                - '"id":'
          url: https://cloud.mongodb.com/api/atlas/v2/groups
    references:
      - https://www.mongodb.com/docs/atlas/api/
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/mongodb.go
      - https://github.com/google/osv-scalibr/pull/1939
      - https://datatracker.ietf.org/doc/html/rfc7616
    depends_on_rule:
      - rule_id: "kingfisher.mongodb.2"
        variable: PUBKEY

    revocation:
      type: HttpMultiStep
      content:
        steps:
          # Step 1: Get the organization ID
          - name: lookup_org_id
            request:
              method: GET
              url: https://cloud.mongodb.com/api/atlas/v2/orgs
              headers:
                Accept: application/vnd.atlas.2023-02-01+json
                Content-Type: application/json
              digest: "{{ PUBKEY | append: ':' | append: TOKEN }}"
              response_matcher:
                - type: StatusMatch
                  status: [200]
                - type: JsonValid
            extract:
              # Extract the first organization ID
              ORG_ID:
                type: JsonPath
                path: "$.results[0].id"

          # Step 2: Delete the API key using the organization ID and public key
          - name: delete_api_key
            request:
              method: DELETE
              url: https://cloud.mongodb.com/api/atlas/v2/orgs/{{ ORG_ID }}/apiKeys/{{ PUBKEY }}
              headers:
                Accept: application/vnd.atlas.2023-02-01+json
              digest: "{{ PUBKEY | append: ':' | append: TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [204]

  - name: MongoDB API PUBLIC Key
    id: kingfisher.mongodb.2
    pattern: |
      (?xi)
      (?:
        (?:
          (?:\b|_|-|\.)
          (?:mongodb|atlas)
          (?:\b|_|-|\.)
          (?:public|pub|user|id)
        )
        |
        \b(?:public[_-]?api[_-]?key|mongodb[_-]?atlas[_-]?public[_-]?key)\b
      )
      (?:.|[\n\r]){0,4}?
      (
        [[:alnum:]]{8,10}
      )
      (?:$|[^A-Z0-9/+=-])
    min_entropy: 2.0
    confidence: medium
    visible: false
    examples:
      - "mongodb-public: qj4Zrh8e6A"
      - 'public_api_key = "O8EWKZwA"'
      - MONGODB_ATLAS_PUBLIC_KEY=O8EWKZwA
    references:
      - https://www.mongodb.com/docs/atlas/api/
      - https://github.com/google/osv-scalibr/pull/1939
  - name: MongoDB URI Connection String
    id: kingfisher.mongodb.3
    # Userinfo follows the connection-string format documented by MongoDB: a
    # username and password drawn from the RFC 3986 userinfo set, with `: / ? #
    # [ ] @` required to be percent-encoded. Bounding both to the documented
    # character set (rather than "any non-whitespace") keeps the rule from
    # swallowing an unencoded `@` and mistaking part of the password for the
    # host.
    pattern: |
      (?xi)
      \b
      (
        mongodb (?: \+srv )? ://
        [[:alnum:]%._~!$&'()*+,;=-]{3,100}   (?# username )
        :
        [[:alnum:]%._~!$&'()*+,;=-]{3,100}   (?# password )
        @
        [[:alnum:]_%.:/-]+                   (?# host[:port] and optional /defaultauthdb )
      )
      \b
    pattern_requirements:
      ignore_if_contains:
        # Common template values rather than credential material.
        - "_username:"
        - "_password@"
        - "_user_token:"
        - "_pass_token@"
        - "_user-token:"
        - "_pass-token@"
        # Unix-domain-socket connection targets remain useful to scan, but are
        # not remotely reachable and are commonly local test fixtures.
        - "%2ftmp%2f"
        - "****"
        - "xxxx"
        - "example"
        - "<password>"
        - "<db_password>"
        - "<username>"
        - "<u>:<p>"
        - "<redacted>"
        - "<DO_NOT_UPDATE_AUTH>"
        - "{username}:{password}"
        - "{password}"
        - "${"
        - "$("
        - "{{"
        - "&lt;"
        - ":pass@"
        - ":password@"
        - ":secret@"
        - ":passw0rd@"
        - ":secretPassw0rd@"
        - ":wrong_password@"
        - ":fakepassword@"
        - "@host:"
        - "@host/"
        - "@host1:"
        - "@some.address"
        - "@connectionString.com"
    min_entropy: 3
    examples:
      - client = mongoc_client_new ("mongodb+srv://someuser:hunter2@my-atlas-rd941.mongodb.net/test?retryWrites=true&w=majority");
      - "mongodb+srv://user:passw0rd@cluster0.something.mongodb.net/"
      - "mongodb://mongoadmin:contoso@something.foo.mongodb.net/myFirstDatabase"
    validation:
      type: MongoDB
    tls_mode: lax
    references:
      - https://www.mongodb.com/docs/manual/reference/connection-string/
      - https://datatracker.ietf.org/doc/html/rfc3986#section-3.2.1
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/mongo.yml
  - name: MongoDB Atlas Service Account Token
    id: kingfisher.mongodb.4
    pattern: |
      (?xi)                    
      \b                      
      (
        mdb_sa_sk_[0-9A-Z_-]{6}[[:alnum:]]{34}
      )
    min_entropy: 3.5
    examples:
      - mdb_sa_sk_BdIX_jLzut2WTgglKzKvSgWMDDj5hEoTqdwOyLOL
    validation:
      type: MongoDB
    tls_mode: lax
    references:
      - https://www.mongodb.com/docs/atlas/api/service-accounts-overview/
