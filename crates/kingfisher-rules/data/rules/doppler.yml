    references:
      - https://docs.doppler.com/reference/api
      - https://docs.doppler.com/reference/auth-token-formats
      - https://docs.doppler.com/reference/auth-me
      - https://docs.doppler.com/reference/auth-revoke
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/doppler/doppler-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/doppler-api-token.yaml
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.doppler.com/v3/projects
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
