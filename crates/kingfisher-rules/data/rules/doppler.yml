rules:
  - name: Doppler CLI Token
    id: kingfisher.doppler.1
    pattern: |
      (?x)
      \b
      (
        dp\.ct\.[A-Za-z0-9]{40,44}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - dp.ct.bAqhcVzrhy5cRHkOlNTc0Ve6w5NUDCpcutm8vGE9myi
    references:
      - https://docs.doppler.com/reference/api
      - https://docs.doppler.com/reference/auth-token-formats
      - https://docs.doppler.com/reference/auth-me
      - https://docs.doppler.com/reference/auth-revoke
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/doppler.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/doppler.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/doppler/doppler-cli-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/doppler/doppler-cli.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/global-matchers/secrets-patterns-rules.yaml
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.doppler.com/v3/projects
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status:
                - 200
    revocation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.doppler.com/v3/auth/revoke
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 204]
  - name: Doppler Personal Token
