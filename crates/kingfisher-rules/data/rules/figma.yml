rules:
  - name: Figma Personal Access Token
    id: kingfisher.figma.1
    pattern: |
      (?x)
      \b
      (
        figd_[A-Za-z0-9_-]{38,42}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - figma pat = figd_rh1234567890123456789012345678901234abcd
      - "figma access token: figd_1234567890123456789012345678901234abcdef"
    references:
      - https://www.figma.com/developers/api#users
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/figma.yml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/figma/figma-personal-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/figma-access-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/global-matchers/secrets-patterns-rules.yaml
    validation:
      type: Http
      content:
        request:
          headers:
            X-Figma-Token: "{{ TOKEN }}"
          method: GET
          url: https://api.figma.com/v1/me
          response_matcher:
            - report_response: true
            - type: WordMatch
              words:
                - "Invalid token"
              negative: true

  - name: Figma Personal Access Header Token
    id: kingfisher.figma.2
    pattern: |
      (?xi)
      figma
      (?:.|[\n\r]){0,32}?
      (
        [[:xdigit:]]{4}
        -[[:xdigit:]]{8}
        (?:-[[:xdigit:]]{4}){3}
        -[[:xdigit:]]{12}
      )
    pattern_requirements:
      min_digits: 2
    examples:
      - "--header='X-Figma-Token: 1394-0ca7a5be-8e22-40ee-8c40-778d41ab2313'"
    references:
      - https://www.figma.com/developers/api#users
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/figma.yml
    validation:
      type: Http
      content:
        request:
          headers:
            X-Figma-Token: "{{ TOKEN }}"
          method: GET
          url: https://api.figma.com/v1/me
          response_matcher:
            - report_response: true
            - type: WordMatch
              words:
                - "Invalid token"
              negative: true
