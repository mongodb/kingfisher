rules:
  - name: Telegram Bot Token
    id: kingfisher.telegram.1
    pattern: |
      (?xi)
      \b
      (?:telegram|tgram:)
      (?:.|[\n\r]){0,32}?
      (
          [0-9]{7,10}
          :
          [A-Z0-9_-]{35}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.5
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.telegram.org/bot{{TOKEN}}/getMe"
          response_matcher:
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"ok":true'
    examples:
      - "tgram://110201543:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsawd"
      - "telegram: 508627689:AAEuLPKs-EhrjrYGnz60bnYNZqakf6HJxc0"
      - "telegram token is 3628091811:BAG9RuJiqgOGIfFbOPBpAo6QhIJoD9mCdDs"
    references:
      - https://core.telegram.org/bots/api#authorizing-your-bot
      - https://github.com/praetorian-inc/noseyparker/blob/ca4ef4d2a4771f69e64daf7fbb4f8fafdd18f19d/crates/noseyparker/data/default/builtin/rules/telegram.yml
      - https://github.com/gitleaks/gitleaks/blob/c11adc91ad701db3e2c8df030f747086ebca8847/cmd/generate/config/rules/telegram.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/telegram/telegram-bot-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/telegram-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/global-matchers/secrets-patterns-rules.yaml
