rules:
  - name: Databricks API Token (Version-Suffixed)
    id: kingfisher.databricks.1
    pattern: |
      (?x)
      \b
      (
        dapi
        [[:digit:]a-f]{32}
        -[[:digit:]]
      )
      (?:[^[:alnum:]-]|$)
    min_entropy: 3.3
    confidence: medium
    examples:
      - "DATABRICKS_TOKEN: 'dapicd295a7be286969133e18a58e4afe7bd-3'"
    negative_examples:
      - "DATABRICKS_TOKEN=dapicd295a7be286969133e18a58e4afe7bd-30"
      - "DATABRICKS_TOKEN=dapiCD295A7BE286969133E18A58E4AFE7BD-3"
    references:
      - https://docs.databricks.com/dev-tools/api/latest/authentication.html
      - https://docs.databricks.com/en/dev-tools/auth/pat.html
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/databricks.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/databricks.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/databricks/databricks-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/databricks-api-token.yaml
      - https://github.com/google/osv-scalibr/blob/55c87fa3e90372b2411b3c6ed111f7d257ced048/veles/secrets/databrickspat/detector.go
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://{{ DOMAIN }}/api/2.0/clusters/list
    depends_on_rule:
      - rule_id: "kingfisher.databricks.3"
        variable: DOMAIN
    # Revocation not added: Databricks PAT docs describe token creation and
    # use, but I did not find a PAT-only self-revoke endpoint suitable for YAML
    # revocation here.

  - name: Databricks API Token (Unsuffixed)
    id: kingfisher.databricks.2
    pattern: |
      (?x)
      \b
      (
        dapi[[:digit:]a-f]{32}
      )
      (?:[^[:alnum:]-]|$)
    min_entropy: 3.3
    confidence: medium
    examples:
      - "dapif21ee53d2b3648c2a1ed38953312a203"
    negative_examples:
      - "DATABRICKS_TOKEN=dapicd295a7be286969133e18a58e4afe7bd-3"
      - "DATABRICKS_TOKEN=dapiCD295A7BE286969133E18A58E4AFE7BD"
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://{{ DOMAIN }}/api/2.0/clusters/list
    depends_on_rule:
      - rule_id: "kingfisher.databricks.3"
        variable: DOMAIN
    references:
      - https://docs.databricks.com/dev-tools/api/latest/authentication.html
      - https://docs.databricks.com/en/dev-tools/auth/pat.html
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/databricks.go
      - https://github.com/google/osv-scalibr/blob/55c87fa3e90372b2411b3c6ed111f7d257ced048/veles/secrets/databrickspat/detector.go

  # This host feeds the DOMAIN/DATABRICKS_DOMAIN variable that the token rules
  # below POST credentials to, so it must only ever match hosts Databricks
  # actually serves. `azurewebsites.net` was previously accepted here, which
  # meant a bearer token could be sent to an unrelated Azure App Service host.
  - name: Databricks Domain
    id: kingfisher.databricks.3
    pattern: |
      (?xi)
      \b
      (
        (?:
          (?: [[:alnum:]-]+ \. )+
          (?: cloud | gcp )
          \. databricks \. com
          |
          adb- [[:alnum:]-]+
          \. [[:digit:]]+
          \. azuredatabricks \. net
        )
      )
      \b
    min_entropy: 3.5
    visible: false
    confidence: medium
    examples:
      - company-name.cloud.databricks.com
      - adb-4839201756384920.11.azuredatabricks.net
    categories:
      - cloud
      - infrastructure
    references:
      - https://docs.databricks.com/workspace/workspace-details.html
      - https://docs.gcp.databricks.com/workspace/workspace-details.html
      - https://docs.microsoft.com/en-us/azure/databricks/scenarios/what-is-azure-databricks
      - https://learn.microsoft.com/en-us/azure/databricks/workspace/workspace-details
      - https://github.com/google/osv-scalibr/pull/1787

  - name: Databricks OAuth Client ID
    id: kingfisher.databricks.4
    pattern: |
      (?xi)
      \b
      (?:databricks|dbx)
      (?:.|[\n\r]){0,64}?
      (?:\b|_)client[_-]?id\b
      (?:.|[\n\r]){0,16}?
      [=:"'\s]
      \b
      (
        [A-Za-z0-9-]{32,36}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    visible: false
    examples:
      - 'DATABRICKS_CLIENT_ID="e0e362e3-a77e-3bfe-d9f2-8ab252567ad4"'
    references:
      - https://docs.databricks.com/aws/en/dev-tools/auth/oauth-m2m
      - https://github.com/google/osv-scalibr/pull/1787

  # Databricks issues the same `dose`-prefixed secret for service-principal
  # (M2M) and user-account (U2M) OAuth clients, so one rule covers both. Only
  # the workspace token endpoint is validated: the account-level endpoint needs
  # `/oidc/accounts/<account-id>/v1/token`, and a rule gets exactly one
  # validation request with no conditional templating, so a second rule for it
  # would report every secret twice. `DATABRICKS_HOST` (a workspace host) is
  # also far more commonly co-located with the secret than an account ID is.
  - name: Databricks OAuth Client Secret
    id: kingfisher.databricks.5
    pattern: |
      (?x)
      \b
      (
        dose[[:alnum:]_.-]{32}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    examples:
      - 'DATABRICKS_CLIENT_SECRET="doseIqLzmviuoubffILcGr.a1igZf37LiHaU"'
    depends_on_rule:
      - rule_id: kingfisher.databricks.3
        variable: DATABRICKS_DOMAIN
      - rule_id: kingfisher.databricks.4
        variable: CLIENT_ID
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://{{ DATABRICKS_DOMAIN }}/oidc/v1/token
          headers:
            Authorization: "Basic {{ CLIENT_ID | append: ':' | append: TOKEN | b64enc }}"
            Content-Type: application/x-www-form-urlencoded
          body: grant_type=client_credentials&scope=all-apis
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
    references:
      - https://docs.databricks.com/aws/en/dev-tools/auth/oauth-m2m
      - https://github.com/google/osv-scalibr/pull/1787
