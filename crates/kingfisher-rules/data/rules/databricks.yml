rules:
  - name: Databricks API Token (Version-Suffixed)
    id: kingfisher.databricks.1
    pattern: |
      (?x)
      \b
      (
        dapi
        [[:digit:]a-f]{32}
        -[[:digit:]]
      )
      (?:[^[:alnum:]-]|$)
    min_entropy: 3.3
    confidence: medium
    examples:
      - "DATABRICKS_TOKEN: 'dapicd295a7be286969133e18a58e4afe7bd-3'"
    negative_examples:
      - "DATABRICKS_TOKEN=dapicd295a7be286969133e18a58e4afe7bd-30"
      - "DATABRICKS_TOKEN=dapiCD295A7BE286969133E18A58E4AFE7BD-3"
    references:
      - https://docs.databricks.com/dev-tools/api/latest/authentication.html
      - https://docs.databricks.com/en/dev-tools/auth/pat.html
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/databricks.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/databricks.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/databricks/databricks-token.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/databricks-api-token.yaml
      - https://github.com/google/osv-scalibr/blob/55c87fa3e90372b2411b3c6ed111f7d257ced048/veles/secrets/databrickspat/detector.go
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://{{ DOMAIN }}/api/2.0/clusters/list
    depends_on_rule:
      - rule_id: "kingfisher.databricks.3"
        variable: DOMAIN
    # Revocation not added: Databricks PAT docs describe token creation and
    # use, but I did not find a PAT-only self-revoke endpoint suitable for YAML
    # revocation here.

  - name: Databricks API Token (Unsuffixed)
    id: kingfisher.databricks.2
    pattern: |
      (?x)
      \b
      (
        dapi[[:digit:]a-f]{32}
      )
      (?:[^[:alnum:]-]|$)
    min_entropy: 3.3
    confidence: medium
    examples:
      - "dapif21ee53d2b3648c2a1ed38953312a203"
    negative_examples:
      - "DATABRICKS_TOKEN=dapicd295a7be286969133e18a58e4afe7bd-3"
      - "DATABRICKS_TOKEN=dapiCD295A7BE286969133E18A58E4AFE7BD"
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://{{ DOMAIN }}/api/2.0/clusters/list
    depends_on_rule:
      - rule_id: "kingfisher.databricks.3"
        variable: DOMAIN
    references:
      - https://docs.databricks.com/dev-tools/api/latest/authentication.html
      - https://docs.databricks.com/en/dev-tools/auth/pat.html
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/databricks.go
      - https://github.com/google/osv-scalibr/blob/55c87fa3e90372b2411b3c6ed111f7d257ced048/veles/secrets/databrickspat/detector.go

  - name: Databricks Domain
    id: kingfisher.databricks.3
    pattern: |
      (?xi)                
      \b 
      (                   
        [a-z0-9-]+ 
        (?: 
          \.[a-z0-9\-]+ 
        )*
        \.                
        (
          cloud\.databricks\.com |
          gcp\.databricks\.com   |
          azurewebsites\.net
        )
      )
      \b
    min_entropy: 3.5
    visible: false
    confidence: medium
    examples:
      - company-name.cloud.databricks.com
    categories:
      - cloud
      - infrastructure
    references:
      - https://docs.databricks.com/workspace/workspace-details.html
      - https://docs.gcp.databricks.com/workspace/workspace-details.html
      - https://docs.microsoft.com/en-us/azure/databricks/scenarios/what-is-azure-databricks
