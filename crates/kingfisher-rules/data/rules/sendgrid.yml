rules:
  - name: Sendgrid API token
    id: kingfisher.sendgrid.1
    pattern: |
      (?xi)
      \b
      (
        SG
        \.
        [[:alnum:]_-]{22}
        \.
        [[:alnum:]_-]{43}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - "      'SENDGRID_API_KEYSID': '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'"
      - "var sendgrid = require('sendgrid')('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');"
      - "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"
    references:
      - https://docs.sendgrid.com/ui/account-and-settings/api-keys
      - https://github.com/praetorian-inc/noseyparker/blob/ca4ef4d2a4771f69e64daf7fbb4f8fafdd18f19d/crates/noseyparker/data/default/builtin/rules/sendgrid.yml
      - https://github.com/gitleaks/gitleaks/blob/c11adc91ad701db3e2c8df030f747086ebca8847/cmd/generate/config/rules/sendgrid.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/sendgrid/sendgrid-api-key.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/sendgrid-api.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/global-matchers/secrets-patterns-rules.yaml
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/sendgrid/detector.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/sendgrid/validator.go
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.sendgrid.com/v3/user/account
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              match_all_words: true
              words: ['"reputation"', '"type"']

    revocation:
      type: HttpMultiStep
      content:
        steps:
          # Step 1: List all API keys to find the current key's ID
          - name: lookup_api_key_id
            request:
              method: GET
              url: https://api.sendgrid.com/v3/api_keys
              headers:
                Authorization: "Bearer {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - type: StatusMatch
                  status: [200]
                - type: JsonValid
            extract:
              # Extract the first API key ID from the list
              # Note: SendGrid only shows partial keys, so we extract the first one
              # which should be the current token if there's only one active key
              API_KEY_ID:
                type: JsonPath
                path: "$.result[0].api_key_id"

          # Step 2: Delete the API key using its ID
          - name: delete_api_key
            request:
              method: DELETE
              url: https://api.sendgrid.com/v3/api_keys/{{ API_KEY_ID }}
              headers:
                Authorization: "Bearer {{ TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [204]
