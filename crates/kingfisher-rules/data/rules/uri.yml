rules:
  - name: URI with Username and Secret
    id: kingfisher.uri.1
    pattern: |
      (?xi)
      (
        (?:https?)://
        [A-Za-z](?:[A-Za-z0-9+\-._~!$&'()*+,;=]|%[[:xdigit:]]{2})*
        :
        (?:[A-Za-z0-9\-._~!$&'()*+,;=]|%[[:xdigit:]]{2})+
        @
        (?:[A-Za-z0-9\-._~%]+|\[[A-Fa-f0-9:.]+\]|\[v[[:xdigit:]][A-Za-z0-9\-._~%!$&'()*,;=:]+\])
        (:?[0-9]+)?
        (?:/[A-Za-z0-9\-._~%!$&'()*,;=:@%]*)*
        /?
        (?:\?[A-Za-z0-9\-._~%!$&'()*,;=:@/?%]*)?
        (?:\#[A-Za-z0-9\-._~%!$&'()*,;=:@/?%]*)?
      )
    pattern_requirements:
      ignore_if_contains:
        - "****"
        - "xxxx"
        - "username:"
        - "user:"
        - ":password"
        - ":pass"
        - ">:<"
    min_entropy: 4.0
    confidence: medium
    examples:
      - https://username:secret@example.com/path
    # validation:
    #   type: Http
    #   content:
    #     request:
    #       method: GET
    #       response_is_html: true
    #       url: '{{ TOKEN }}'
    #       response_matcher:
    #         - report_response: false
    #           type: StatusMatch
    #           status:
    #             - 200
    # references:
    #   - https://www.rfc-editor.org/rfc/rfc3986#section-3.2.1
    references:
      - https://www.rfc-editor.org/rfc/rfc3986.html#section-3.2.1
