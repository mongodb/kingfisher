rules:
  - name: Pinecone API Key
    id: kingfisher.pinecone.1
    pattern: |
      (?xi)
      \b
      pinecone
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|API|KEY|TOKEN)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.0
    confidence: medium
    examples:
      - PINECONE_API_KEY=62b0dbfe-3489-4b79-b850-34d911527c88
      - pinecone_key = "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    references:
      - https://docs.pinecone.io/reference/api/authentication
      - https://docs.pinecone.io/reference/api/2025-10/control-plane/list_indexes
      - https://docs.pinecone.io/guides/projects/manage-api-keys
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.pinecone.io/indexes
          headers:
            Api-Key: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid

  - name: Pinecone API Key (pcsk_)
    id: kingfisher.pinecone.2
    pattern: |
      (?x)
      \b
      (
        pcsk_
        [A-Za-z0-9]{5,6}
        _
        [A-Za-z0-9]{63}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    examples:
      - "PINECONE_API_KEY=pcsk_abcde_aB1cD2eF3gH4iJ5kL6mN7oP8qR9sT0uV1wX2yZ3aB4cD5eF6gH7iJ8kL9mN0aB7"
      - pcsk_AbCdE_aB1cD2eF3gH4iJ5kL6mN7oP8qR9sT0uV1wX2yZ3aB4cD5eF6gH7iJ8kL9mN0aB7
    references:
      - https://github.com/gitleaks/gitleaks/pull/2177
      - https://docs.pinecone.io/reference/api/authentication
      - https://docs.pinecone.io/reference/api/2025-10/control-plane/list_indexes
      - https://docs.pinecone.io/guides/projects/manage-api-keys
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.pinecone.io/indexes
          headers:
            Api-Key: "{{ TOKEN }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
