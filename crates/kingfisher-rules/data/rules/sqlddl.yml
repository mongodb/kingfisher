rules:
  - name: SQL Account Creation with Password
    id: kingfisher.sqlddl.1
    pattern: |
      (?xi)
      CREATE\s+(?:USER|LOGIN)\s+\S+.{0,100}?(?:IDENTIFIED\s+BY|WITH\s+PASSWORD)
      \s*=?\s*['"]?([^'";\s$%]{4,128})
    confidence: medium
    pattern_requirements:
      ignore_if_contains:
        [
          "CHANGEME",
          "CHANGE_ME",
          "PLACEHOLDER",
          "EXAMPLE",
          "YOUR_",
          "strongpassword",
          "yourpassword",
        ]
    examples:
      - "CREATE LOGIN sa WITH PASSWORD = 'MyStr0ngP@ss!'"
      - "CREATE USER 'admin'@'%' IDENTIFIED BY 'secret123'"
    references:
      - https://learn.microsoft.com/en-us/sql/t-sql/statements/create-login-transact-sql
      - https://dev.mysql.com/doc/refman/8.0/en/create-user.html
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/sqlddl.yml
