rules:
  - name: Voyage AI API Key
    id: kingfisher.voyageai.api_key
    description: Detects Voyage AI API keys used for embedding and retrieval models.
    # Matches keys starting with 'pa-' followed by 43 URL-safe base64 characters
    pattern: |
      (?x)
      \b
      (
        pa-[a-zA-Z0-9\-_]{43}
      )
      \b
    min_entropy: 4.0
    confidence: medium
    examples:
      - pa-r4yuCYCuPhNO-10Lu9aO7dR4jxUWlLmlUjm_NOVVdSs
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.voyageai.com/v1/embeddings
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/json
          body: '{"input":"hi","model":"nonexistent-model-xyz-12345"}'
          response_matcher:
            # /v1/files is NOT a reliable oracle: it returns 200 for revoked/deleted keys
            # (confirmed against a key revoked via the Voyage dashboard). /v1/embeddings
            # enforces auth before model resolution, so a nonexistent model triggers a
            # free 400 "Model ... is not supported" for a live key (no inference, no
            # billing) while an invalid/revoked key gets 401 "Provided API key is
            # invalid." 403 = live key without embeddings permission.
            - type: StatusMatch
              status: [401]
              negative: true
            - type: WordMatch
              words:
                - "Provided API key is invalid"
                - "cannot access this endpoint"
              negative: true
    references:
      - https://docs.voyageai.com/reference
      - https://docs.voyageai.com/docs/api-key-and-installation

  - name: Voyage AI API Key
    id: kingfisher.voyageai.api_key.2
    description: Detects Voyage AI API keys (al- prefix variant) used for embedding and retrieval models.
    # Matches keys starting with 'al-' followed by 43 URL-safe base64 characters
    pattern: |
      (?x)
      \b
      (
        al-[a-zA-Z0-9\-_]{43}
      )
      \b
    min_entropy: 4.0
    confidence: medium
    examples:
      - al-Qf7M2bZ8xnLpvE4hRcDsJtAo1KyU93WgIBmXrNVoYTu
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.voyageai.com/v1/embeddings
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/json
          body: '{"input":"hi","model":"nonexistent-model-xyz-12345"}'
          response_matcher:
            # /v1/files is NOT a reliable oracle: it returns 200 for revoked/deleted keys
            # (confirmed against a key revoked via the Voyage dashboard). /v1/embeddings
            # enforces auth before model resolution, so a nonexistent model triggers a
            # free 400 "Model ... is not supported" for a live key (no inference, no
            # billing) while an invalid/revoked key gets 401 "Provided API key is
            # invalid." 403 = live key without embeddings permission.
            - type: StatusMatch
              status: [401]
              negative: true
            - type: WordMatch
              words:
                - "Provided API key is invalid"
                - "cannot access this endpoint"
              negative: true
    references:
      - https://docs.voyageai.com/reference
      - https://docs.voyageai.com/docs/api-key-and-installation
# NOTE: Revocation is not implemented because Voyage AI does not document a public REST
# endpoint for programmatic API key revocation. All probed admin/key-management paths
# under api.voyageai.com return 404. Keys must be revoked via the Voyage AI dashboard.
