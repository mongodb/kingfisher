rules:
  - name: LinkedIn Client ID
    id: kingfisher.linkedin.1
    pattern: |
      (?xi)
      linkedin
      .?
      (?: api | app | application | client | consumer | customer )?
      .?
      (?: id | identifier | key )
      .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}
      \b ([[:alnum:]]{12,14}) \b
    pattern_requirements:
      min_digits: 2
    references:
      - https://docs.microsoft.com/en-us/linkedin/shared/api-guide/best-practices/secure-applications
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/linkedin.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/linkedin.go
    min_entropy: 2.5
    confidence: medium
    examples:
      - |
        LINKEDIN_KEY = "77yg7tx91p4lag"
        LINKEDIN_SECRET = "zt7GeN6IH911xvRj"
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.linkedin.com/v2/me

  - name: LinkedIn Secret Key
    id: kingfisher.linkedin.2
    pattern: |
      (?xi)
      linkedin
      .?
      (?: api | app | application | client | consumer | customer | secret | key )
      .?
      (?: key | oauth | sec | secret )?
      .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}
      \b ([[:alnum:]]{16}) \b
    pattern_requirements:
      min_digits: 2
    references:
      - https://docs.microsoft.com/en-us/linkedin/shared/api-guide/best-practices/secure-applications
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/linkedin.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/linkedin.go
    min_entropy: 3.3
    confidence: medium
    examples:
      - |
        LINKEDIN_KEY = "77yg7tx91p4lag"
        LINKEDIN_SECRET = "zt7GeN6IH911xvRj"
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.linkedin.com/v2/me
