rules:
  - name: NewsAPI API Key
    id: kingfisher.newsapi.1
    pattern: |
      (?x)
      \b
      (?i:newsapi)
      (?:.|[\n\r]){0,16}?
      (?i:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    pattern_requirements:
      min_digits: 2
    examples:
      - newsapi_key = "652c642fb2ca4bcad1adfbd427210402"
    references:
      - https://newsapi.org/docs/authentication
      - https://newsapi.org/docs/endpoints/sources
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://newsapi.org/v2/top-headlines/sources?apiKey={{ TOKEN }}
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: StatusMatch
              status: [401]
              negative: true
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"status":"ok"', '"sources"']
