rules:
  - name: ZeroBounce API Key
    id: kingfisher.zerobounce.1
    pattern: |
      (?x)
      \b
      (?i:zerobounce)
      (?:.|[\n\r]){0,16}?
      (?i:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    pattern_requirements:
      min_digits: 2
    examples:
      - zerobounce_api_key = "cb18bc44723f4985b5dd7408b434b801"
      - zerobounce_api_key = "d0f369dc181a45cbbcc3d0d0e2bfc44a"
      - zerobounce_api_key = "f42533535ea54fcab7afb6d4c021ec3f"
      - zerobounce_api_key = "a2c9317687cb498bac054ff5022c1317"
      - zerobounce_api_key = "66e2b9eb9625441fb9a1c9f0e306deca"
    references:
      - https://www.zerobounce.net/docs/email-validation-api-quickstart/v2-validate-emails
      - https://www.zerobounce.net/docs/email-validation-api-quickstart/
      - https://api.zerobounce.net/v2/validate
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.zerobounce.net/v2/validate?api_key={{ TOKEN }}&email=test@example.com&ip_address=
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              words: ["test@example.com"]
