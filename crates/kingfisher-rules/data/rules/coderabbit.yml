rules:
  - name: CodeRabbit API Key
    id: kingfisher.coderabbit.1
    pattern: |
      (?x)
      \b
      (
        cr-[a-fA-F0-9]{58}
      )
      \b
    pattern_requirements:
      min_digits: 4
    min_entropy: 3.5
    confidence: medium
    examples:
      - "cr-33420bb12fddf6cde6fba5414df88b07f75b2258e30c956b95f2ddbb2d"
    references:
      - https://coderabbit.ai/
      - https://docs.coderabbit.ai/api-reference/
      - https://github.com/MBailly12/CodeRabbit-Docs/blob/da9081a8b85186bd033db364462544dbba3e148a/docs/guides/ondemand-reports.md
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.coderabbit.ai/v1/seats/"
          headers:
            accept: "application/json"
            x-coderabbitai-api-key: "{{TOKEN}}"
          response_matcher:
            - report_response: true
            - type: WordMatch
              words:
                - '"success"'
                - '"errors"'
              match_all_words: false
            - type: WordMatch
              negative: true
              words:
                - '"Invalid or inactive API key"'
