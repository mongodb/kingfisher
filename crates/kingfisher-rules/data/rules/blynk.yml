rules:
  - name: Blynk Cloud Host
    id: kingfisher.blynk.10
    pattern: |
      (?xi)
      https://
      (
        (?:fra1\.|lon1\.|ny3\.|sgp1\.|blr1\.)?blynk\.cloud
      )
      /
    min_entropy: 2.5
    confidence: medium
    visible: false
    examples:
      - https://blynk.cloud/external/api/get?token=Ab12Cd34Ef56Gh78Ij90Kl12Mn34Op56&V1
      - https://fra1.blynk.cloud/api/organization/profile
    references:
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/authentication
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/blynk.yml

  - name: Blynk OAuth Client ID
    id: kingfisher.blynk.11
    pattern: |
      (?xi)
      \b
      (
        oa2-client-id_[A-Z0-9_\-]{32}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    visible: false
    examples:
      - oa2-client-id_Ab12Cd34Ef56Gh78Ij90Kl12Mn34Op56
      - client_id=oa2-client-id_Zx98Yw76Vu54Ts32Rq10Po98Nm76Lk54
    references:
      - https://docs.blynk.io/en/blynk.console/settings/developers/oauth2

  - name: Blynk Device Access Token
    id: kingfisher.blynk.1
    pattern: |
      (?xi)
      https://(?:fra1\.|lon1\.|ny3\.|sgp1\.|blr1\.)?blynk\.cloud/external/api/[A-Z0-9/]*\?token=
      ([A-Z0-9_\-]{32})
      &
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.3
    confidence: medium
    examples:
      - curl "https://blynk.cloud/external/api/get?token=Rps15JICmtRVbFyS_95houlLbm6xIQ2L&V1"
      - curl "https://fra1.blynk.cloud/external/api/get?token=Rps15JICmtRVbFyS_95houlLbm6xIQ2L&V1"
      - curl "https://lon1.blynk.cloud/external/api/get?token=Rps15JICmtRVbFyS_95houlLbm6xIQ2L&V1"
      - curl "https://blynk.cloud/external/api/update/property?token=Rps15JICmtRVbFyS_95houlLbm6xIQ2L&pin=v1&isDisabled=true"
    references:
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/authentication
      - https://docs.blynk.io/en/blynk.cloud/device-https-api/is-device-connected
    depends_on_rule:
      - rule_id: kingfisher.blynk.10
        variable: HOST
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://{{ HOST }}/external/api/isHardwareConnected?token={{ TOKEN | url_encode }}
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ["true", "false"]
    # No documented API endpoint is provided to revoke device auth tokens.
  - name: Blynk Organization Access Token
    id: kingfisher.blynk.2
    pattern: |
      (?xi)
      https://(?:fra1\.|lon1\.|ny3\.|sgp1\.|blr1\.)?blynk\.cloud/api/[A-Z0-9_\-\s/\\]*
      -H\s*"Authorization:\s*Bearer\s*
      ([A-Z0-9_\-]{40})
      "
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.3
    confidence: medium
    examples:
      - 'curl https://fra1.blynk.cloud/api/organization/profile -H "Authorization: Bearer eIdWHQqRfFmvP5LDDh-IGxPUzi7I27HthzCPAVmS"'
      - |
        curl https://fra1.blynk.cloud/api/organization/profile \
        -H "Authorization: Bearer eIdWHQqRfFmvP5LDDh-IGxPUzi7I27HthzCPAVmS"
    references:
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/authentication
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/ogranization-api/get-own-organization-info
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/organizations
    depends_on_rule:
      - rule_id: kingfisher.blynk.10
        variable: HOST
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://{{ HOST }}/api/v1/organization/profile
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"id"', '"name"']
    # No documented API endpoint is provided to revoke organization access tokens.
  - name: Blynk Organization Access Token
    id: kingfisher.blynk.3
    pattern: |
      (?xi)
      -H\s*"Authorization:\s*Bearer\s*
      ([A-Z0-9_\-]{40})
      "[\s\\]*https://(?:fra1\.|lon1\.|ny3\.|sgp1\.|blr1\.)?blynk\.cloud/api
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.3
    confidence: medium
    examples:
      - 'curl -H "Authorization: Bearer eIdWHQqRfFmvP5LDDh-IGxPUzi7I27HthzCPAVmS" https://fra1.blynk.cloud/api/organization/profile'
      - |
        curl -H "Authorization: Bearer eIdWHQqRfFmvP5LDDh-IGxPUzi7I27HthzCPAVmS" \
        https://fra1.blynk.cloud/api/organization/profile
    references:
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/authentication
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/ogranization-api/get-own-organization-info
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/organizations
    depends_on_rule:
      - rule_id: kingfisher.blynk.10
        variable: HOST
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://{{ HOST }}/api/v1/organization/profile
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"id"', '"name"']
    # No documented API endpoint is provided to revoke organization access tokens.
  - name: Blynk Organization Client Credentials
    id: kingfisher.blynk.8
    pattern: |
      (?xi)
      https://(?:fra1\.|lon1\.|ny3\.|sgp1\.|blr1\.)?blynk\.cloud/oauth2/[A-Z0-9_\-\s/\\?=&]*
      oa2-client-id_[A-Z0-9_\-]{32}
      (?: : | &client_secret= )
      ([A-Z0-9_\-]{40})
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.3
    confidence: medium
    examples:
      - "curl -X POST https://fra1.blynk.cloud/oauth2/token?grant_type=client_credentials -u oa2-client-id_zmNtW-D0Toqpz4AZnBLCIlklBrz9ynU-:5uC5Y4Mcvdl5rB56rBmxnvB4DZgiIpcyTPbOoEWp"
      - |
        curl -X POST https://fra1.blynk.cloud/oauth2/token?grant_type=client_credentials \
        -u oa2-client-id_zmNtW-D0Toqpz4AZnBLCIlklBrz9ynU-:5uC5Y4Mcvdl5rB56rBmxnvB4DZgiIpcyTPbOoEWp
      - "curl -X POST https://fra1.blynk.cloud/oauth2/token?grant_type=client_credentials&client_id=oa2-client-id_zmNtW-D0Toqpz4AZnBLCIlklBrz9ynU-&client_secret=5uC5Y4Mcvdl5rB56rBmxnvB4DZgiIpcyTPbOoEWp"
    references:
      - https://docs.blynk.io/en/blynk.console/settings/developers/oauth2
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/authentication
    depends_on_rule:
      - rule_id: kingfisher.blynk.10
        variable: HOST
      - rule_id: kingfisher.blynk.11
        variable: CLIENT_ID
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://{{ HOST }}/oauth2/token?grant_type=client_credentials
          headers:
            Authorization: 'Basic {{ CLIENT_ID | append: ":" | append: TOKEN | b64enc }}'
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"access_token"', '"token_type"']
    # No documented API endpoint is provided to revoke OAuth client credentials.
  - name: Blynk Organization Client Credentials
    id: kingfisher.blynk.9
    pattern: |
      (?xi)
      \b
      oa2-client-id_[A-Z0-9_\-]{32}
      :([A-Z0-9_\-]{40})
      [\s\\]*https://(?:fra1\.|lon1\.|ny3\.|sgp1\.|blr1\.)?blynk\.cloud/oauth2
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 3.3
    confidence: medium
    examples:
      - "curl -X POST -u oa2-client-id_zmNtW-D0Toqpz4AZnBLCIlklBrz9ynU-:5uC5Y4Mcvdl5rB56rBmxnvB4DZgiIpcyTPbOoEWp https://fra1.blynk.cloud/oauth2/token?grant_type=client_credentials"
      - |
        curl -X POST -u oa2-client-id_zmNtW-D0Toqpz4AZnBLCIlklBrz9ynU-:5uC5Y4Mcvdl5rB56rBmxnvB4DZgiIpcyTPbOoEWp \
        https://fra1.blynk.cloud/oauth2/token?grant_type=client_credentials
    references:
      - https://docs.blynk.io/en/blynk.console/settings/developers/oauth2
      - https://docs.blynk.io/en/blynk.cloud/platform-https-api/authentication
    depends_on_rule:
      - rule_id: kingfisher.blynk.10
        variable: HOST
      - rule_id: kingfisher.blynk.11
        variable: CLIENT_ID
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://{{ HOST }}/oauth2/token?grant_type=client_credentials
          headers:
            Authorization: 'Basic {{ CLIENT_ID | append: ":" | append: TOKEN | b64enc }}'
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            - type: WordMatch
              match_all_words: true
              words: ['"access_token"', '"token_type"']
    # No documented API endpoint is provided to revoke OAuth client credentials.
