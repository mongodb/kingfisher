rules:
  - name: Bitwarden OAuth2 Client Secret
    id: kingfisher.bitwarden.1
    pattern: |
      (?x)
      "user_
      (?P<uuid>
        [[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}
      )
      _token_apiKeyClientSecret"
      \s*
      :
      \s*
      "
      (
        [[:alnum:]]{10,50}
      )
      "
    min_entropy: 3.3
    confidence: medium
    examples:
      - '"user_12345678-1234-1234-1234-123456789012_token_apiKeyClientSecret": "aB3dE5fG7hI9jK1lM3nO5pQ7rS9tU0vW2xY4zA6bC8dE0f"'
    references:
      - https://bitwarden.com/help/public-api/#authentication
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/bitwardenoauth2access/detector.go
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/bitwardenoauth2access/validator.go
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://identity.bitwarden.com/connect/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          body: grant_type=client_credentials&scope=api&client_id=user.{{ UUID | url_encode }}&client_secret={{ TOKEN | url_encode }}&deviceName=fireFox&twoFactorToken=0&deviceIdentifier=0&deviceType=0
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: StatusMatch
              status: [400, 401]
              negative: true
            - type: JsonValid
