rules:
  - name: Upstage AI API Key
    id: kingfisher.upstage.1
    pattern: |
      (?xi)
      \b
      upstage
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Za-z0-9]{40,50}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - upstage_api_key = "aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789aBcDeFgHi"
      - upstage_token = "AbCdEf1234567890GhIjKlMnOpQrStUvWxYz0123"
    references:
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/upstage.go#L9
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.upstage.ai/v1/models
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
