rules:
  - name: Ansible Vault Encrypted Secret
    id: kingfisher.ansible.1
    pattern: |
      (?xi)
      \$ANSIBLE_VAULT;
      \d+\.\d+;
      [a-z0-9]+
      (?:;[^\s]*)?
      ((?:\s+[0-9a-f]{16,})+)
    min_entropy: 2.0
    confidence: medium
    examples:
      - |
        $ANSIBLE_VAULT;1.2;AES256;
        61323365393932313636656637656139373966373863383832386161366531353738383565313137
        6136376136613337353930643666323637626634353531350a316335396364656230623265313634
      - |
        $ANSIBLE_VAULT;1.1;AES256
        36373836643336626639643534346538623766623661646261303130636166663566653335343033
      - |
        $ANSIBLE_VAULT;1.2;AES256;dev
        61323365393932313636656637656139373966373863383832386161366531353738383565313137
    references:
      - https://docs.ansible.com/ansible/latest/vault_guide/index.html
      - https://docs.ansible.com/ansible/latest/vault_guide/vault.html
      - https://github.com/praetorian-inc/titus/blob/c5ab7cbe6580012639176532bce87d8e035c10b7/pkg/rule/rules/ansible.yml
