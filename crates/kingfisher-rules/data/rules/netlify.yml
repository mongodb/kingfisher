rules:
  - name: Netlify API Key
    id: kingfisher.netlify.1
    pattern: |
      (?xi)
      netlify
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [a-f0-9]{60,64}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    examples:
      - netlify_token=3cdfad7b885a6daceff3fb820389115750b373763fb30b10ca0382648b55872d
      - netlify_secret=7a9ef2c84d6b3e5f1c8a0b9d2e4f6a8c7b3d5e9f2a1c8b4d6e3f5a9c7b2d8e4
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          url: https://api.netlify.com/api/v1/user
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    references:
      - https://docs.netlify.com/api/get-started/#authentication
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_token_id
            request:
              method: GET
              url: https://api.netlify.com/api/v1/access_tokens
              headers:
                Authorization: "Bearer {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - type: StatusMatch
                  status: [200]
            extract:
              NETLIFY_TOKEN_ID:
                type: JsonPath
                path: "$[0].id"
          - name: delete_token
            request:
              method: DELETE
              url: "https://api.netlify.com/api/v1/access_tokens/{{ NETLIFY_TOKEN_ID }}"
              headers:
                Authorization: "Bearer {{ TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [204]

  - name: Netlify API Key
    id: kingfisher.netlify.2
    pattern: |
      (?xi)
      \b
      netlify
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Z0-9_-]{43,45}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - netlify_token=G5yT54abRasekrOpe7SaArsowiuHTeR45sfEhsH-K1L2
      - netlify_key=H7xZ98cdWbsemqNpv8UaXtsnyjKgVeQ34rsDkpM-N5P6
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          url: https://api.netlify.com/api/v1/user
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
    references:
      - https://docs.netlify.com/api/get-started/#authentication
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_token_id
            request:
              method: GET
              url: https://api.netlify.com/api/v1/access_tokens
              headers:
                Authorization: "Bearer {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - type: StatusMatch
                  status: [200]
            extract:
              NETLIFY_TOKEN_ID:
                type: JsonPath
                path: "$[0].id"
          - name: delete_token
            request:
              method: DELETE
              url: "https://api.netlify.com/api/v1/access_tokens/{{ NETLIFY_TOKEN_ID }}"
              headers:
                Authorization: "Bearer {{ TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [204]

  - name: Netlify Personal Access Token (nfp_ prefix)
    id: kingfisher.netlify.3
    pattern: |
      (?x)
      \b
      (
        nfp_[a-zA-Z0-9]{40,48}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.3
    confidence: medium
    examples:
      - "NETLIFY_AUTH_TOKEN=nfp_a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0"
    references:
      - https://docs.netlify.com/api/get-started/#authentication
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.netlify.com/api/v1/user
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
