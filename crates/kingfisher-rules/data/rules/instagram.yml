rules:
  - name: Instagram Graph API Access Token
    id: kingfisher.instagram.1
    pattern: |
      (?x)
      \b
      (
        IGQVJ[A-Za-z0-9_-]{50,256}
      )
      \b
    pattern_requirements:
      min_digits: 3
    min_entropy: 3.5
    confidence: high
    examples:
      - "INSTAGRAM_ACCESS_TOKEN=IGQVJWZAkFNT1liY2J3b3FmUHJVQzNfSUtlX3RhVm5FNGppZAjhCeUpEWnJIUWxCNkVrQjhGSU9rOVBuVnBaQUtKYjF6MjFGZA3VhZAXRxYkJGS01wS1BNLVlsaGtJYUV3"
      - 'instagram_token: "IGQVJXZAGtIR0hKVERjNXB5bnM0Y1BmUmFKa0RFZAnBXdVFKVUNNUjZAtVW5lZAXRhNGdLZA2V3OVlGS3dFZATVyYnlIVXlwcHdvdkxiS01wS1BNLVlsaGtJYUV3dg"'
    references:
      - https://developers.facebook.com/docs/instagram-basic-display-api/
      - https://developers.facebook.com/docs/instagram-platform/reference/access_token/
      - https://github.com/SocialiteProviders/Instagram/blob/223f7eb116b8dd6974b28f0a792a314c7deffcbb/Provider.php
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://graph.instagram.com/me?fields=id,username&access_token={{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
