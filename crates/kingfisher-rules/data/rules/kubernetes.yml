rules:
  - name: Kubernetes API Server URL
    id: kingfisher.kubernetes.1
    pattern: |
      (?xi)
      \b
      (?:
        kube(?:rnetes)?(?:_api)?_server
      |
        api_server
      )
      \s*[:=]\s*
      ["']?
      (
        https://
        (?:
          \[[0-9a-f:.]+\]
        |
          [[:alnum:]]
          [a-z0-9.-]{1,253}
        )
        (?::\d{2,5})?
      )
      ["']?
    min_entropy: 2.0
    confidence: medium
    visible: false
    examples:
      - "kube_server: https://10.96.0.1:443"
      - KUBE_API_SERVER=https://api.cluster.example.com:6443
    references:
      - https://kubernetes.io/docs/reference/access-authn-authz/authentication/
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/kubernetes.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/kubernetes.go

  - name: Kubernetes Bootstrap Token
    id: kingfisher.kubernetes.2
    pattern: |
      (?xi)
      \b
      (?:
        bootstrap(?:[-_ ]token)?
      |
        tls[-_ ]bootstrap[-_ ]token
      )
      (?:.|[\n\r]){0,12}?
      (
        [[:alnum:]]{6}
        \.
        [[:alnum:]]{16}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.2
    confidence: medium
    examples:
      - BOOTSTRAP_TOKEN=be8dfd.da8a689a46edc282
      - --tls-bootstrap-token abcdef.1234567890abcdef
    references:
      - https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/kubernetes.yml
    depends_on_rule:
      - rule_id: kingfisher.kubernetes.1
        variable: KUBE_API_SERVER
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "{{ KUBE_API_SERVER }}/api/v1/namespaces?limit=1"
          headers:
            Accept: application/json
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 403]
            - type: JsonValid

  - name: Kubernetes Bootstrap Token Pair
    id: kingfisher.kubernetes.3
    pattern: |
      (?xis)
      \btoken-id\b
      \s*:\s*
      (?P<TOKEN_ID>[a-z0-9]{6})
      (?:.|[\n\r]){0,24}?
      \btoken-secret\b
      \s*:\s*
      (?P<TOKEN_SECRET>[a-z0-9]{16})
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 2.8
    confidence: medium
    examples:
      - |
        token-id: 07402b
        token-secret: f395accd245ae53d
    references:
      - https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/
    depends_on_rule:
      - rule_id: kingfisher.kubernetes.1
        variable: KUBE_API_SERVER
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "{{ KUBE_API_SERVER }}/api/v1/namespaces?limit=1"
          headers:
            Accept: application/json
            Authorization: "Bearer {{ TOKEN_ID }}.{{ TOKEN_SECRET }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 403]
            - type: JsonValid

  # A ServiceAccount token is a JWT, so `kingfisher.jwt.1` also matches it. That
  # overlap is deliberate: YAML rules cannot decode a JWT payload to inspect
  # Kubernetes claims, so the only way to attribute a token to Kubernetes is the
  # surrounding label, and an operator routing on rule id needs a Kubernetes-named
  # finding to rotate the ServiceAccount rather than triage an anonymous JWT.
  # Both rules run the same JWT validator, so neither is a strictly weaker
  # duplicate of the other; expect one credential to surface under both ids.
  - name: Kubernetes ServiceAccount Token
    id: kingfisher.kubernetes.4
    pattern: |
      (?x)
      \b
      (?i:kubernetes|k8s)
      (?:.|[\n\r]){0,64}?
      (?i:service[_-]?account|serviceaccount)
      (?:.|[\n\r]){0,64}?
      (?i:token|jwt)
      (?:[[:blank:]]*[:=][[:blank:]]*|[[:blank:]]+)
      ["']?
      (
        (?:ey|ewogIC)[A-Za-z0-9_-]{12,}\.
        ey[A-Za-z0-9_-]{12,}\.
        [A-Za-z0-9_-]{24,}
      )
      \b
    min_entropy: 3.3
    confidence: medium
    examples:
      - 'KUBERNETES_SERVICE_ACCOUNT_TOKEN="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJzeXN0ZW06c2VydmljZWFjY291bnQ6ZGVmYXVsdDpkZWZhdWx0Iiwia3ViZXJuZXRlcy5pby9zZXJ2aWNlYWNjb3VudC9uYW1lc3BhY2UiOiJkZWZhdWx0In0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"'
    validation:
      type: JWT
    tls_mode: lax
    references:
      - https://kubernetes.io/docs/concepts/security/service-accounts/
      - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
      - https://github.com/google/osv-scalibr/pull/2234
