rules:
  - name: Starknet Private Key
    id: kingfisher.starknet.1
    # A Starknet private key is a felt (< 2**251), so the hex form is at most
    # 63 significant nibbles and, when zero-padded to 64, starts `0[0-7]`.
    # Encoding that bound keeps this rule off ordinary 64-hex secp256k1 keys,
    # which `kingfisher.ethereum.1` already covers. The leading context is
    # restricted to Starknet-ecosystem identifiers for the same reason: generic
    # labels like `private_key` or `wallet` are not chain-specific and would
    # misattribute every EVM key in the tree.
    pattern: |
      (?x)
      \b
      (?i:starknet|stark[_-]?net|starkli|starkware|argent|braavos)
      (?:.|[\n\r]){0,50}?
      ["']?
      (
        0x
        (?:
          0[0-7][[:xdigit:]]{62}
          |
          [0-7][[:xdigit:]]{62}
          |
          [[:xdigit:]]{61,62}
        )
      )
      \b
    min_entropy: 3.0
    confidence: medium
    validation:
      type: Assumed
    examples:
      - 'starknet_private_key = "0x4b6417c2442e6cefdb8f503c031865f4ac8a3ad3157b3959bba99bbafda390d"'
      - "argent: 0x03f2a91c7be0d54836a1c9e7f2b4d68a03c5e719fbd82a640ce39157b2ad4c6e"
    negative_examples:
      # secp256k1 keys are 64 significant nibbles and out of felt range;
      # `kingfisher.ethereum.1` owns these.
      - 'ETH_PRIVATE_KEY = "0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318"'
      - "export private_key=0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318"
    references:
      - https://docs.starknet.io/learn/protocol/accounts
      - https://github.com/google/osv-scalibr/pull/2013
