rules:
  - name: ImageKit Private API Key
    id: kingfisher.imagekit.1
    pattern: |
      (?xi)
      \b
      imagekit
      (?:.|[\n\r]){0,64}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN|PRIVATE_KEY)
      (?:.|[\n\r]){0,64}?
      \b
      (
        (?-i:private_)[A-Z0-9_-]{8,128}
      )
      \b
    min_entropy: 3.2
    confidence: medium
    examples:
      - IMAGEKIT_PRIVATE_KEY=private_rGAPQJbhBx
      - imagekit token private_AbDcEf0124356789GhIjKlMn
    references:
      - https://imagekit.io/docs/api-keys
      - https://imagekit.io/docs/api-reference/account-management-api/url-endpoints/list-url-endpoints
      - https://github.com/imagekit-developer/imagekit-ruby/blob/d3b164e19866ce437c044db5da91f4ccaaea49e1/lib/imagekitio/client.rb
      - https://github.com/imagekit-developer/imagekit-dotnet/blob/5ed8e5ee39c064dbe8c44d3bd8f5ab55df646e28/src/Imagekit.Tests/Models/Accounts/UrlEndpoints/UrlEndpointCreateParamsTest.cs
    validation:
      type: Http
      content:
        request:
          method: GET
          url: "https://api.imagekit.io/v1/accounts/url-endpoints"
          headers:
            Authorization: "Basic {{ TOKEN | append: ':' | b64enc }}"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words: ['"urlEndpoint"']
