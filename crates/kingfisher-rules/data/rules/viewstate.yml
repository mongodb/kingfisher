rules:
  - name: ASP.NET MachineKey Validation Key
    id: kingfisher.viewstate.1
    pattern: |
      (?xi)validationKey\s*=\s*["']([[:xdigit:]]{40,256})["']
    confidence: medium
    examples:
      - 'validationKey="C50B3C89CB21F4F1422FF158A5B42D0E8DB8CB5CDA1742572A487D9401E3400267682B202B746511891C1BAF47F8D25C07F6C39A104696DB51F17C529AD3CABE"'
    references:
      - https://learn.microsoft.com/en-us/previous-versions/aspnet/w8h3skw9(v=vs.100)
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/viewstate.yml

  - name: ASP.NET MachineKey Decryption Key
    id: kingfisher.viewstate.2
    pattern: |
      (?xi)decryptionKey\s*=\s*["']([[:xdigit:]]{32,128})["']
    confidence: medium
    examples:
      - 'decryptionKey="8A9BE8FD67AF6979E7D20198CFEA50DD3D987AAAAD7FA14C"'
    references:
      - https://learn.microsoft.com/en-us/previous-versions/aspnet/w8h3skw9(v=vs.100)
      - https://github.com/praetorian-inc/titus/blob/1e0b18f06b363df54abac3a78f3a3aa8b8278f62/pkg/rule/rules/viewstate.yml
