rules:
  - name: Cal.com API Key
    id: kingfisher.calcom.1
    pattern: |
      (?x)
      \b
      (
        cal(?:_live)?_[A-Za-z0-9]{32}
      )
      \b
    pattern_requirements:
      min_digits: 1
    min_entropy: 3.0
    confidence: medium
    examples:
      - "CAL_API_KEY=cal_live_f1ec52a0b268e00fe30b63e96115c8df"
      - "Authorization: Bearer cal_live_xK8m2LpQr5nW0vYz3cJ7aB4dE6fG8hJk"
    references:
      - https://cal.com/docs/api-reference/v2/introduction
      - https://github.com/calcom/docs/blob/ae458a30e65a70a52208d70933f13f2f33ad23ca/pages/enterprise-features/api/authentication.mdoc
      - https://github.com/calcom/cal.diy/blob/3894f37e14eae5082770f35ff1fde72110c0e6b6/agents/skills/calcom-api/references/authentication.md
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.cal.com/v2/me
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            cal-api-version: "2024-08-13"
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
