rules:
  - name: Loops Email API Key
    id: kingfisher.loops.1
    pattern: |
      (?xi)
      \b
      loops
      (?:.|[\n\r]){0,32}?
      (?:API[_-]?KEY|SECRET|TOKEN|KEY)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    pattern_requirements:
      min_digits: 3
    min_entropy: 3.5
    confidence: medium
    examples:
      - "LOOPS_API_KEY=d2d561f5ff80136f69b4b5a31b9fb3c9"
      - "LOOPS_API_KEY=a2b94928dca54f3e9444e0b39a9ac79f"
    references:
      - https://loops.so/docs/api-reference/intro
      - https://loops.so/docs/api-reference/api-key
      - https://github.com/segmentio/action-destinations/blob/5539716dacde8b1eb15e1b1a2dd72e883fb55b02/packages/destination-actions/src/destinations/loops/index.ts
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://app.loops.so/api/v1/api-key
          headers:
            Accept: application/json
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"success"'
                - "true"
              match_all_words: true
