rules:
  - name: Bitbucket Client ID
    id: kingfisher.bitbucket.1
    pattern: |
      (?xi)
      \b
      bitbucket
      (?:.|[\n\r]){0,16}?
      (?:client|id)
      (?:.|[\n\r]){0,16}?
      (
        [[:alnum:]]{30,40}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - bitbucket_id=byl2nhrv34zaclukjhvomlvjabkujf
      - bitbucket.client.ID=abcdefghij1234567890klmnopqrst
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Basic {{ TOKEN | b64enc }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.bitbucket.org/2.0/user
    references:
      - https://developer.atlassian.com/cloud/bitbucket/oauth-2/
      - https://developer.atlassian.com/cloud/bitbucket/rest/intro/#authentication
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/bitbucket.yml
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/bitbucket.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/bitbucket/bitbucket-clientid.yaml

  - name: Bitbucket Secret
    id: kingfisher.bitbucket.3
    pattern: |
      (?xi)
      \b
      bitbucket
      (?:.|[\n\r]){0,32}?
      \b
      (
        [a-z0-9+_\-+]{44}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - bitbucket_key=HedmnK9h6KD_eh9KK8FlI9ahUc8WfaNZ4gulbrtN2ouV
      - bitbucket_secret=kd8j2h4jf9s8mf6l4k9j2h4jf9s8mf6l4k9j2h4jf9s8
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bearer {{ TOKEN }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://api.bitbucket.org/2.0/user
    references:
      - https://developer.atlassian.com/cloud/bitbucket/oauth-2/
      - https://developer.atlassian.com/cloud/bitbucket/rest/intro/#authentication
      - https://github.com/gitleaks/gitleaks/blob/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/cmd/generate/config/rules/bitbucket.go
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/exposures/tokens/bitbucket/bitbucket-clientsecret.yaml
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/file/keys/bitbucket/bitbucket-client-secret.yaml

  - name: Bitbucket Cloud Access Token
    id: kingfisher.bitbucket.4
    pattern: |
      (?x)
      \b
      (
        (?P<body>ATCTT3xFfGN0[[:alnum:]_-]{80,800}=)
        (?P<checksum>[[:xdigit:]]{8})
      )
      \b
    pattern_requirements:
      checksum:
        actual:
          template: "{{ CHECKSUM | downcase }}"
          requires_capture: checksum
        expected: "{{ BODY | crc32_hex }}"
    min_entropy: 4.0
    confidence: medium
    examples:
      - ATCTT3xFfGN0Repo7_Token9-AbCdEfGhJkLmN2PqR5Repo7_Token9-AbCdEfGhJkLmN2PqR5Repo7_Token9-AbCdEfGhJkLmN2PqR5=BC67283D
    references:
      - https://community.atlassian.com/forums/Bitbucket-questions/Can-we-confirm-BitBucket-s-token-prefixes/qaq-p/3093481
      - https://support.atlassian.com/bitbucket-cloud/docs/access-tokens/
      - https://developer.atlassian.com/cloud/bitbucket/rest/intro/
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/rules/config.yaml
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/filters/value_atlassian_token_check.py
      - https://github.com/google/osv-scalibr/blob/8dec65935b947e6bac64a2fed73838286db4c971/veles/secrets/gitbasicauth/bitbucket/detector_test.go
    # Access tokens can be repository-, project-, or workspace-scoped. Atlassian does not provide a token-only endpoint that is valid for every scope.

  - name: Bitbucket Cloud App Password
    id: kingfisher.bitbucket.5
    pattern: |
      (?x)
      \b
      (
        (?P<body>ATBB[[:alnum:]]{24})
        (?P<checksum>[[:xdigit:]]{8})
      )
      \b
    pattern_requirements:
      checksum:
        actual:
          template: "{{ CHECKSUM | downcase }}"
          requires_capture: checksum
        expected: "{{ BODY | crc32_hex }}"
    min_entropy: 3.8
    confidence: medium
    examples:
      - ATBBAb3dE5fG7hJ9kL2mN4pQ6rS8AD6D34F4
    references:
      - https://community.atlassian.com/forums/Bitbucket-questions/Can-we-confirm-BitBucket-s-token-prefixes/qaq-p/3093481
      - https://support.atlassian.com/bitbucket-cloud/docs/using-app-passwords/
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/rules/config.yaml
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/filters/value_atlassian_token_check.py
      - https://github.com/praetorian-inc/noseyparker/blob/2e6e7f36ce36619852532bbe698d8cb7a26d2da7/crates/noseyparker/data/default/builtin/rules/bitbucket.yml
    # Atlassian retired app-password creation and use, so a live validator would not be reliable for this historical credential format.

  - name: Bitbucket Data Center HTTP Access Token
    id: kingfisher.bitbucket.6
    pattern: |
      (?x)
      \b
      (
        BBDC-
        [MNO][[:alnum:]+/]{15}
        O[g-v]
        [[:alnum:]+/]{26}
      )
      \b
    pattern_requirements:
      min_digits: 2
      min_uppercase: 1
      min_lowercase: 1
    min_entropy: 4.0
    confidence: medium
    examples:
      - BBDC-MTIzNDU2Nzg5MDEyOkExYjJDM2Q0RTVmNkc3aDhJOWow
      - "Authorization: Bearer BBDC-NDM5MzAxNTc4MzA1OqEEPqHU4oTScTVkDs/JUzB7ptIf"
    references:
      - https://support.atlassian.com/bitbucket-data-center/kb/smudge-error-occurs-when-performing-git-operations-when-using-token-authentication-with-bitbucket-server-or-data-center/
      - https://confluence.atlassian.com/bitbucketserver/http-access-tokens-939515499.html
      - https://github.com/Samsung/CredSweeper/blob/1887aa1d6070ed1beb386c6c1ef73fd7e7f9216f/credsweeper/rules/config.yaml
    # Validation requires the deployment base URL plus an authorized resource; anonymous endpoints can otherwise produce false positives.
