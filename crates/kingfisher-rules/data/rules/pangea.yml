rules:
  - name: Pangea Service Token
    id: kingfisher.pangea.1
    pattern: |
      (?x)
      \b
      (
        pts_[a-z0-9]{30,36}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: high
    categories: [api, key]
    examples:
      - "PANGEA_TOKEN=pts_t6i6nc6dnvcqswtanszugxzqteyiweju"
      - "pangea_token: pts_z6txtdyt3dsrb7knrd233zhsjaobsrhi"
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://audit.aws.us.pangea.cloud/v1/log
          headers:
            Authorization: Bearer {{ TOKEN }}
            Content-Type: application/json
          body: '{"event":{"message":"test"}}'
          response_matcher:
            - report_response: true
            - type: JsonValid
            - type: WordMatch
              words:
                - '"status":"Unauthorized"'
                - '"status":"NotAuthorized"'
                - '"status":"Forbidden"'
              negative: true
    references:
      - https://pangea.cloud/docs/
      - https://pangea.cloud/docs/audit/credentials/
      - https://github.com/pangeacyber/pangea-python/blob/1f411ae567833cd3035126db8960347230542153/packages/pangea-sdk/README.md
      - https://github.com/pangeacyber/pangea-go/blob/e4847c0695808095dc0988809aafb97425e5e1df/pangea-sdk/README.md
