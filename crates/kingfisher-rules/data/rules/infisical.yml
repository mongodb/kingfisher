rules:
  - name: Infisical Service Token
    id: kingfisher.infisical.1
    pattern: |
      (?x)
      \b
      (
        st\.[A-Za-z0-9_-]{3,48}\.[A-Za-z0-9_-]{3,48}\.[a-f0-9]{8,64}
      )
      (?:\b|$)
    min_entropy: 3.5
    confidence: medium
    examples:
      - "INFISICAL_TOKEN=st.a1b2c3d4e5f6.7890abcdef12.f1e2d3c4b5a69788796a5b4c3d2e1f0"
    references:
      - https://infisical.com/docs/internals/service-tokens
      - https://github.com/Infisical/infisical/blob/2c3e7d20726c6f16bb653b916ddb72b5ca5f05cf/docs/internals/service-tokens.mdx
      - https://github.com/Infisical/infisical/blob/2c3e7d20726c6f16bb653b916ddb72b5ca5f05cf/backend-go/internal/services/auth/apiauth/classify.go
