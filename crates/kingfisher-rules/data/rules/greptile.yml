rules:
  - name: Greptile API Key
    id: kingfisher.greptile.1
    pattern: |
      (?xi)
      \b
      greptile
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [A-Z0-9+/]{48}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - greptile_api_key = "Bc4UcqgG6mG5ARxNAOH7TV2C/tDWaB7Kpne/pockv3iQcbSN"
      - greptile_api_key = "cRxqPehpNKq5Rtp+QvXBPb6p6n7d+2n4a6dLZqhGQVz2w4ln"
    references:
      - https://www.greptile.com/docs
      - https://www.greptile.com/docs/mcp-v2/setup
      - https://www.greptile.com/docs/code-review/greptile-cli
      - https://github.com/betterleaks/betterleaks/blob/bc21eb24796aa546f999a5dab0f6efe2f7d8e2fa/cmd/generate/config/rules/greptile.go#L9
      - https://docs.greptile.com/
      - https://github.com/betterleaks/betterleaks/blob/8e6d2391899a7c38c1653ab26f493953cdcaa329/cmd/generate/config/rules/greptile.go
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.greptile.com/mcp
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/json
          body: '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_custom_context","arguments":{}}}'
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: WordMatch
              words:
                - '"result"'
            - type: StatusMatch
              status: [401, 403]
              negative: true
