rules:
  - name: Numverify API Key
    id: kingfisher.numverify.1
    pattern: |
      (?x)
      \b
      (?i:numverify)
      (?:.|[\n\r]){0,16}?
      (?i:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    pattern_requirements:
      min_digits: 2
    examples:
      - numverify_access_key = "475830c971d46d16888df62f87f6ff31"
      - numverify_access_key = "e1ce01162876b7d30d5f87a4e59b5560"
      - numverify_access_key = "4541d7e8e842dc00e1d516fba3c85137"
      - numverify_access_key = "d633352a603db1b848735931d33a2b77"
      - numverify_access_key = "c0bef464a2ea1b39719223ed136dd1d4"
    references:
      - https://numverify.com/documentation
      - https://numverify.com/faq
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://apilayer.net/api/validate?access_key={{ TOKEN }}&number=14155551234
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: StatusMatch
              status: [401]
              negative: true
            - type: JsonValid
