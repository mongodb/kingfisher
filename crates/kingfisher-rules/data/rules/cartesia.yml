rules:
  - name: Cartesia API Key
    id: kingfisher.cartesia.1
    pattern: |
      (?x)
      \b
      (
        sk_car_[A-Za-z0-9_]{20}
      )
      \b
    min_entropy: 3.5
    confidence: medium
    categories:
      - api
      - secret
    examples:
      # Synthetic, format-valid examples; these are not issued credentials.
      - 'CARTESIA_API_KEY=sk_car_aB3dE5fG7hI9jK1lM3nP'
      - 'Authorization: Bearer sk_car_Jk9Lm2Np3Qr4St5Uv6Wx'
    references:
      - https://docs.cartesia.ai/use-the-api/api-conventions
      - https://docs.cartesia.ai/api-reference/voices/list
      - https://github.com/cartesia-ai/cartesia-js/blob/56fddf8cf223b8e479d2aae0a8e83d25e65716cf/src/client.ts#L334-L348
      - https://github.com/cartesia-ai/cartesia-mcp/blob/f0f7b2dabecabdb528925191d762391ff715fd59/cartesia_mcp/credentials.py#L67-L72
      - https://github.com/JSONbored/gittensory/blob/f09c0cee1c236ed8b29cf699ecea33a070206eb6/review-enrichment/test/secret-scan.test.ts#L804-L827
      - https://github.com/curtis-arch/Claude-speaks/blob/5d4c0fe9b3dd566fd7a3c221bff45d33e35b9cb4/README.md
      - https://github.com/tilo305/JARVIS-TEST-N8N/blob/1d6f4287c3325a218633bba6d9f2d9113ae4c2e6/scripts/check-env.mjs
      - https://github.com/prashantlv/ai-interviewer/blob/326fdbc667c34ffe7dfee55eccb65610e557e221/server/env.example
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.cartesia.ai/voices?limit=1
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Cartesia-Version: "2026-03-01"
            Accept: "application/json"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
