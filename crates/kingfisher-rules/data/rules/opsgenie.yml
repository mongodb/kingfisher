rules:
  - name: OpsGenie API Key
    id: kingfisher.opsgenie.1
    pattern: |
      (?xi)
      \b
      opsgenie
      (?:.|[\\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,32}?
      \b
      (
        [[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    examples:
      - opsgenie_api_key = '12345678-9abc-def0-1234-56789abcdef0'
    references:
      - https://docs.opsgenie.com/docs/api-overview
      - https://support.atlassian.com/security-and-access-policies/docs/send-alerts-to-opsgenie/
      - https://support.atlassian.com/opsgenie/docs/european-service-region/
      - https://github.com/acmesh-official/acme.sh/blob/2feb392bd0e3964d9bf68871ae804578d9d5ca80/notify/opsgenie.sh
      - https://github.com/projectdiscovery/nuclei-templates/blob/a165bbb8fd498d7dc59b755d8d5ba7561ac6f0c5/http/token-spray/api-opsgenie.yaml
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.opsgenie.com/v2/alerts
          headers:
            Authorization: "GenieKey {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [401, 403]
              negative: true
            - type: WordMatch
              words: ["Could not authenticate", "is not valid"]
              negative: true
