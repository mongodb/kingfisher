rules:
  - name: YouTube API Key
    id: kingfisher.youtube.1
    pattern: |
      (?x)
      \b
      (?i:youtube)
      (?:.|[\n\r]){0,32}?
      \b
      (
        AIza[a-zA-Z0-9_\-\\]{35}
      )
      \b
    min_entropy: 2.0
    confidence: medium
    examples:
      - '"youtube":{"api_key":"AIzaSyCKHtojSg-UNteBWlLUR2kHSgjGpUScYjk"'
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://www.googleapis.com/youtube/v3/videos?part=id&id=dummy&key={{ TOKEN }}
          response_matcher:
            - report_response: true
            # A key that is live but not enabled for YouTube can return 403.
            - type: StatusMatch
              status: [200, 403]
            - type: JsonValid
            # Only explicit invalid-key responses should make it inactive.
            - type: WordMatch
              words:
                - "API key not valid"
                - "keyInvalid"
                - "API_KEY_INVALID"
              match_all_words: false
              negative: true
    references:
      - https://developers.google.com/youtube/v3/getting-started#before-you-start
      - https://cloud.google.com/docs/authentication/api-keys
      - https://developers.google.com/youtube/v3/docs/videos/list
      - https://developers.google.com/youtube/v3/docs/errors
      - https://cloud.google.com/php/docs/reference/common-protos/latest/Api.ErrorReason
