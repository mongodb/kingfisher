rules:
  - name: Currencylayer API Key
    id: kingfisher.currencylayer.1
    pattern: |
      (?x)
      \b
      (?i:currencylayer)
      (?:.|[\n\r]){0,16}?
      (?i:SECRET|PRIVATE|ACCESS|KEY|TOKEN)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [[:xdigit:]]{32}
      )
      \b
    min_entropy: 3.0
    confidence: medium
    pattern_requirements:
      min_digits: 2
    examples:
      - currencylayer_access_key = "e99cb2c48c92a9f191b38107e2216719"
      - currencylayer_access_key = "9d98ea4f2736f75a15ca33dd9f811bbd"
      - currencylayer_access_key = "7ed1d04e69de75b40e16672d1b7f0c52"
      - currencylayer_access_key = "ae9f1ec891fe603c8ca0bcc20a09c165"
    references:
      - https://docs.apilayer.com/currencylayer/docs/getting-started
      - https://currencylayer.com/documentation
      - https://currencylayer.com/api-access
    validation:
      type: Http
      content:
        request:
          method: GET
          url: https://api.currencylayer.com/list?access_key={{ TOKEN }}
          headers:
            Accept: application/json
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: StatusMatch
              status: [401]
              negative: true
            - type: JsonValid
            - type: WordMatch
              words: ['"success":true']
