# Kingfisher operational capabilities for imported Betterleaks and Veles detectors.
#
# This is deliberately not a detection-rule catalog. Regexes, components, and confidence come
# from upstream during bundle generation. Entries bind an unqualified upstream rule/plugin ID to
# Kingfisher-specific validation, access-map, revocation, confidence, filtering, or bare-token
# derivation from upstream captures.
version: 1
betterleaks:
  # Derive bare token patterns from upstream captures; keep formats and validators upstream.
  deepseek-api-key:
    bare: true
    confidence: medium
  kimi-api-key:
    bare: true
    confidence: medium
  zai-api-key:
    bare: true
  voyageai-api-key:
    bare: true
    confidence: medium
  # These detector formats are live-validated by selected Veles adapters. Keep Betterleaks as the
  # catalog source for the remaining formats while suppressing only exact overlapping findings.
  cloudflare-api-key.1:
    filter_override: 'matchesAny(finding["line"], [`(?i)["'']?\b(?:CLOUDFLARE_API_TOKEN|CLOUDFLARE_API_KEY|CF_API_TOKEN|CF_API_KEY|CLOUDFLARE_TOKEN|CF_TOKEN|CLOUDFLARE_AUTH_KEY|CF_ACCOUNT_ID)\b["'']?\s*[=:].{0,20}?\b[A-Za-z0-9_-]{40}\b`])'
  digitalocean-pat:
    filter_override: 'true'
  generic-credential-uri:
    # Suppress only complete HTTPS credential URLs matched by the selected Veles adapters.
    # Host suffixes alone also hide unrelated hosts, ports, schemes, and empty usernames.
    filter_override: 'matchesAny(attributes["path"], [`(?i)(?:\.git[/\\]config|(?:^|[/\\])\.git-credentials|_history)$`]) && matchesAny(finding["captures"]["uri"], [`^https://[^:\s]+:[^\s@]+@(?:bitbucket\.org/[^\s]+\.git\b|git\.[^/]*codecatalyst\.aws/[^\s]*|git-codecommit\.[a-zA-Z\-0-9]+\.amazonaws\.com/[^\s]+)$`])'
    validation: CredentialUri
    # Database endpoints commonly use private-CA or self-signed certificates. Honored only when
    # the operator also passes `--tls-mode lax`. HTTPS Basic Auth is validated separately;
    # plaintext HTTP and unsupported schemes are not live-validated.
    tls_mode: lax
  npm-access-token:
    filter_override: 'finding["secret"].startsWith("npm_")'
  openrouter-api-key:
    filter_override: 'matchesAny(finding["secret"], [`^sk-or-v[0-9]+-[A-Za-z0-9_-]{20,}$`])'
  postman-api-token:
    filter_override: 'true'
  private-key:
    # Offline structural filtering, including compact and encrypted key containers.
    # Unknown algorithms remain candidates; this does not establish active access.
    filter_override: 'malformedPrivateKey(finding["secret"])'
    validation: Assumed
  sendgrid-api-token:
    filter_override: 'matchesAny(finding["secret"], [`^SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}$`])'
  slack-config-access-token:
    filter_override: 'matchesAny(finding["secret"], [`^xoxe\.xoxp-[0-9]{1,10}-[A-Za-z0-9]{166}$`])'
  slack-config-refresh-token:
    filter_override: 'matchesAny(finding["line"], [`xoxe-[0-9]{1,10}-[A-Za-z0-9]{147}`])'
  xai-api-key:
    filter_override: 'matchesAny(finding["secret"], [`^xai-[A-Za-z0-9]{80}$`])'

  browserstack-access-key.1:
    verify_candidates: [BROWSERSTACK_USERNAME_1]
  clickhouse-cloud-api-secret-key:
    verify_candidates: [CLICKHOUSE_CLOUD_KEY_ID]
  mongodb-atlas-service-account-secret:
    verify_candidates: [MONGODB_ATLAS_SERVICE_ACCOUNT_ID]
  planetscale-api-token:
    verify_candidates: [PLANETSCALE_ID]
  razorpay-key-secret.1:
    verify_candidates: [RAZORPAY_KEY_ID_1]
  wiz-client-secret.1:
    verify_candidates: [WIZ_CLIENT_ID_1]

  aws-access-token:
    verify_candidates: [AWS_SECRET_ACCESS_KEY]
    access_map:
      handler: aws
      inputs:
        secret: components.aws-secret-access-key
    revocation:
      type: AWS
    revocation_bindings:
      secret: components.aws-secret-access-key
      variables:
        AKID: finding.secret

  gcp-application-default-credentials:
    access_map:
      handler: gcp
  gcp-api-key:
    access_map:
      handler: gcp_api_key
    # API Keys v2: exact raw-key lookup, one deletion, bounded operation confirmation.
    # A pending/failed operation is indeterminate, never successful or safe to resubmit.
    revocation:
      type: Betterleaks
      content:
        expression: |
          let headers = {"Authorization": "Bearer " + env.get("GCP_ACCESS_TOKEN")};
          let lookup = http.get("https://apikeys.googleapis.com/v2/keys:lookupKey?keyString=" + strings.urlQueryEscape(finding.secret), headers);
          let name = lookup.json?.name ?? "";
          lookup.status != 200 || !(name matches "^projects/[0-9]+/locations/global/keys/[A-Za-z0-9_-]+$") ? {"result": "error", "reason": "Exact API key lookup failed"} : (
            let deletion = http.delete("https://apikeys.googleapis.com/v2/" + name, headers);
            let operation_name = deletion.json?.name ?? "";
            let operation = operation_name matches "^operations/[A-Za-z0-9_-][A-Za-z0-9_.-]*$" ? operation_name : "";
            deletion.status != 200 ? {"result": "unknown", "reason": "API key deletion was not confirmed"} : (
              let result = (deletion.json?.done ?? false) == true ? deletion : (
                operation != "" ? http.get("https://apikeys.googleapis.com/v2/" + operation, headers) : deletion
              );
              result.status == 200 && (result.json?.done ?? false) == true && result.json?.error == nil && (result.json?.response?.name ?? "") == name ? {"result": "revoked"} : {"result": "unknown", "reason": "Check the deletion operation before retrying", "metadata": {"operation": operation}}
            )
          )
  gcp-service-account:
    access_map:
      handler: gcp
    revocation:
      type: GCP

  azure-ad-client-secret:
    access_map:
      handler: azure_client_secret
      inputs:
        tenant_id: components.azure-tenant-id
        client_id: components.azure-client-id
  azure-storage-account-key:
    access_map:
      handler: azure_storage
      inputs:
        account: components.azure-storage-account-name
  algolia-api-key:
    access_map:
      handler: algolia
      inputs:
        app_id: components.algolia-application-id
  alibaba-secret-key:
    access_map:
      handler: alibaba
      inputs:
        access_key: components.alibaba-access-key-id
  alibaba-sts-access-key-secret:
    access_map:
      handler: alibaba
      inputs:
        access_key: components.alibaba-sts-access-key-id
        session_token: components.alibaba-sts-security-token
  artifactory-api-key:
    access_map:
      handler: artifactory
      inputs:
        host: components.artifactory-jfrog-url
  artifactory-reference-token:
    access_map:
      handler: artifactory
      inputs:
        host: components.artifactory-jfrog-url

  auth0-client-secret.1:
    access_map:
      handler: auth0
      inputs:
        client_id: components.auth0-client-id.1
        domain: components.auth0-domain.1

  salesforce-access-token.1:
    access_map:
      handler: salesforce
      inputs:
        instance: components.salesforce-instance-url.1

  airtable-oauth-token:
    access_map: { handler: airtable }
  airtable-personnal-access-token:
    access_map: { handler: airtable }
  anthropic-admin-api-key:
    access_map: { handler: anthropic }
  buildkite-user-access-token:
    access_map: { handler: buildkite }
    revocation:
      type: Http
      content:
        request:
          method: DELETE
          url: https://api.buildkite.com/v2/access-token
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [204]
  circleci-personal-token:
    access_map: { handler: circleci }
  circleci-project-token:
    access_map: { handler: circleci }
  fastly-api-token:
    access_map: { handler: fastly }
  harness-api-key:
    access_map: { handler: harness }
  huggingface-access-token:
    access_map: { handler: huggingface }
    revocation: &huggingface_revoke
      type: Http
      content:
        request:
          method: POST
          url: https://huggingface.co/api/credentials/revoke
          headers:
            Content-Type: application/json
          body: '{"credentials":["{{ TOKEN }}"]}'
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [202]
  huggingface-organization-api-token:
    access_map: { handler: huggingface }
    revocation: *huggingface_revoke
  ibm-cloud-user-api-key:
    access_map: { handler: ibm_cloud }
  monday-api-token.1:
    access_map: { handler: monday }
  openai-api-key:
    access_map: { handler: openai }
    # The owner supplies the exact project/key IDs; masked list entries are not a mapping.
    # Deleting a service-account-owned key must never delete the service account itself.
    revocation:
      type: Betterleaks
      content:
        expression: |
          let id = env.get("OPENAI_API_KEY_ID");
          let target = env.get("OPENAI_API_KEY_VALUE");
          let headers = {"Authorization": "Bearer " + env.get("OPENAI_ADMIN_KEY")};
          target == "" || target != finding.secret || !(id matches "^key_[A-Za-z0-9_-]+$") ? {"result": "error", "reason": "An exact owner-supplied token/key mapping is required"} : (
            finding.secret startsWith "sk-admin-" ? (
              let r = http.delete("https://api.openai.com/v1/organization/admin_api_keys/" + id, headers);
              r.status == 200 && (r.json?.object ?? "") == "organization.admin_api_key.deleted" && (r.json?.id ?? "") == id && (r.json?.deleted ?? false) == true ? {"result": "revoked"} : revoke.unknown(r)
            ) : (
              let project = env.get("OPENAI_PROJECT_ID");
              !(project matches "^proj_[A-Za-z0-9_-]+$") ? {"result": "error", "reason": "An exact project ID is required"} : (
                let r = http.delete("https://api.openai.com/v1/organization/projects/" + project + "/api_keys/" + id, headers);
                r.status == 200 && (r.json?.object ?? "") == "organization.project.api_key.deleted" && (r.json?.id ?? "") == id && (r.json?.deleted ?? false) == true ? {"result": "revoked"} : revoke.unknown(r)
              )
            )
          )

  anthropic-api-key:
    access_map: { handler: anthropic }
    revocation:
      type: Betterleaks
      content:
        expression: |
          let id = env.get("ANTHROPIC_API_KEY_ID");
          let target = env.get("ANTHROPIC_API_KEY_VALUE");
          let headers = {"x-api-key": env.get("ANTHROPIC_ADMIN_KEY"), "anthropic-version": "2023-06-01", "Content-Type": "application/json"};
          target == "" || target != finding.secret || !(id matches "^apikey_[A-Za-z0-9_-]+$") ? {"result": "error", "reason": "An exact owner-supplied token/key mapping is required"} : (
            let r = http.post("https://api.anthropic.com/v1/organizations/api_keys/" + id, headers, toJSON({"status": "inactive"}));
            r.status == 200 && (r.json?.type ?? "") == "api_key" && (r.json?.id ?? "") == id && (r.json?.status ?? "") == "inactive" ? {"result": "revoked"} : revoke.unknown(r)
          )

  notion-api-token:
    # Only OAuth access tokens owned by the supplied app, not internal tokens or PATs.
    revocation:
      type: Betterleaks
      content:
        expression: |
          let headers = {"Authorization": "Basic " + base64.encode(env.get("NOTION_CLIENT_ID") + ":" + env.get("NOTION_CLIENT_SECRET")), "Notion-Version": "2026-03-11", "Content-Type": "application/json"};
          let body = toJSON({"token": finding.secret});
          let before = http.post("https://api.notion.com/v1/oauth/introspect", headers, body);
          before.status != 200 || (before.json?.active ?? false) != true ? {"result": "error", "reason": "The supplied app did not confirm an active OAuth token"} : (
            let r = http.post("https://api.notion.com/v1/oauth/revoke", headers, body);
            r.status != 200 ? revoke.unknown(r) : (
              let after = http.post("https://api.notion.com/v1/oauth/introspect", headers, body);
              after.status == 200 && after.json?.active == false ? {"result": "revoked"} : revoke.unknown(after)
            )
          )

  resend-api-key.1:
    # Full-access management credential + exact UUID from the owner's creation record.
    revocation:
      type: Betterleaks
      content:
        expression: |
          let id = env.get("RESEND_API_KEY_ID");
          let target = env.get("RESEND_API_KEY_VALUE");
          let headers = {"Authorization": "Bearer " + env.get("RESEND_ADMIN_API_KEY")};
          target == "" || target != finding.secret || !(id matches "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$") ? {"result": "error", "reason": "An exact owner-supplied token/key mapping is required"} : (
            let r = http.delete("https://api.resend.com/api-keys/" + id, headers);
            r.status == 200 && (r.json?.object ?? "") == "api_key" && (r.json?.id ?? "") == id && (r.json?.deleted ?? false) == true ? {"result": "revoked"} : revoke.unknown(r)
          )

  twilio-api-key:
    # The detected SK value is a SID, not a secret. This fixed endpoint is US1 only.
    revocation:
      type: Betterleaks
      content:
        expression: |
          let headers = {"Authorization": "Basic " + base64.encode(env.get("TWILIO_ACCOUNT_SID") + ":" + env.get("TWILIO_AUTH_TOKEN"))};
          !(finding.secret matches "^SK[0-9a-fA-F]{32}$") ? {"result": "error", "reason": "An exact Twilio API key SID is required"} : (
            let r = http.delete("https://iam.twilio.com/v1/Keys/" + finding.secret, headers);
            r.status == 204 ? {"result": "revoked"} : revoke.unknown(r)
          )
  paypal-client-secret.1:
    access_map:
      handler: paypal
      inputs:
        client_id: components.paypal-client-id.1
  pinecone-api-key.1:
    access_map: { handler: pinecone }
  pinecone-api-key.2:
    access_map: { handler: pinecone }
  sendinblue-api-token:
    access_map: { handler: sendinblue }
  stripe-access-token:
    access_map: { handler: stripe }
    # Stripe test-mode keys are intentionally non-production credentials and should not be
    # reported as active credentials by Kingfisher.
    filter_override: 'finding["secret"].startsWith("sk_test_")'
  weights-and-biases-api-key:
    access_map: { handler: weights_and_biases }
  weights-and-biases-api-key-v1:
    access_map: { handler: weights_and_biases }

  github-app-token:
    access_map: { handler: github }
    # The public credentials endpoint supports user access (ghu_), NOT installation (ghs_).
    # Its 202 is only acceptance: do not turn it into a confirmed-revoked result.
    revocation:
      type: Betterleaks
      content:
        expression: |
          !(finding.secret matches "^ghu_[A-Za-z0-9]{36}$") ? {"result": "error", "reason": "Installation tokens are not supported by this endpoint"} : (
            let r = http.post("https://api.github.com/credentials/revoke", {"Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2026-03-10"}, toJSON({"credentials": [finding.secret]}));
            r.status == 202 ? {"result": "unknown", "reason": "Revocation accepted; completion is not reported by GitHub"} : revoke.unknown(r)
          )
  github-fine-grained-pat:
    access_map: { handler: github }
    revocation: &github_credential_revoke
      type: Http
      content:
        request:
          method: POST
          url: "{{ GITHUB_API_BASE_URL }}/credentials/revoke"
          headers:
            Accept: application/vnd.github+json
            X-GitHub-Api-Version: 2026-03-10
            Content-Type: application/json
          body: '{"credentials":["{{ TOKEN }}"]}'
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [202]
  github-oauth:
    access_map: { handler: github }
    revocation: *github_credential_revoke
  github-pat:
    access_map: { handler: github }
    revocation: *github_credential_revoke
  github-refresh-token:
    access_map: { handler: github }
    revocation: *github_credential_revoke

  jwt:
    validation: JWT
    # Self-hosted IdPs (Keycloak, ADFS, internal Auth0-alikes) commonly serve
    # JWKS from a private CA. Honored only under `--tls-mode lax`.
    tls_mode: lax

  mongodb-connection-string:
    # Only a wholly unresolved password is excluded: a templated username/host
    # alongside a literal password can still expose a credential.
    filter_override: 'matchesAny(finding["secret"], [`(?i)^mongodb(?:\+srv)?://[^@]*:(?:\$\([A-Z_][A-Z0-9_]*\)|\$\{[A-Z_][A-Z0-9_]*\}|\$[A-Z_][A-Z0-9_]*|\{\{\s*[A-Z_][A-Z0-9_.]*\s*\}\})@`])'
    validation: MongoDB
    # Atlas is publicly trusted, but self-managed clusters and RDS-style
    # deployments routinely use self-signed or private-CA certificates.
    # Honored only under `--tls-mode lax`.
    tls_mode: lax

  polymarket-private-key:
    validation:
      type: Ethereum
      content: private_key

  gitlab-cicd-job-token:
    access_map: &gitlab_access_map
      handler: gitlab
      reachable_2xx: true
  gitlab-deploy-token:
    access_map: *gitlab_access_map
  gitlab-pat:
    access_map: *gitlab_access_map
    revocation: &gitlab_pat_revoke
      type: Http
      content:
        request:
          method: DELETE
          url: "{{ GITLAB_API_BASE_URL }}/personal_access_tokens/self"
          headers:
            PRIVATE-TOKEN: "{{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [204]
  gitlab-pat-routable:
    access_map: *gitlab_access_map
    revocation: *gitlab_pat_revoke
  gitlab-pat-routable-versioned:
    access_map: *gitlab_access_map
    revocation: *gitlab_pat_revoke
  gitlab-ptt:
    access_map: *gitlab_access_map
  gitlab-rrt:
    access_map: *gitlab_access_map
  gitlab-runner-authentication-token:
    access_map: *gitlab_access_map
  gitlab-runner-authentication-token-routable:
    access_map: *gitlab_access_map

  doppler-api-token:
    revocation:
      type: Http
      content:
        request:
          method: POST
          url: https://api.doppler.com/v3/auth/revoke
          headers:
            Accept: application/json
            Content-Type: application/json
          body: '{"token":{{ TOKEN | json_escape }}}'
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
  crates-io-api-key:
    revocation:
      type: Http
      content:
        request:
          method: DELETE
          url: https://crates.io/api/v1/tokens/current
          headers:
            Authorization: "{{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [204]
  digitalocean-access-token:
    revocation:
      type: Http
      content:
        request:
          method: POST
          url: https://cloud.digitalocean.com/v1/oauth/revoke
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/x-www-form-urlencoded
          body: "token={{ TOKEN | url_encode }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
  heroku-api-key:
    revocation: &heroku_revoke
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_oauth_token_id
            request:
              method: GET
              url: https://api.heroku.com/oauth/authorizations
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: "Bearer {{ TOKEN }}"
                Range: "id ..; max=1000;"
              response_matcher:
                - type: StatusMatch
                  status: [200, 206]
                - type: JsonValid
            extract:
              OAUTH_TOKEN_ID:
                type: Regex
                pattern: '(?s)"access_token"\s*:\s*\{[^{}]*"id"\s*:\s*"([^"]+)"[^{}]*"token"\s*:\s*"{{ TOKEN }}"'
          - name: revoke_oauth_token
            request:
              method: DELETE
              url: https://api.heroku.com/oauth/tokens/{{ OAUTH_TOKEN_ID }}
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: "Bearer {{ TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200]
  heroku-api-key-v2:
    # Veles's trailing word boundary does not cover tokens ending in a hyphen.
    filter_override: 'matchesAny(finding["secret"], [`^HRKU-[0-9a-zA-Z_-]{60}\b$`])'
    revocation: *heroku_revoke
  slack-app-token:
    filter_override: 'matchesAny(finding["secret"], [`^xapp-[0-9]{1,10}-[A-Za-z0-9]{11}-[0-9]{13}-[A-Fa-f0-9]{64}$`])'
    revocation: &slack_revoke
      type: Http
      content:
        request:
          method: POST
          url: https://slack.com/api/auth.revoke
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/x-www-form-urlencoded
          body: "token={{ TOKEN | url_encode }}"
          response_matcher:
            - report_response: true
            - type: WordMatch
              words: ['"ok":true', '"revoked":true']
              match_all_words: true
  slack-bot-token:
    revocation: *slack_revoke
  slack-legacy-bot-token:
    revocation: *slack_revoke
  slack-legacy-workspace-token:
    revocation: *slack_revoke
  slack-legacy-token:
    revocation: *slack_revoke
  slack-user-token:
    revocation: *slack_revoke
  twitch-api-token:
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_client_id
            request:
              method: GET
              url: https://id.twitch.tv/oauth2/validate
              headers:
                Authorization: "OAuth {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - type: StatusMatch
                  status: [200]
                - type: JsonValid
            extract:
              CLIENT_ID:
                type: JsonPath
                path: $.client_id
          - name: revoke_token
            request:
              method: POST
              url: https://id.twitch.tv/oauth2/revoke
              headers:
                Content-Type: application/x-www-form-urlencoded
              body: "client_id={{ CLIENT_ID | url_encode }}&token={{ TOKEN | url_encode }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200]
  vercel-ai-gateway-key:
    # Owner creation records must bind the full candidate key to its exact key/team IDs.
    # Never infer this mapping from the list API's masked partialKey.
    revocation:
      type: Betterleaks
      content:
        expression: |
          let id = env.get("VERCEL_AI_GATEWAY_KEY_ID");
          let target = env.get("VERCEL_AI_GATEWAY_KEY_VALUE");
          let team = env.get("VERCEL_TEAM_ID");
          let headers = {"Authorization": "Bearer " + env.get("VERCEL_OWNER_TOKEN")};
          target == "" || target != finding.secret || !(id matches "^[A-Za-z0-9_-]+$") || !(team matches "^team_[A-Za-z0-9_-]+$") ? {"result": "error", "reason": "An exact owner-supplied token/key/team mapping is required"} : (
            let r = http.delete("https://api.vercel.com/v1/api-keys/" + id + "?teamId=" + team, headers);
            r.status == 204 ? {"result": "revoked"} : revoke.unknown(r)
          )

  vercel-api-token:
    revocation: &vercel_self_revoke
      type: Http
      content:
        request:
          method: DELETE
          url: https://api.vercel.com/v3/user/tokens/current
          headers:
            Authorization: "Bearer {{ TOKEN }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 204]
  vercel-integration-token:
    revocation: *vercel_self_revoke
  vercel-personal-access-token:
    revocation: *vercel_self_revoke
  vercel-app-access-token:
    revocation: &vercel_oauth_revoke
      type: Http
      content:
        request:
          method: POST
          url: https://api.vercel.com/login/oauth/token/revoke
          headers:
            Authorization: "Basic {{ NEXT_PUBLIC_VERCEL_APP_CLIENT_ID | default: VERCEL_APP_CLIENT_ID | append: ':' | append: VERCEL_APP_CLIENT_SECRET | b64enc }}"
            Content-Type: application/x-www-form-urlencoded
          body: "token={{ TOKEN | url_encode }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200, 204]
  vercel-app-refresh-token:
    revocation: *vercel_oauth_revoke

veles:
  secrets/cloudflareapitoken:
    revocation: &cloudflare_revoke
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_token_id
            request:
              method: GET
              url: https://api.cloudflare.com/client/v4/user/tokens/verify
              headers:
                Authorization: "Bearer {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - type: StatusMatch
                  status: [200]
                - type: JsonValid
            extract:
              TOKEN_ID:
                type: JsonPath
                path: $.result.id
          - name: revoke_token
            request:
              method: DELETE
              url: "https://api.cloudflare.com/client/v4/user/tokens/{{ TOKEN_ID }}"
              headers:
                Authorization: "Bearer {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200]
                - type: WordMatch
                  words: ['"success":true']
                  match_all_words: true
  secrets/digitaloceanapikey:
    revocation:
      type: Http
      content:
        request:
          method: POST
          url: https://cloud.digitalocean.com/v1/oauth/revoke
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/x-www-form-urlencoded
          body: "token={{ TOKEN | url_encode }}"
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
  secrets/herokuplatformkey:
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_oauth_token_id
            request:
              method: GET
              url: https://api.heroku.com/oauth/authorizations
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: "Bearer {{ TOKEN }}"
                Range: "id ..; max=1000;"
              response_matcher:
                - type: StatusMatch
                  status: [200, 206]
                - type: JsonValid
            extract:
              OAUTH_TOKEN_ID:
                type: Regex
                pattern: '(?s)"access_token"\s*:\s*\{[^{}]*"id"\s*:\s*"([^"]+)"[^{}]*"token"\s*:\s*"{{ TOKEN }}"'
          - name: revoke_oauth_token
            request:
              method: DELETE
              url: https://api.heroku.com/oauth/tokens/{{ OAUTH_TOKEN_ID }}
              headers:
                Accept: application/vnd.heroku+json; version=3
                Authorization: "Bearer {{ TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200]
  secrets/npmjsaccesstoken:
    revocation:
      type: HttpMultiStep
      content:
        steps:
          - name: lookup_token_id
            request:
              method: GET
              url: https://registry.npmjs.org/-/npm/v1/tokens
              headers:
                Authorization: "Bearer {{ TOKEN }}"
                Accept: application/json
              response_matcher:
                - type: StatusMatch
                  status: [200]
                - type: JsonValid
            extract:
              TOKEN_KEY:
                type: Regex
                pattern: '"key":"([^"]+)","token":"{{ TOKEN | prefix: 8 }}\.\.\.{{ TOKEN | suffix: 4 }}"'
          - name: revoke_token
            request:
              method: DELETE
              url: https://registry.npmjs.org/-/npm/v1/tokens/token/{{ TOKEN_KEY }}
              headers:
                Authorization: "Bearer {{ TOKEN }}"
              response_matcher:
                - report_response: true
                - type: StatusMatch
                  status: [200, 204]
  secrets/slackappleveltoken:
    revocation:
      type: Http
      content:
        request:
          method: POST
          url: https://slack.com/api/auth.revoke
          headers:
            Authorization: "Bearer {{ TOKEN }}"
            Content-Type: application/x-www-form-urlencoded
          body: "token={{ TOKEN | url_encode }}"
          response_matcher:
            - report_response: true
            - type: WordMatch
              words: ['"ok":true', '"revoked":true']
              match_all_words: true
