# Kingfisher 1.x -> 2.x rule-selector aliases.
#
# Generated with assistance and hand-curated. Each key is a Kingfisher 1.x rule-ID
# family (the `<family>` in `kingfisher.<family>.<n>`). Each value is a list of 2.x
# selectors that cover the same provider.
#
# Two jobs:
#  1. `--rule kingfisher.<family>.<n>` and `rules.disabled` entries from 1.x configs
#     keep resolving instead of hard-erroring, with a deprecation warning.
#  2. Coverage drift guard: `legacy_aliases_all_resolve` fails the build if an alias
#     target stops matching any built-in rule, i.e. if upstream drops a provider.
#
# Adding an entry is cheap. Removing one is a deliberate statement that Kingfisher no
# longer covers that provider - do it in the same change that drops the coverage.
