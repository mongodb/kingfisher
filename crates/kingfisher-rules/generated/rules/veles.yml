- name: Bitbucket Git Credentials
  id: veles.secrets/bitbucketcredentials
  pattern: (?P<TOKEN>\bhttps://(?P<GIT_USERNAME>[^:\s]+):(?P<GIT_PASSWORD>[^\s@]+)@bitbucket\.org/[^\s]+\.git\b)
  path: (?i)(?:\.git[/\\]config|(?:^|[/\\])\.git-credentials|_history)$
  validation:
    type: Http
    content:
      request:
        method: GET
        url: 'https://bitbucket.org/{{ TOKEN | split: ''@bitbucket.org/'' | last }}/info/refs?service=git-upload-pack'
        headers:
          Authorization: 'Basic {{ GIT_USERNAME | append: '':'' | append: GIT_PASSWORD | b64enc }}'
        response_matcher:
        - type: StatusMatch
          status:
          - 200
  betterleaks_secret_group: 0
  references:
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/gitbasicauth/bitbucket/detector.go
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/gitbasicauth/bitbucket/validator.go
- name: Bitwarden OAuth2 Client Secret
  id: veles.secrets/bitwardenoauth2access
  pattern: (?s)"user_(?P<TOKEN_ID>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})_token_apiKeyClientSecret"\s*:.{0,20}?"(?P<TOKEN>[A-Za-z0-9]{10,50})"
  path: (?i)bitwarden[ _-]*cli(?:[\/]+)data\.json$
  validation:
    type: Http
    content:
      request:
        method: POST
        url: https://identity.bitwarden.com/connect/token
        headers:
          Content-Type: application/x-www-form-urlencoded
        body: grant_type=client_credentials&scope=api&client_id=user.{{ TOKEN_ID | url_encode }}&client_secret={{ TOKEN | url_encode }}&deviceName=fireFox&twoFactorToken=0&deviceIdentifier=0&deviceType=0
        response_matcher:
        - type: StatusMatch
          status:
          - 200
  betterleaks_secret_group: 2
  references:
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/bitwardenoauth2access/detector.go
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/bitwardenoauth2access/validator.go
