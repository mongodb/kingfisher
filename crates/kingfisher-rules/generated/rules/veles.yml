- name: Heroku Platform Key
  id: veles.secrets/herokuplatformkey
  pattern: (\b(HRKU-[0-9a-zA-Z_-]{60})\b)
  validation:
    type: Http
    content:
      request:
        method: GET
        url: https://api.heroku.com/account
        headers:
          Accept: application/vnd.heroku+json; version=3
          Authorization: Bearer {{ TOKEN }}
        response_matcher:
        - type: StatusMatch
          status:
          - 200
  revocation:
    type: HttpMultiStep
    content:
      steps:
      - name: lookup_oauth_token_id
        request:
          method: GET
          url: https://api.heroku.com/oauth/authorizations
          headers:
            Accept: application/vnd.heroku+json; version=3
            Authorization: Bearer {{ TOKEN }}
            Range: id ..; max=1000;
          response_matcher:
          - type: StatusMatch
            status:
            - 200
            - 206
          - type: JsonValid
        extract:
          OAUTH_TOKEN_ID:
            type: Regex
            pattern: (?s)"access_token"\s*:\s*\{[^{}]*"id"\s*:\s*"([^"]+)"[^{}]*"token"\s*:\s*"{{ TOKEN }}"
      - name: revoke_oauth_token
        request:
          method: DELETE
          url: https://api.heroku.com/oauth/tokens/{{ OAUTH_TOKEN_ID }}
          headers:
            Accept: application/vnd.heroku+json; version=3
            Authorization: Bearer {{ TOKEN }}
          response_matcher:
          - report_response: true
          - type: StatusMatch
            status:
            - 200
  betterleaks_secret_group: 0
  references:
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/herokuplatformkey/detector.go
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/herokuplatformkey/validator.go
- name: npm Access Token
  id: veles.secrets/npmjsaccesstoken
