    content:
      request:
        method: GET
        url: https://registry.npmjs.org/-/whoami
        headers:
          Authorization: Bearer {{ TOKEN }}
        response_matcher:
        - type: StatusMatch
          status:
          - 200
  revocation:
    type: HttpMultiStep
    content:
      steps:
      - name: lookup_token_id
        request:
          method: GET
          url: https://registry.npmjs.org/-/npm/v1/tokens
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
          - type: StatusMatch
            status:
            - 200
          - type: JsonValid
        extract:
