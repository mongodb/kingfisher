          url: https://registry.npmjs.org/-/npm/v1/tokens/token/{{ TOKEN_KEY }}
          headers:
            Authorization: Bearer {{ TOKEN }}
          response_matcher:
          - report_response: true
          - type: StatusMatch
            status:
