- name: Cloudflare API Token
  id: veles.secrets/cloudflareapitoken
  pattern: (?s)(?i)["']?\b(?:CLOUDFLARE_API_TOKEN|CLOUDFLARE_API_KEY|CF_API_TOKEN|CF_API_KEY|CLOUDFLARE_TOKEN|CF_TOKEN|CLOUDFLARE_AUTH_KEY|CF_ACCOUNT_ID)\b["']?\s*[=:].{0,20}?(\b[A-Za-z0-9_-]{40}\b)
  validation:
    type: Http
    content:
      request:
        method: GET
        url: https://api.cloudflare.com/client/v4/zones
        headers:
          Authorization: Bearer {{ TOKEN }}
        response_matcher:
        - type: StatusMatch
          status:
          - 200
  revocation:
    type: HttpMultiStep
    content:
      steps:
      - name: lookup_token_id
        request:
          method: GET
          url: https://api.cloudflare.com/client/v4/user/tokens/verify
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
          - type: StatusMatch
            status:
            - 200
          - type: JsonValid
        extract:
          TOKEN_ID:
            type: JsonPath
            path: $.result.id
      - name: revoke_token
        request:
          method: DELETE
          url: https://api.cloudflare.com/client/v4/user/tokens/{{ TOKEN_ID }}
          headers:
            Authorization: Bearer {{ TOKEN }}
            Accept: application/json
          response_matcher:
          - report_response: true
          - type: StatusMatch
            status:
            - 200
          - type: WordMatch
            words:
            - '"success":true'
            match_all_words: true
  betterleaks_secret_group: 0
  references:
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/cloudflareapitoken/detector.go
  - https://raw.githubusercontent.com/google/osv-scalibr/e8621f1fff93beb5b70e5d6ba5fdc3e9854ec845/veles/secrets/cloudflareapitoken/validator.go
