rules:
- name: Database connection string password (double quoted)
  id: kingfisher.connection-string.password.double-quoted
  pattern: |
    (?xi)
    (?:^|[;\s'"=(])
    (?:server|host|data[\t\x20]+source|dsn)[\t\x20]*=[\t\x20]*
    [^\s;'"{}][^;'"{}\r\n]{0,127}[\t\x20]*;
    (?:[^'"{}\r\n]{0,200};)?[\t\x20]*
    (?:password|pwd)[\t\x20]*=[\t\x20]*
    "([^"\r\n]{4,128})"[\t\x20]*(?:;|[\r\n']|$)
  confidence: medium
  min_entropy: 0
  pattern_requirements:
    ignore_if_contains:
    - ${
    - $(
    - '#{'
    - '{{'
    - '$env:'
    - redacted
    - masked
    - filtered
    - '****'
    - xxxx
    - placeholder
    - your_password
    - yourpassword
    - your-password
    - your password
    - insert_password
    - replace_password
    - changeme
    - change_me
    - change-me
    - change.me
    - change me
    - replaceme
    - replace_me
    - replace-me
    - replace.me
    - replace me
  examples:
  - Server=db.example.com;User Id=app;Password="Xk9mQ2;vL7pR4wZ8q";
  - Host=db.example.com;Password="weak";
  - Host=db.example.com;Password="process.env.DB_PASSWORD";
  negative_examples:
  - Password="Xk9mQ2;vL7pR4wZ8q";
  - Host=db.example.com;Password="${DB_PASSWORD}";
  - Host=db.example.com;Password="[REDACTED]";
  - Host=db.example.com;Password="YOUR_PASSWORD_HERE";
  - Host=db.example.com;Password="Xk9mQ2vL7pR4wZ8q;
  references:
  - https://github.com/mongodb/kingfisher/issues/558
  - https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/connection-strings
  - https://learn.microsoft.com/en-us/sql/connect/odbc/dsn-connection-string-attribute
  - https://www.npgsql.org/doc/connection-string-parameters.html
  - https://learn.microsoft.com/en-us/sql/connect/jdbc/building-the-connection-url
- name: Database JDBC query password
  id: kingfisher.connection-string.password.jdbc-query
  pattern: |
    (?xi)
    \bjdbc:(?:postgresql|mariadb|mysql(?::(?:loadbalance|replication))?)://
    [a-z0-9\[][a-z0-9.:\[\]%,_-]{0,255}
    (?:/[^?&\s;\#'"\x60{}<>]{0,200})?\?
    (?:[a-z_][a-z0-9_.-]{0,63}(?:=[^&\s;\#'"\x60{}<>]{0,200})?&(?:amp;)?){0,16}
    (?-i:password)=([^&\s;\#'"\x60{}<>]{4,128})
    (?:[&\s;\#'"\x60<>]|$)
  confidence: medium
  min_entropy: 0
  pattern_requirements:
    ignore_if_contains:
    - ${
    - $(
    - '#{'
    - '{{'
    - '$env:'
    - redacted
    - masked
    - filtered
    - '****'
    - xxxx
    - placeholder
    - your_password
    - yourpassword
    - your-password
    - your password
    - insert_password
    - replace_password
    - changeme
    - change_me
    - change-me
    - change.me
    - change me
    - replaceme
    - replace_me
    - replace-me
    - replace.me
    - replace me
    - db_password
    - database_password
    - process.env
    - os.environ
    - config.
    - config[
    - settings.
    - settings[
    - secret.
    - secrets.
    - secrets[
    - credential.
    - credentials.
    - credentials[
    - getpassword(
    - getenv(
  examples:
  - jdbc:postgresql://db.example.com:5432/app?user=app&password=Zq8vN3kL0pW2xR7t&ssl=true
  - jdbc:mysql://db.example.com/app?password=Xk9%23mQ2%21vL7pR4wZ&user=app
  - jdbc:mariadb://db.example.com/app?user=app&password=weak
  negative_examples:
  - jdbc:postgresql://db.example.com/app?user=app
  - jdbc:postgresql://db.example.com/app?password=
  - jdbc:mysql://db.example.com/app?PASSWORD=Zq8vN3kL0pW2xR7t
  - jdbc:postgresql://db.example.com/app?notpassword=Zq8vN3kL0pW2xR7t
  - jdbc:postgresql://db.example.com/app?password=${DB_PASSWORD}
  - jdbc:sqlserver://db.example.com;integratedSecurity=true;
  - jdbc:oracle:thin:@db.example.com:1521/APP
  references:
  - https://github.com/mongodb/kingfisher/issues/558
  - https://jdbc.postgresql.org/documentation/use/
  - https://dev.mysql.com/doc/connector-j/en/connector-j-reference-jdbc-url-format.html
  - https://mariadb.com/docs/connectors/mariadb-connector-j/about-mariadb-connector-j
