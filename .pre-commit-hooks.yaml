- id: kingfisher-auto
  name: kingfisher (auto-install)
  description: Automatically downloads and caches the Kingfisher binary, then scans staged changes. No manual installation required.
  entry: scripts/kingfisher-pre-commit-auto.sh
  language: script
  pass_filenames: false
  stages: [pre-commit]

- id: kingfisher-docker
  name: kingfisher (docker)
  description: Run Kingfisher in Docker against staged changes at the repository root. Requires Docker but no local install.
  entry: ghcr.io/mongodb/kingfisher:latest
  language: docker
  args: ["scan", ".", "--staged", "--quiet", "--no-update-check"]
  pass_filenames: false
  stages: [pre-commit]

- id: kingfisher
  name: kingfisher
  description: Scan staged changes with the locally installed Kingfisher binary.
  entry: kingfisher
  language: system
  args: ["scan", ".", "--staged", "--quiet", "--no-update-check"]
  pass_filenames: false
  types: [file]
  stages: [pre-commit]

- id: kingfisher-auto-files
  name: kingfisher (auto-install, selected files)
  description: Automatically downloads and caches Kingfisher, then scans files selected by the hook runner.
  entry: scripts/kingfisher-pre-commit-auto.sh --pre-commit-files
  language: script
  args: ['']
  pass_filenames: true
  require_serial: true
  types: [file]
  stages: [pre-commit]

- id: kingfisher-docker-files
  name: kingfisher (docker, selected files)
  description: Scan files selected by the hook runner using the published Kingfisher image.
  entry: ghcr.io/mongodb/kingfisher:latest scan --pre-commit-files --quiet --no-update-check
  language: docker_image
  args: ['']
  pass_filenames: true
  require_serial: true
  types: [file]
  stages: [pre-commit]

- id: kingfisher-files
  name: kingfisher (selected files)
  description: Scan files selected by the hook runner with the locally installed Kingfisher binary.
  entry: kingfisher scan --pre-commit-files --quiet --no-update-check
  language: system
  args: ['']
  pass_filenames: true
  require_serial: true
  types: [file]
  stages: [pre-commit]
